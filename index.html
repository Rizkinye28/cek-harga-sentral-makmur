<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
Cek Harga - Sentral Makmur
</title>


<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f4f5f7;

  font-family: Arial, sans-serif;

  color: #222;

}


.container {

  max-width: 520px;

  margin: auto;

  padding: 18px;

}


.title {

  text-align: center;

  font-size: 26px;

  font-weight: bold;

  margin-top: 8px;

}


.subtitle {

  text-align: center;

  color: #777;

  margin-bottom: 18px;

}


.card {

  background: white;

  padding: 16px;

  border-radius: 18px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.08);

}


/* CAMERA */

#reader {

  position: relative;

  width: 100%;

  height: 340px;

  background: #111;

  border-radius: 15px;

  overflow: hidden;

}


#reader video {

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.camera-message {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px;

  color: white;

  text-align: center;

}


.scan-box {

  position: absolute;

  left: 5%;

  right: 5%;

  top: 30%;

  height: 40%;

  border: 2px solid white;

  border-radius: 8px;

  z-index: 5;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.25);

}


.scan-line {

  position: absolute;

  left: 5%;

  right: 5%;

  top: 50%;

  height: 2px;

  background: white;

  z-index: 6;

  box-shadow:
    0 0 10px white;

}


.scan-hint {

  position: absolute;

  bottom: 12px;

  left: 0;

  right: 0;

  text-align: center;

  color: white;

  font-size: 13px;

  z-index: 7;

}


/* BUTTON */

button {

  width: 100%;

  padding: 15px;

  margin-top: 12px;

  border: none;

  border-radius: 12px;

  font-size: 16px;

  font-weight: bold;

}


.scan-button {

  background: #1f4e78;

  color: white;

}


.stop-button {

  background: #ddd;

  color: #222;

  display: none;

}


/* SEARCH */

.search-area {

  margin-top: 16px;

}


.search-title {

  font-size: 14px;

  font-weight: bold;

  margin-bottom: 7px;

}


.manual {

  display: flex;

  gap: 8px;

}


input {

  flex: 1;

  min-width: 0;

  padding: 14px;

  border: 1px solid #ccc;

  border-radius: 12px;

  font-size: 16px;

}


.check-button {

  width: auto;

  margin-top: 0;

  background: #1f4e78;

  color: white;

}


.clear-button {

  background: #eee;

  color: #222;

}


/* STATUS */

.status {

  text-align: center;

  margin-top: 10px;

  font-size: 13px;

  color: #777;

}


/* RESULT */

.result {

  margin-top: 18px;

}


.product-card {

  background: #eef8f1;

  padding: 18px;

  border-radius: 15px;

  text-align: center;

}


.product-name {

  font-size: 19px;

  font-weight: bold;

  line-height: 1.4;

}


.product-barcode {

  margin-top: 7px;

  font-size: 13px;

  color: #777;

}


.price {

  font-size: 36px;

  font-weight: bold;

  margin-top: 10px;

}


.result-item {

  background: white;

  border: 1px solid #ddd;

  border-radius: 13px;

  padding: 14px;

  margin-top: 9px;

}


.result-item-name {

  font-weight: bold;

  line-height: 1.4;

}


.result-item-barcode {

  font-size: 12px;

  color: #888;

  margin-top: 4px;

}


.result-item-price {

  font-size: 20px;

  font-weight: bold;

  margin-top: 7px;

}


.error {

  margin-top: 18px;

  padding: 16px;

  border-radius: 14px;

  background: #fff1f1;

  color: #b42318;

  text-align: center;

  font-weight: bold;

}


.footer {

  text-align: center;

  margin-top: 15px;

  font-size: 12px;

  color: #888;

}

</style>

</head>


<body>


<div class="container">


<div class="title">
SENTRAL MAKMUR
</div>


<div class="subtitle">
CEK HARGA PRODUK
</div>


<div class="card">


<div id="reader">

  <div
    class="camera-message"
    id="cameraMessage">

    Memuat scanner...

  </div>

</div>


<div
  id="status"
  class="status">

  Memuat data produk...

</div>


<button
  id="startButton"
  class="scan-button"
  onclick="startScanner()">

  📷 MULAI SCAN

</button>


<button
  id="stopButton"
  class="stop-button"
  onclick="stopScanner()">

  ⏹ HENTIKAN SCAN

</button>


<div class="search-area">


<div class="search-title">

🔎 Barcode atau nama produk

</div>


<div class="manual">


<input
  id="searchInput"
  type="text"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
  placeholder="AMZ003 / CHOCOLATE">


<button
  class="check-button"
  onclick="searchProduct()">

  CEK

</button>


</div>


<button
  class="clear-button"
  onclick="clearSearch()">

  HAPUS

</button>


</div>


<div id="result"></div>


</div>


<div class="footer">

Scan barcode atau cari nama produk

</div>


</div>


<script>


/* =====================================
   CONFIG
===================================== */


/*
 * GANTI URL DI BAWAH INI
 * dengan URL /exec Apps Script kamu.
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzCIC_CqDz406f9DCpg9hihD_Jgqw5b-yfwjOrNm7F-eRwUeR-D4uSOyi3KqZRTVpw/exec';


/* =====================================
   DATA
===================================== */

let products = [];

let scannerControls = null;

let codeReader = null;

let stream = null;

let lastBarcode = '';

let lastScanTime = 0;


/* =====================================
   LOAD DATA
===================================== */

function loadProducts() {


  const status =
    document.getElementById(
      'status'
    );


  status.innerText =
    '⏳ Mengambil data produk...';


  const callbackName =
    'produkCallback_' +
    Date.now();


  window[callbackName] =
    function(data) {


      try {

        products =
          Array.isArray(data)
            ? data
            : [];


        status.innerText =

          '✓ ' +

          products.length +

          ' produk siap digunakan';


      }

      catch (error) {


        console.error(
          error
        );


        status.innerText =
          'Data produk bermasalah.';

      }


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;


  script.src =
    API_URL +

    '?callback=' +

    callbackName;


  script.onerror =
    function() {


      status.innerText =
        'Gagal mengambil data produk.';


      tampilkanError(
        'Tidak dapat terhubung ke server produk.'
      );


      delete window[
        callbackName
      ];

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =====================================
   START CAMERA
===================================== */

async function startScanner() {


  try {


    if (!navigator.mediaDevices) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    document
      .getElementById(
        'startButton'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'stopButton'
      )
      .style.display =
      'block';


    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML =
      '';


    const video =
      document.createElement(
        'video'
      );


    video.autoplay =
      true;

    video.muted =
      true;

    video.playsInline =
      true;


    video.setAttribute(
      'playsinline',
      ''
    );


    reader.appendChild(
      video
    );


    const box =
      document.createElement(
        'div'
      );


    box.className =
      'scan-box';


    reader.appendChild(
      box
    );


    const line =
      document.createElement(
        'div'
      );


    line.className =
      'scan-line';


    reader.appendChild(
      line
    );


    const hint =
      document.createElement(
        'div'
      );


    hint.className =
      'scan-hint';


    hint.innerText =
      'Arahkan barcode ke kotak';


    reader.appendChild(
      hint
    );


    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    let deviceId =
      devices[0].deviceId;


    /*
     * Cari kamera belakang
     */

    for (
      const device of devices
    ) {


      const label =
        String(
          device.label || ''
        )
        .toLowerCase();


      if (

        label.includes(
          'back'
        ) ||

        label.includes(
          'rear'
        ) ||

        label.includes(
          'environment'
        )

      ) {


        deviceId =
          device.deviceId;


        break;

      }

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {
              exact: deviceId
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            facingMode: {
              ideal: 'environment'
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    document
      .getElementById(
        'status'
      )
      .innerText =
      '📷 Scanner aktif';


    scannerControls =
      await codeReader
        .decodeFromStream(

          stream,

          video,

          function(
            result,
            error
          ) {


            if (!result) {

              return;

            }


            const barcode =
              String(
                result.getText()
              )
              .trim()
              .toUpperCase();


            const now =
              Date.now();


            if (

              barcode ===
              lastBarcode &&

              now -
              lastScanTime <
              2000

            ) {

              return;

            }


            lastBarcode =
              barcode;


            lastScanTime =
              now;


            document
              .getElementById(
                'searchInput'
              )
              .value =
              barcode;


            searchBarcode(
              barcode
            );


          }

        );


  }

  catch (error) {


    console.error(
      error
    );


    tampilkanError(

      'Kamera tidak dapat digunakan.' +

      '<br><br>' +

      aman(
        error.message ||
        error.name ||
        ''
      )

    );


    stopScanner();

  }

}


/* =====================================
   STOP CAMERA
===================================== */

function stopScanner() {


  try {

    if (
      scannerControls
    ) {

      scannerControls.stop();

    }

  }

  catch (e) {}


  scannerControls =
    null;


  try {

    if (
      codeReader
    ) {

      codeReader.reset();

    }

  }

  catch (e) {}


  codeReader =
    null;


  if (stream) {


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


  }


  stream =
    null;


  document
    .getElementById(
      'stopButton'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'startButton'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'reader'
    )
    .innerHTML =

    '<div class="camera-message">' +

      'Tekan MULAI SCAN untuk membuka kamera' +

    '</div>';

}


/* =====================================
   SEARCH
===================================== */

function searchProduct() {


  const input =
    document.getElementById(
      'searchInput'
    );


  const keyword =
    String(
      input.value || ''
    )
    .trim()
    .toUpperCase();


  input.value =
    keyword;


  if (!keyword) {

    tampilkanError(
      'Masukkan barcode atau nama produk.'
    );


    return;

  }


  /*
   * Barcode exact
   */

  const exact =
    products.find(
      function(product) {


        return (

          String(
            product.barcode || ''
          )
          .trim()
          .toUpperCase() ===
          keyword

        );

      }
    );


  if (exact) {

    tampilkanProduk(
      exact
    );


    return;

  }


  /*
   * Cari nama
   */

  const hasil =
    products.filter(
      function(product) {


        const name =
          String(
            product.name || ''
          )
          .toUpperCase();


        const barcode =
          String(
            product.barcode || ''
          )
          .toUpperCase();


        return (

          name.includes(
            keyword
          ) ||

          barcode.includes(
            keyword
          )

        );

      }
    );


  if (
    hasil.length === 0
  ) {


    tampilkanError(
      'Produk tidak ditemukan.'
    );


    return;

  }


  if (
    hasil.length === 1
  ) {


    tampilkanProduk(
      hasil[0]
    );


    return;

  }


  tampilkanDaftar(
    hasil
  );

}


function searchBarcode(
  barcode
) {


  const product =
    products.find(
      function(item) {


        return (

          String(
            item.barcode || ''
          )
          .trim()
          .toUpperCase() ===
          barcode

        );

      }
    );


  if (product) {


    tampilkanProduk(
      product
    );


  }

  else {


    tampilkanError(

      'Barcode tidak ditemukan.' +

      '<br><br>' +

      'Barcode: ' +

      aman(
        barcode
      )

    );

  }

}


/* =====================================
   RESULT
===================================== */

function tampilkanProduk(
  product
) {


  document
    .getElementById(
      'result'
    )
    .innerHTML =

    '<div class="product-card">' +

      '<div class="product-name">' +

        aman(
          product.name
        ) +

      '</div>' +

      '<div class="product-barcode">' +

        'Barcode: ' +

        aman(
          product.barcode
        ) +

      '</div>' +

      '<div class="price">' +

        'Rp ' +

        aman(
          product.price
        ) +

      '</div>' +

    '</div>';

}


function tampilkanDaftar(
  hasil
) {


  let html =

    '<div style="font-weight:bold;">' +

      '🔎 Ditemukan ' +

      hasil.length +

      ' produk' +

    '</div>';


  hasil.forEach(
    function(product) {


      html +=

        '<div class="result-item">' +

          '<div class="result-item-name">' +

            aman(
              product.name
            ) +

          '</div>' +

          '<div class="result-item-barcode">' +

            'Barcode: ' +

            aman(
              product.barcode
            ) +

          '</div>' +

          '<div class="result-item-price">' +

            'Rp ' +

            aman(
              product.price
            ) +

          '</div>' +

        '</div>';

    }
  );


  document
    .getElementById(
      'result'
    )
    .innerHTML =
    html;

}


function clearSearch() {


  document
    .getElementById(
      'searchInput'
    )
    .value =
    '';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
    '';

}


/* =====================================
   ERROR
===================================== */

function tampilkanError(
  text
) {


  document
    .getElementById(
      'result'
    )
    .innerHTML =

    '<div class="error">' +

      text +

    '</div>';

}


/* =====================================
   SAFE
===================================== */

function aman(
  text
) {


  return String(
    text
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =====================================
   UPPERCASE
===================================== */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    function() {

      this.value =
        this.value
          .toUpperCase();

    }
  );


document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        searchProduct();

      }

    }
  );


/* =====================================
   LOAD DATA
===================================== */

loadProducts();

</script>

</body>

</html>
