<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sentral Makmur - Cek Harga & Stok</title>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #151515;
}

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
}

/* ================================
   HEADER
================================ */

header {
  text-align: center;
  padding: 22px 0 20px;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin-top: 7px;
  color: #777;
  font-size: 17px;
}

/* ================================
   SEARCH
================================ */

.search-card {
  background: white;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input-wrap {
  flex: 1;
  position: relative;
}

input {
  width: 100%;
  height: 56px;
  padding: 0 48px 0 17px;
  border: 2px solid #ddd;
  border-radius: 15px;
  font-size: 17px;
  outline: none;
}

input:focus {
  border-color: #111;
}

.clear {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 24px;
  color: #777;
  cursor: pointer;
  display: none;
  padding: 0;
}

button {
  border: none;
  border-radius: 15px;
  padding: 0 23px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-gray {
  background: #eee;
  color: #555;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-row button {
  height: 50px;
  flex: 1;
}

/* ================================
   CAMERA
================================ */

.scanner-card {
  margin-top: 15px;
  background: #111;
  border-radius: 20px;
  padding: 12px;
  display: none;
}

.scanner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  margin-bottom: 10px;
}

.scanner-title {
  font-size: 16px;
  font-weight: 700;
}

.close-camera {
  background: #333;
  color: white;
  padding: 8px 13px;
  border-radius: 9px;
  font-size: 13px;
}

.video-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
  width: 100%;
  height: min(58vw, 430px);
  min-height: 260px;
}

/*
  Kamera tetap penuh.
*/
video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #000;
}

/*
  KOTAK SCAN LEBIH KECIL
*/
.scan-box {
  position: absolute;

  width: 62%;
  height: 24%;

  left: 19%;
  top: 38%;

  border: 2px solid white;
  border-radius: 12px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.22);

  pointer-events: none;
}

.scan-box::before,
.scan-box::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 25px;
}

.scan-box::before {
  left: -2px;
  top: -2px;

  border-left: 4px solid #fff;
  border-top: 4px solid #fff;
  border-radius: 8px 0 0 0;
}

.scan-box::after {
  right: -2px;
  bottom: -2px;

  border-right: 4px solid #fff;
  border-bottom: 4px solid #fff;
  border-radius: 0 0 8px 0;
}

.scan-status {
  text-align: center;
  color: #fff;
  font-size: 13px;
  margin-top: 9px;
  opacity: .85;
}

.zoom-info {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-top: 5px;
}

/* ================================
   RESULT
================================ */

.result-card {
  margin-top: 15px;
  background: white;
  border-radius: 22px;
  padding: 27px;
  min-height: 210px;
  box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px 10px;
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.empty-title {
  font-size: 21px;
  font-weight: 700;
  color: #333;
  margin-bottom: 7px;
}

.product {
  display: none;
}

.product-name {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 18px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
}

.info {
  background: #f5f5f5;
  border-radius: 14px;
  padding: 15px;
}

.label {
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.value {
  font-size: 18px;
  font-weight: 700;
}

.stock {
  background: #111;
  color: white;
}

.stock .label {
  color: #bbb;
}

.stock .value {
  font-size: 25px;
}

.search-results {
  display: none;
  margin-top: 15px;
}

.result-item {
  background: #f5f5f5;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 8px;
  cursor: pointer;
}

.result-item:hover {
  background: #eaeaea;
}

.result-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.result-item-code {
  color: #777;
  font-size: 13px;
}

.loading {
  text-align: center;
  padding: 28px;
  color: #777;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 35px 0;
  color: #aaa;
  font-size: 13px;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

  header {
    padding-top: 15px;
  }

  h1 {
    font-size: 27px;
  }

  .subtitle {
    font-size: 15px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    height: 52px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .result-card {
    padding: 21px;
  }

  .product-name {
    font-size: 22px;
  }

  .video-wrap {
    height: 62vw;
    min-height: 250px;
  }

  .scan-box {
    width: 68%;
    height: 25%;
    left: 16%;
    top: 37.5%;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <h1>
    Sentral Makmur
  </h1>

  <div class="subtitle">
    Cek Harga & Stok Produk
  </div>

</header>


<section class="search-card">


  <div class="search-row">

    <div class="search-input-wrap">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>


    <button
      id="searchBtn"
      class="btn-black"
      type="button"
    >
      Cari
    </button>

  </div>


  <div class="action-row">

    <button
      id="scanBtn"
      class="btn-black"
      type="button"
    >
      📷 Scan Barcode
    </button>

    <button
      id="resetBtn"
      class="btn-gray"
      type="button"
    >
      Reset
    </button>

  </div>

</section>


<!-- ================================
     CAMERA
================================ -->

<section
  id="scannerCard"
  class="scanner-card"
>

  <div class="scanner-header">

    <div class="scanner-title">

    </div>

    <button

      autoplay
      muted

    id="scanStatus"

  >

  <div

  >
    Zoom 1×
  </div>


</section>


<div
  id="searchResults"
  class="search-results"
></div>


<section
  id="resultCard"
  class="result-card"
>


  <div
    id="emptyState"
    class="empty"
  >

    <div class="empty-icon">
      🔎
    </div>

    <div class="empty-title">
      Cari produk
    </div>

    <div>
      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

  </div>


  <div
    id="loading"
    class="loading"
    style="display:none;"

    Mengambil data stok dari Accurate...
  </div>

    style="display:none;"
  ></div>


  <div
    id="product"
    class="product"
  >

    <div
      id="productName"
      class="product-name"
    ></div>


    <div class="info-grid">


      <div class="info">

        <div class="label">
          Barcode
        </div>

        <div
          id="productBarcode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Kode Accurate
        </div>

        <div
          id="productCode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Harga
        </div>

        <div
          id="productPrice"
          class="value"
        ></div>

      </div>


      <div class="info stock">

        <div class="label">
          Stok
        </div>

        <div
          id="productStock"
          class="value"
        ></div>

      </div>


    </div>

  </div>


</section>


<footer>
  Sentral Makmur • API Harga & Stok
</footer>


</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');

const scanStatus =
  document.getElementById('scanStatus');

const zoomInfo =
  document.getElementById('zoomInfo');


/* =====================================================
   VARIABEL
===================================================== */

let codeReader = null;

let currentStream = null;

let currentTrack = null;

let scanning = false;

let masterCache = null;

let audioContext = null;


/*
 * ZOOM
 */

let zoomMin = 1;

let zoomMax = 1;

let currentZoom = 1;

let zoomTimer = null;

let zoomCycle = 0;


/*
 * ZXING LOOP
 */

let decodeActive = false;


/* =====================================================
   AUDIO
===================================================== */

function siapkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === 'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {

    console.log(
      'Audio tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function bunyiBeep() {

  try {

    siapkanAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.setValueAtTime(
      1100,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.4,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.16
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.16
    );

  }

  catch(error) {

    console.log(
      'Beep gagal:',
      error
    );

  }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        80,
        40,
        120
      ]);

    }

  }

  catch(error) {

    console.log(
      'Getar tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   FEEDBACK
===================================================== */

function feedbackProduk() {

  bunyiBeep();

  getarBerhasil();

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);


/* =====================================================
   INPUT
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display =
      'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cari();

    }

  }
);


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(value) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   MASTER CACHE
===================================================== */

async function ambilMasterCache() {

  if (
    Array.isArray(masterCache)
  ) {

    return masterCache;

  }


  const response =
    await fetch(
      API_URL +
      '?aksi=master'
    );


  const json =
    await response.json();


  if (
    !json.success ||
    !Array.isArray(json.data)
  ) {

    throw new Error(
      'Master Produk tidak tersedia.'
    );

  }


  masterCache =
    json.data;


  return masterCache;

}


/* =====================================================
   CARI
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


async function cari() {

  const keyword =
    searchInput.value.trim();


  if (!keyword) {

    resetResult();

    return;

  }


  tutupScanner();

  tampilLoading();


  try {

    const master =
      await ambilMasterCache();


    const target =
      normalisasi(keyword);


    const hasil =
      master.filter(
        function(item) {

          const barcode =
            normalisasi(
              item.barcode
            );


          const nama =
            normalisasi(
              item.nama ||
              item.name
            );


          const kode =
            normalisasi(
              item.kodeAccurate ||
              item.no
            );


          const id =
            normalisasi(
              item.id
            );


          return (

            barcode.includes(target)

            ||

            nama.includes(target)

            ||

            kode.includes(target)

            ||

            id === target

          );

        }
      );


    if (
      hasil.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan di Master Produk.'
      );

      return;

    }


    if (
      hasil.length === 1
    ) {

      await tampilProduk(
        hasil[0]
      );

      return;

    }


    tampilDaftarHasil(
      hasil.slice(0, 50)
    );

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Tidak dapat mengambil data produk.'
    );

  }

}


/* =====================================================
   HASIL PENCARIAN
===================================================== */

function tampilDaftarHasil(data) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'block';

  searchResults.innerHTML =
    '';


  data.forEach(
    function(item) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'result-item';


      div.innerHTML =

        '<div class="result-item-name">' +

        escapeHtml(
          item.nama ||
          item.name ||
          '-'
        ) +

        '</div>' +

        '<div class="result-item-code">' +

        'Barcode: ' +

        escapeHtml(
          item.barcode ||
          '-'
        ) +

        ' • Kode: ' +

        escapeHtml(
          item.kodeAccurate ||
          item.no ||
          '-'
        ) +

        '</div>';


      div.addEventListener(
        'click',
        function() {

          tampilProduk(
            item
          );

        }
      );


      searchResults.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   TAMPIL PRODUK
===================================================== */

async function tampilProduk(item) {

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  loading.style.display =
    'block';


  try {

    const params =
      new URLSearchParams();


    params.set(
      'aksi',
      'stok'
    );


    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (item.kodeAccurate) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString()
      );


    const json =
      await response.json();


    if (
      !json.success
    ) {

      tampilError(
        json.error ||
        'Stok gagal diambil dari Accurate.'
      );

      return;

    }


    const data =
      json.data;


    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      data.harga ||
      '-';


    document.getElementById(
      'productStock'
    ).textContent =

      String(
        data.stok ??
        data.stock ??
        0
      )

      +

      ' ' +

      (
        data.satuan ||
        'PCS'
      );


    loading.style.display =
      'none';

    product.style.display =
      'block';


    /*
     * BEEP + GETAR
     * ketika produk sudah benar-benar muncul
     */

    feedbackProduk();

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Gagal mengambil stok dari Accurate.'
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  loading.style.display =
    'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(message) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display =
    'block';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

}


/* =====================================================
   SCAN BUTTON
===================================================== */

scanBtn.addEventListener(
  'click',
  async function() {

    /*
     * Audio harus diaktifkan
     * dari klik user.
     */

    siapkanAudio();

    await bukaScanner();

  }
);


/* =====================================================
   BUKA KAMERA
===================================================== */

async function bukaScanner() {

  /*
   * Bersihkan kamera lama.
   */

  tutupScanner();


  scannerCard.style.display =
    'block';


  scanning =
    true;


  scanStatus.textContent =
    'Membuka kamera belakang...';


  try {

    /*
     * ==========================================
     * KAMERA BELAKANG
     * ==========================================
     *
     * PENTING:
     * gunakan ideal, BUKAN exact.
     *
     * exact kadang menyebabkan kamera hitam
     * pada HP/browser tertentu.
     */

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            min: 15
          }

        }

      });


    /*
     * PASANG STREAM KE VIDEO
     */

    video.srcObject =
      currentStream;


    /*
     * Jangan lupa playsinline
     */

    video.setAttribute(
      'playsinline',
      'true'
    );


    video.muted =
      true;


    /*
     * Tunggu video benar-benar punya frame.
     */

    await new Promise(
      function(resolve) {

        if (
          video.readyState >= 2
        ) {

          resolve();

          return;

        }


        video.onloadedmetadata =
          function() {

            resolve();

          };

      }
    );


    await video.play();


    /*
     * Ambil track.
     */

    const tracks =
      currentStream.getVideoTracks();


    if (
      !tracks.length
    ) {

      throw new Error(
        'Track kamera tidak ditemukan.'
      );

    }


    currentTrack =
      tracks[0];


    console.log(
      'KAMERA AKTIF:',
      currentTrack.label
    );


    /*
     * SIAPKAN ZOOM
     */

    siapkanZoom();


    /*
     * STATUS
     */

    scanStatus.textContent =
      'Arahkan barcode ke kotak';


    /*
     * MULAI ZXING
     */

    mulaiZXing();


    /*
     * MULAI ZOOM BERTAHAP
     */

    mulaiAutoZoom();


  }

  catch(error) {

    console.error(
      'Kamera error:',
      error
    );


    /*
     * Fallback sederhana.
     */

    try {

      tutupScanner();


      scannerCard.style.display =
        'block';


      scanning =
        true;


      currentStream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });


      video.srcObject =
        currentStream;


      await video.play();


      const tracks =
        currentStream.getVideoTracks();


      if (
        !tracks.length
      ) {

        throw new Error(
          'Kamera kosong.'
        );

      }


      currentTrack =
        tracks[0];


      siapkanZoom();

      mulaiZXing();

      mulaiAutoZoom();


      scanStatus.textContent =
        'Arahkan barcode ke kotak';


    }

    catch(error2) {

      console.error(
        'Fallback kamera error:',
        error2
      );


      tutupScanner();


      alert(
        'Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
      );

    }

  }

}


/* =====================================================
   ZXING
===================================================== */

function mulaiZXing() {

  try {

    /*
     * Bersihkan reader lama.
     */

    if (
      codeReader
    ) {

      try {

        codeReader.reset();

      }

      catch(e) {}

    }


    codeReader =
      new ZXing.BrowserMultiFormatReader();


    decodeActive =
      true;


    /*
     * ZXing membaca VIDEO YANG SUDAH KITA
     * buka sendiri.
     *
     * Jadi tidak meminta kamera kedua.
     */

    codeReader.decodeFromVideoElement(
      video,
      function(result, error) {

        if (
          result &&
          scanning &&
          decodeActive
        ) {

          berhasilScan(
            result.getText()
          );

        }

      }
    );

  }

  catch(error) {

    console.error(
      'ZXing gagal:',
      error
    );

  }

}


/* =====================================================
   BERHASIL SCAN
===================================================== */

function berhasilScan(
  text
) {

  if (
    !scanning
  ) {

    return;

  }


  /*
   * STOP SECEPATNYA
   */

  scanning =
    false;

  decodeActive =
    false;


  hentikanAutoZoom();


  /*
   * BEEP + GETAR
   * langsung ketika barcode terbaca.
   */

  bunyiBeep();

  getarBerhasil();


  /*
   * Masukkan barcode.
   */

  searchInput.value =
    text;


  clearBtn.style.display =
    'block';


  scanStatus.textContent =
    'Barcode berhasil dibaca!';


  /*
   * Tutup kamera.
   */

  tutupScanner();


  /*
   * Cari produk.
   */

  cari();

}


/* =====================================================
   SIAPKAN ZOOM
===================================================== */

function siapkanZoom() {

  try {

    if (
      !currentTrack
    ) {

      return;

    }


    const capabilities =
      currentTrack.getCapabilities();


    if (
      !capabilities.zoom
    ) {

      zoomMin =
        1;

      zoomMax =
        1;

      currentZoom =
        1;

      zoomInfo.textContent =
        'Zoom otomatis tidak tersedia di kamera ini';

      return;

    }


    zoomMin =
      Number(
        capabilities.zoom.min
      ) || 1;


    const hardwareMax =
      Number(
        capabilities.zoom.max
      ) || 1;


    /*
     * BATAS MAKSIMAL 3X
     *
     * Tidak boleh lebih dari 3.
     */

    zoomMax =
      Math.min(
        hardwareMax,
        3
      );


    /*
     * Mulai selalu 1X.
     */

    currentZoom =
      Math.max(
        zoomMin,
        1
      );


    terapkanZoom(
      currentZoom
    );


    zoomInfo.textContent =
      'Zoom ' +
      formatZoom(
        currentZoom
      );

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   FORMAT ZOOM
===================================================== */

function formatZoom(
  value
) {

  return Number(
    value
  ).toFixed(1).replace(
    '.0',
    ''
  ) + '×';

}


/* =====================================================
   TERAPKAN ZOOM
===================================================== */

function terapkanZoom(
  zoom
) {

  if (
    !currentTrack
  ) {

    return;

  }


  const target =
    Math.min(
      zoomMax,
      Math.max(
        zoomMin,
        zoom
      )
    );


  currentZoom =
    target;


  zoomInfo.textContent =
    'Zoom ' +
    formatZoom(
      target
    );


  try {

    currentTrack.applyConstraints({

      advanced: [
        {
          zoom: target
        }
      ]

    }).catch(
      function(error) {

        console.log(
          'Apply zoom gagal:',
          error
        );

      }
    );

  }

  catch(error) {

    console.log(
      'Zoom error:',
      error
    );

  }

}


/* =====================================================
   AUTO ZOOM
===================================================== */

/*
 * POLA:
 *
 * 1×
 * ↓
 * tunggu
 *
 * 2×
 * ↓
 * tunggu
 *
 * 3×
 * ↓
 * kembali 1×
 *
 * lalu ulang.
 *
 * Ini jauh lebih aman daripada
 * zoom terus menerus 0.2 → 0.4 → 0.6 dst.
 */

function mulaiAutoZoom() {

  hentikanAutoZoom();


  if (
    !currentTrack ||
    zoomMax <= 1
  ) {

    return;

  }


  zoomCycle =
    0;


  /*
   * Pastikan awal 1X.
   */

  terapkanZoom(
    1
  );


  /*
   * Tunggu 1.1 detik sebelum 2X.
   */

  zoomTimer =
    setTimeout(
      function() {

        if (
          !scanning
        ) {

          return;

        }


        naikKeZoom2();

      },
      1100
    );

}


/* =====================================================
   ZOOM 2X
===================================================== */

function naikKeZoom2() {

  if (
    !scanning
  ) {

    return;

  }


  const target =
    Math.min(
      2,
      zoomMax
    );


  terapkanZoom(
    target
  );


  /*
   * Tunggu 1.1 detik.
   */

  zoomTimer =
    setTimeout(
      function() {

        if (
          !scanning
        ) {

          return;

        }


        naikKeZoom3();

      },
      1100
    );

}


/* =====================================================
   ZOOM 3X
===================================================== */

function naikKeZoom3() {

  if (
    !scanning
  ) {

    return;

  }


  if (
    zoomMax >= 3
  ) {

    terapkanZoom(
      3
    );

  }


  else {

    terapkanZoom(
      zoomMax
    );

  }


  /*
   * Setelah 1.2 detik
   * kembali 1X.
   */

  zoomTimer =
    setTimeout(
      function() {

        if (
          !scanning
        ) {

          return;

        }


        kembaliKe1X();

      },
      1200
    );

}


/* =====================================================
   KEMBALI 1X
===================================================== */

function kembaliKe1X() {

  if (
    !scanning
  ) {

    return;

  }


  terapkanZoom(
    1
  );


  /*
   * Ulangi siklus.
   */

  zoomTimer =
    setTimeout(
      function() {

        if (
          !scanning
        ) {

          return;

        }


        naikKeZoom2();

      },
      900
    );

}


/* =====================================================
   STOP AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

  if (
    zoomTimer
  ) {

    clearTimeout(
      zoomTimer
    );

    clearInterval(
      zoomTimer
    );

    zoomTimer =
      null;

  }

}


/* =====================================================
   TUTUP SCANNER
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  function() {

    tutupScanner();

  }
);


function tutupScanner() {

  scanning =
    false;

  decodeActive =
    false;


  /*
   * Stop zoom.
   */

  hentikanAutoZoom();


  /*
   * Stop ZXing.
   */

  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        'ZXing reset:',
        error
      );

    }

  }


  codeReader =
    null;


  /*
   * Stop kamera.
   */

  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          }

          catch(error) {}

        }
      );

  }


  /*
   * Lepaskan video.
   */

  if (
    video.srcObject
  ) {

    video.pause();

    video.srcObject =
      null;

  }


  currentStream =
    null;

  currentTrack =
    null;


  currentZoom =
    1;


  zoomInfo.textContent =
    'Zoom 1×';


  /*
   * Hide.
   */

  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
