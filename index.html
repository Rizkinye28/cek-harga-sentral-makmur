<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sentral Makmur - Cek Harga & Stok</title>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #151515;
}

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
}

header {
  text-align: center;
  padding: 20px 0 22px;
}

.logo {
  display: none;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin-top: 7px;
  color: #777;
  font-size: 17px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-card {
  background: white;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input-wrap {
  flex: 1;
  position: relative;
}

input {
  width: 100%;
  height: 56px;
  padding: 0 48px 0 18px;
  border: 2px solid #ddd;
  border-radius: 16px;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #111;
}

.clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 25px;
  color: #777;
  cursor: pointer;
  display: none;
}

button {
  border: none;
  border-radius: 16px;
  padding: 0 25px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-gray {
  background: #eee;
  color: #555;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-row button {
  height: 52px;
  flex: 1;
}


/* =====================================================
   CAMERA
===================================================== */

.scanner-card {
  margin-top: 15px;
  background: #111;
  border-radius: 20px;
  padding: 12px;
  display: none;
}

.scanner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  margin-bottom: 10px;
}

.scanner-title {
  font-size: 16px;
  font-weight: 700;
}

.close-camera {
  background: #333;
  color: white;
  padding: 8px 13px;
  border-radius: 10px;
  font-size: 14px;
}


/* =====================================================
   VIDEO
===================================================== */

.video-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
  width: 100%;
  aspect-ratio: 4 / 3;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #000;
}


/*
   KOTAK SCAN LEBIH KECIL
*/

.scan-box {
  position: absolute;

  width: 58%;
  height: 25%;

  left: 21%;
  top: 37.5%;

  border: 2px solid white;
  border-radius: 12px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.25);

  pointer-events: none;
}


/*
   GARIS SCAN
*/

.scan-line {
  position: absolute;

  left: 5%;
  right: 5%;

  top: 50%;

  height: 2px;

  background: white;

  opacity: .85;

  box-shadow:
    0 0 8px rgba(255,255,255,.8);

  pointer-events: none;
}


/*
   TEKS ZOOM
*/

.zoom-status {
  margin-top: 9px;
  color: #bbb;
  text-align: center;
  font-size: 13px;
}

.zoom-control {
  margin-top: 8px;
  color: white;
}

.zoom-control input {
  height: auto;
  padding: 0;
}


/* =====================================================
   RESULT
===================================================== */

.result-card {
  margin-top: 15px;
  background: white;
  border-radius: 24px;
  padding: 28px;
  min-height: 210px;
  box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px 10px;
}

.empty-icon {
  font-size: 46px;
  margin-bottom: 10px;
}

.empty-title {
  font-size: 21px;
  font-weight: 700;
  color: #333;
  margin-bottom: 8px;
}

.product {
  display: none;
}

.product-name {
  font-size: 27px;
  font-weight: 800;
  margin-bottom: 20px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.info {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 16px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 6px;
}

.value {
  font-size: 19px;
  font-weight: 700;
}

.stock {
  background: #111;
  color: white;
}

.stock .label {
  color: #bbb;
}

.stock .value {
  font-size: 26px;
}

.search-results {
  display: none;
  margin-top: 15px;
}

.result-item {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 9px;
  cursor: pointer;
}

.result-item:hover {
  background: #eaeaea;
}

.result-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.result-item-code {
  color: #777;
  font-size: 13px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 35px 0;
  color: #aaa;
  font-size: 14px;
}


@media(max-width:600px) {

  header {
    padding-top: 18px;
  }

  h1 {
    font-size: 28px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    height: 54px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .result-card {
    padding: 22px;
  }

  .product-name {
    font-size: 22px;
  }

  .scan-box {
    width: 64%;
    height: 24%;
    left: 18%;
    top: 38%;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <h1>
    Sentral Makmur
  </h1>

  <div class="subtitle">
    Cek Harga & Stok Produk
  </div>

</header>


<section class="search-card">

  <div class="search-row">

    <div class="search-input-wrap">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>

    <button
      id="searchBtn"
      class="btn-black"
      type="button"
    >
      Cari
    </button>

  </div>


  <div class="action-row">

    <button
      id="scanBtn"
      class="btn-black"
      type="button"
    >
      📷 Scan Barcode
    </button>

    <button
      id="resetBtn"
      class="btn-gray"
      type="button"
    >
      Reset
    </button>

  </div>

</section>


<!-- =====================================================
     CAMERA
===================================================== -->

<section
  id="scannerCard"
  class="scanner-card"
>

  <div class="scanner-header">

    <div class="scanner-title">
      Scan Barcode
    </div>

    <button
      id="closeCameraBtn"
      class="close-camera"
      type="button"
    >
      Tutup
    </button>

  </div>


  <div class="video-wrap">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="scan-box"></div>

    <div class="scan-line"></div>

  </div>


  <div
    id="zoomStatus"
    class="zoom-status"
  >
    Zoom 1x • Mencari barcode...
  </div>


  <div
    id="zoomControl"
    class="zoom-control"
  >

    <input
      id="zoomRange"
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
    >

  </div>

</section>


<div
  id="searchResults"
  class="search-results"
></div>


<section
  id="resultCard"
  class="result-card"
>


  <div
    id="emptyState"
    class="empty"
  >

    <div class="empty-icon">
      🔎
    </div>

    <div class="empty-title">
      Cari produk
    </div>

    <div>
      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

  </div>


  <div
    id="loading"
    class="loading"
    style="display:none;"
  >
    Mengambil data stok dari Accurate...
  </div>


  <div
    id="errorState"
    class="error"
    style="display:none;"
  ></div>


  <div
    id="product"
    class="product"
  >

    <div
      id="productName"
      class="product-name"
    ></div>


    <div class="info-grid">


      <div class="info">

        <div class="label">
          Barcode
        </div>

        <div
          id="productBarcode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Kode Accurate
        </div>

        <div
          id="productCode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Harga
        </div>

        <div
          id="productPrice"
          class="value"
        ></div>

      </div>


      <div class="info stock">

        <div class="label">
          Stok
        </div>

        <div
          id="productStock"
          class="value"
        ></div>

      </div>


    </div>

  </div>


</section>


<footer>
  Sentral Makmur • API Harga & Stok
</footer>


</div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const zoomRange =
  document.getElementById('zoomRange');

const zoomStatus =
  document.getElementById('zoomStatus');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');


/* =====================================================
   VARIABLES
===================================================== */

let currentStream = null;
let currentTrack = null;

let codeReader = null;

let scanning = false;

let masterCache = null;

let audioContext = null;


/*
   AUTO ZOOM

   1x → 2x → 3x

   TIDAK BOLEH TURUN.
*/

let zoomLevel = 1;

let zoomTimer = null;

let zoomSupported = false;

let zoomMin = 1;

let zoomMax = 3;

let zoomStep = 0.1;


/* =====================================================
   AUDIO
===================================================== */

function siapkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === 'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {

    console.log(
      'Audio tidak tersedia:',
      error
    );

  }

}


function bunyiBeep() {

  try {

    siapkanAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      'sine';

    oscillator.frequency.setValueAtTime(
      1200,
      audioContext.currentTime
    );

    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.45,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.18
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.18
    );

  }

  catch(error) {

    console.log(
      'Beep gagal:',
      error
    );

  }

}


function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        80,
        40,
        120
      ]);

    }

  }

  catch(error) {

    console.log(
      'Getar gagal:',
      error
    );

  }

}


function feedbackProduk() {

  bunyiBeep();

  getarBerhasil();

}


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(value) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   CACHE MASTER
===================================================== */

async function ambilMasterCache() {

  if (
    Array.isArray(masterCache)
  ) {

    return masterCache;

  }

  const response =
    await fetch(
      API_URL +
      '?aksi=master'
    );

  const json =
    await response.json();

  if (
    !json.success ||
    !Array.isArray(json.data)
  ) {

    throw new Error(
      'Master Produk tidak tersedia.'
    );

  }

  masterCache =
    json.data;

  return masterCache;

}


/* =====================================================
   SEARCH
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


searchInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cari();

    }

  }
);


async function cari() {

  const keyword =
    searchInput.value.trim();

  if (!keyword) {

    resetResult();

    return;

  }

  tutupScanner();

  tampilLoading();

  try {

    const master =
      await ambilMasterCache();

    const target =
      normalisasi(keyword);

    const hasil =
      master.filter(
        function(item) {

          const barcode =
            normalisasi(
              item.barcode
            );

          const nama =
            normalisasi(
              item.nama ||
              item.name
            );

          const kode =
            normalisasi(
              item.kodeAccurate ||
              item.no
            );

          const id =
            normalisasi(
              item.id
            );

          return (

            barcode.includes(target)

            ||

            nama.includes(target)

            ||

            kode.includes(target)

            ||

            id === target

          );

        }
      );


    if (
      hasil.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan di Master Produk.'
      );

      return;

    }


    if (
      hasil.length === 1
    ) {

      await tampilProduk(
        hasil[0]
      );

      return;

    }


    tampilDaftarHasil(
      hasil.slice(0, 50)
    );

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Tidak dapat mengambil data produk.'
    );

  }

}


/* =====================================================
   HASIL PENCARIAN
===================================================== */

function tampilDaftarHasil(data) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'block';

  searchResults.innerHTML =
    '';


  data.forEach(
    function(item) {

      const div =
        document.createElement(
          'div'
        );

      div.className =
        'result-item';

      div.innerHTML =

        '<div class="result-item-name">' +

        escapeHtml(
          item.nama ||
          item.name ||
          '-'
        ) +

        '</div>' +

        '<div class="result-item-code">' +

        'Barcode: ' +

        escapeHtml(
          item.barcode ||
          '-'
        ) +

        ' • Kode: ' +

        escapeHtml(
          item.kodeAccurate ||
          item.no ||
          '-'
        ) +

        '</div>';

      div.addEventListener(
        'click',
        function() {

          tampilProduk(item);

        }
      );

      searchResults.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   TAMPIL PRODUK
===================================================== */

async function tampilProduk(item) {

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  loading.style.display =
    'block';


  try {

    const params =
      new URLSearchParams();

    params.set(
      'aksi',
      'stok'
    );


    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (item.kodeAccurate) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString()
      );


    const json =
      await response.json();


    if (!json.success) {

      tampilError(
        json.error ||
        'Stok gagal diambil dari Accurate.'
      );

      return;

    }


    const data =
      json.data;


    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      data.harga ||
      '-';


    document.getElementById(
      'productStock'
    ).textContent =

      String(
        data.stok ??
        data.stock ??
        0
      ) +

      ' ' +

      (
        data.satuan ||
        'PCS'
      );


    loading.style.display =
      'none';

    product.style.display =
      'block';


    /*
      BIP + GETAR
      setelah produk benar-benar tampil.
    */

    feedbackProduk();

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Gagal mengambil stok dari Accurate.'
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  loading.style.display =
    'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(message) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display =
    'block';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

}


/* =====================================================
   CLEAR
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   SCAN BUTTON
===================================================== */

scanBtn.addEventListener(
  'click',
  function() {

    siapkanAudio();

    bukaScanner();

  }
);


/* =====================================================
   BUKA KAMERA
===================================================== */

async function bukaScanner() {

  /*
    Bersihkan kamera lama.
  */

  tutupScanner();


  scannerCard.style.display =
    'block';


  scanning =
    true;


  /*
    RESET ZOOM SETIAP KALI
    KAMERA DIBUKA.
  */

  zoomLevel =
    1;

  zoomRange.value =
    1;

  zoomStatus.textContent =
    'Zoom 1x • Mencari barcode...';


  try {

    /*
      PENTING:

      Jangan gunakan:

      facingMode: {
        exact: 'environment'
      }

      karena beberapa HP membuat
      kamera menjadi hitam.

      Kita gunakan ideal environment.
    */

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        }

      });


    video.srcObject =
      currentStream;


    await video.play();


    const tracks =
      currentStream.getVideoTracks();


    if (
      !tracks.length
    ) {

      throw new Error(
        'Track kamera tidak ditemukan.'
      );

    }


    currentTrack =
      tracks[0];


    console.log(
      'Kamera aktif:',
      currentTrack.label
    );


    /*
      SIAPKAN ZOOM
    */

    siapkanZoom(
      currentTrack
    );


    /*
      MULAI ZXING
    */

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    codeReader.decodeFromVideoElement(
      video,
      function(result, error) {

        if (
          !result ||
          !scanning
        ) {

          return;

        }


        /*
          BARCODE BERHASIL
        */

        scanning =
          false;


        /*
          STOP ZOOM
        */

        hentikanAutoZoom();


        /*
          BEEP + GETAR
        */

        bunyiBeep();

        getarBerhasil();


        const text =
          result.getText();


        console.log(
          'BARCODE TERBACA:',
          text
        );


        searchInput.value =
          text;


        clearBtn.style.display =
          'block';


        /*
          TUTUP KAMERA
        */

        tutupScanner();


        /*
          CARI PRODUK
        */

        cari();

      }
    );


    /*
      MULAI URUTAN AUTO ZOOM
    */

    mulaiAutoZoom();

  }

  catch(error) {

    console.error(
      'Camera error:',
      error
    );


    tutupScanner();


    alert(
      'Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
    );

  }

}


/* =====================================================
   SIAPKAN ZOOM
===================================================== */

function siapkanZoom(track) {

  zoomSupported =
    false;


  try {

    const capabilities =
      track.getCapabilities();


    if (
      !capabilities.zoom
    ) {

      console.log(
        'Kamera tidak mendukung hardware zoom.'
      );

      zoomRange.style.display =
        'none';

      zoomStatus.textContent =
        'Zoom otomatis tidak tersedia di kamera ini.';

      return;

    }


    zoomSupported =
      true;


    zoomMin =
      Number(
        capabilities.zoom.min || 1
      );


    zoomMax =
      Number(
        capabilities.zoom.max || 3
      );


    zoomStep =
      Number(
        capabilities.zoom.step || 0.1
      );


    /*
      KITA BATASI MAKSIMAL 3X.

      Walaupun kamera mendukung
      8x / 10x / 20x, aplikasi
      tidak akan melewati 3x.
    */

    zoomMax =
      Math.min(
        zoomMax,
        3
      );


    zoomLevel =
      Math.max(
        1,
        zoomMin
      );


    zoomRange.min =
      zoomMin;

    zoomRange.max =
      zoomMax;

    zoomRange.step =
      zoomStep;

    zoomRange.value =
      zoomLevel;

    zoomRange.style.display =
      'block';


    terapkanZoom(
      track,
      zoomLevel
    );


  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

    zoomSupported =
      false;

    zoomRange.style.display =
      'none';

  }

}


/* =====================================================
   AUTO ZOOM LOCKED
===================================================== */

/*
   INI BAGIAN PALING PENTING.

   Tidak ada lagi:

   1x → 2x → 3x → 2x → 1x

   Sekarang hanya:

   1x
    ↓
   2x
    ↓
   3x
    ↓
   STOP
*/

function mulaiAutoZoom() {

  hentikanAutoZoom();


  if (
    !zoomSupported ||
    !currentTrack
  ) {

    return;

  }


  /*
    Tunggu kamera benar-benar
    tampil terlebih dahulu.
  */

  zoomTimer =
    setTimeout(
      function() {

        if (
          !scanning ||
          !currentTrack
        ) {

          return;

        }


        /*
          1X → 2X
        */

        if (
          zoomLevel < 2
        ) {

          ubahZoom(
            2
          );


          /*
            Setelah 2x beri waktu
            ZXing mencoba membaca.
          */

          zoomTimer =
            setTimeout(
              function() {

                if (
                  scanning
                ) {

                  /*
                    2X → 3X
                  */

                  ubahZoom(
                    3
                  );

                }

              },
              1200
            );


          return;

        }


        /*
          2X → 3X
        */

        if (
          zoomLevel < 3
        ) {

          ubahZoom(
            3
          );

          return;

        }


        /*
          SUDAH 3X.

          JANGAN TURUN.
          JANGAN NAIK.
          JANGAN LOOP.
        */

      },

      1500
    );

}


/* =====================================================
   UBAH ZOOM
===================================================== */

function ubahZoom(level) {

  if (
    !currentTrack ||
    !zoomSupported ||
    !scanning
  ) {

    return;

  }


  /*
    Zoom hanya boleh naik.
  */

  if (
    level <= zoomLevel
  ) {

    return;

  }


  /*
    Batasi maksimal 3x.
  */

  level =
    Math.min(
      level,
      3,
      zoomMax
    );


  zoomLevel =
    level;


  zoomRange.value =
    level;


  zoomStatus.textContent =
    'Zoom ' +
    level +
    'x • Mencari barcode...';


  terapkanZoom(
    currentTrack,
    level
  );

}


/* =====================================================
   TERAPKAN ZOOM
===================================================== */

function terapkanZoom(
  track,
  zoom
) {

  if (
    !track
  ) {

    return;

  }


  try {

    track.applyConstraints({

      advanced: [

        {
          zoom:
            Number(zoom)
        }

      ]

    }).catch(
      function(error) {

        console.log(
          'Gagal menerapkan zoom:',
          error
        );

      }
    );

  }

  catch(error) {

    console.log(
      'Zoom error:',
      error
    );

  }

}


/* =====================================================
   STOP AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

  if (
    zoomTimer
  ) {

    clearTimeout(
      zoomTimer
    );

    zoomTimer =
      null;

  }

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

zoomRange.addEventListener(
  'input',
  function() {

    if (
      !currentTrack
    ) {

      return;

    }


    const value =
      Number(
        zoomRange.value
      );


    /*
      Manual zoom boleh digunakan.

      Tapi setelah user menggeser,
      auto zoom dihentikan supaya
      tidak berantem dengan slider.
    */

    hentikanAutoZoom();


    zoomLevel =
      value;


    zoomStatus.textContent =
      'Zoom ' +
      value +
      'x';


    terapkanZoom(
      currentTrack,
      value
    );

  }
);


/* =====================================================
   TUTUP KAMERA
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  tutupScanner
);


function tutupScanner() {

  scanning =
    false;


  hentikanAutoZoom();


  /*
    STOP ZXING
  */

  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        'ZXing reset:',
        error
      );

    }

  }


  /*
    STOP STREAM
  */

  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          }

          catch(error) {}

        }
      );

  }


  /*
    PUTUS VIDEO
  */

  if (
    video.srcObject
  ) {

    video.srcObject =
      null;

  }


  /*
    RESET SEMUA
  */

  currentStream =
    null;

  currentTrack =
    null;

  codeReader =
    null;

  zoomSupported =
    false;

  zoomLevel =
    1;

  zoomRange.value =
    1;


  /*
    HIDE CAMERA
  */

  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);

</script>
