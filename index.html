<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Cek Harga - Sentral Makmur</title>

  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-top: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    /* =====================================
       CAMERA
    ===================================== */

    #reader {
      position: relative;
      width: 100%;
      height: 350px;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
    }

    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-message {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      color: white;
      text-align: center;

      z-index: 10;
    }

    /* Area barcode */

    .scan-box {
      position: absolute;

      left: 4%;
      right: 4%;

      top: 27%;
      height: 46%;

      border: 2px solid white;
      border-radius: 8px;

      z-index: 20;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.20);
    }

    .scan-line {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 50%;

      height: 2px;

      background: white;

      z-index: 21;

      box-shadow:
        0 0 10px white;

      pointer-events: none;
    }

    .scan-hint {
      position: absolute;

      bottom: 10px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;

      font-size: 13px;

      z-index: 22;

      text-shadow:
        0 1px 3px black;
    }

    /* =====================================
       STATUS
    ===================================== */

    .scanner-status {
      margin-top: 10px;

      text-align: center;

      font-size: 13px;

      color: #777;
    }

    /* =====================================
       ZOOM
    ===================================== */

    .zoom-controls {
      display: none;

      gap: 8px;

      margin-top: 10px;
    }

    .zoom-button {
      flex: 1;

      padding: 10px;

      margin: 0;

      border: none;

      border-radius: 10px;

      background: #333;

      color: white;

      font-size: 15px;

      font-weight: bold;
    }

    /* =====================================
       BUTTON
    ===================================== */

    button {
      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .scan-button {
      background: #1f4e78;
      color: white;
    }

    .stop-button {
      background: #ddd;
      color: #222;

      display: none;
    }

    /* =====================================
       MANUAL
    ===================================== */

    .manual {
      display: flex;

      gap: 8px;

      margin-top: 15px;
    }

    input {
      flex: 1;

      min-width: 0;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 12px;

      font-size: 16px;

      text-transform: uppercase;
    }

    .check-button {
      width: auto;

      margin-top: 0;

      background: #1f4e78;

      color: white;
    }

    /* =====================================
       RESULT
    ===================================== */

    .result {
      margin-top: 18px;

      padding: 20px;

      border-radius: 15px;

      text-align: center;

      background: #eef8f1;
    }

    .product-name {
      font-size: 19px;

      font-weight: bold;

      line-height: 1.4;
    }

    .price {
      font-size: 38px;

      font-weight: bold;

      margin-top: 10px;
    }

    .success-message {
      margin-top: 12px;

      padding: 10px;

      border-radius: 10px;

      background: #eef8f1;

      color: #18794e;

      font-size: 14px;

      font-weight: bold;
    }

    .error {
      margin-top: 18px;

      padding: 16px;

      border-radius: 14px;

      background: #fff1f1;

      color: #b42318;

      text-align: center;

      font-weight: bold;
    }

    .loading {
      margin-top: 18px;

      text-align: center;

      color: #777;
    }

    .footer {
      text-align: center;

      margin-top: 15px;

      font-size: 12px;

      color: #888;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="title">
    SENTRAL MAKMUR
  </div>


  <div class="subtitle">
    CEK HARGA PRODUK
  </div>


  <div class="card">


    <!-- =================================
         CAMERA
    ================================== -->

    <div id="reader">

      <div
        id="cameraMessage"
        class="camera-message">

        Tekan MULAI SCAN untuk membuka kamera

      </div>

    </div>


    <div
      id="scannerStatus"
      class="scanner-status">

      Scanner siap

    </div>


    <!-- =================================
         ZOOM
    ================================== -->

    <div
      id="zoomControls"
      class="zoom-controls">

      <button
        class="zoom-button"
        onclick="zoomOut()">

        −

      </button>


      <button
        class="zoom-button"
        onclick="zoomReset()">

        1×

      </button>


      <button
        class="zoom-button"
        onclick="zoomIn()">

        +

      </button>

    </div>


    <!-- =================================
         START
    ================================== -->

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()">

      📷 MULAI SCAN

    </button>


    <!-- =================================
         STOP
    ================================== -->

    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()">

      ⏹ HENTIKAN SCAN

    </button>


    <!-- =================================
         MANUAL
    ================================== -->

    <div class="manual">

      <input
        id="barcodeInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="Ketik barcode manual">

      <button
        class="check-button"
        onclick="checkManual()">

        CEK

      </button>

    </div>


    <div id="result"></div>


  </div>


  <div class="footer">

    Scan barcode untuk melihat harga jual satuan

  </div>


</div>


<script>


/* =========================================
   VARIABEL
========================================= */

let codeReader = null;

let scannerControls = null;

let currentVideoTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let zoomStep = 0.5;

let isScanning = false;

let lastBarcode = "";

let lastScanTime = 0;


/* =========================================
   FORMAT BARCODE
========================================= */

const FORMATS = [

  ZXingBrowser.BarcodeFormat.EAN_13,

  ZXingBrowser.BarcodeFormat.EAN_8,

  ZXingBrowser.BarcodeFormat.UPC_A,

  ZXingBrowser.BarcodeFormat.UPC_E,

  ZXingBrowser.BarcodeFormat.CODE_39,

  ZXingBrowser.BarcodeFormat.CODE_93,

  ZXingBrowser.BarcodeFormat.CODE_128,

  ZXingBrowser.BarcodeFormat.ITF,

  ZXingBrowser.BarcodeFormat.QR_CODE

];


/* =========================================
   START SCANNER
========================================= */

async function startScanner() {


  if (isScanning) {
    return;
  }


  isScanning = true;


  const reader =
    document.getElementById("reader");


  const startButton =
    document.getElementById("startButton");


  const stopButton =
    document.getElementById("stopButton");


  const status =
    document.getElementById("scannerStatus");


  startButton.style.display =
    "none";


  stopButton.style.display =
    "block";


  status.innerText =
    "Menyiapkan kamera...";


  try {


    /* =================================
       CEK ZXING
    ================================= */

    if (!window.ZXingBrowser) {

      throw new Error(
        "Scanner barcode gagal dimuat."
      );

    }


    /* =================================
       READER
    ================================= */

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /* =================================
       CARI KAMERA
    ================================= */

    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    /* =================================
       PILIH KAMERA BELAKANG
    ================================= */

    let deviceId =
      devices[0].deviceId;


    for (
      const device of devices
    ) {


      const label =
        String(
          device.label || ""
        ).toLowerCase();


      if (

        label.includes("back") ||

        label.includes("rear") ||

        label.includes("environment") ||

        label.includes("belakang")

      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    /* =================================
       BERSIHKAN READER
    ================================= */

    reader.innerHTML = "";


    /* =================================
       VIDEO
    ================================= */

    const video =
      document.createElement("video");


    video.autoplay =
      true;


    video.muted =
      true;


    video.playsInline =
      true;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.setAttribute(
      "webkit-playsinline",
      ""
    );


    video.style.width =
      "100%";


    video.style.height =
      "100%";


    video.style.objectFit =
      "cover";


    reader.appendChild(video);


    /* =================================
       SCAN BOX
    ================================= */

    const scanBox =
      document.createElement("div");


    scanBox.className =
      "scan-box";


    reader.appendChild(scanBox);


    /* =================================
       SCAN LINE
    ================================= */

    const scanLine =
      document.createElement("div");


    scanLine.className =
      "scan-line";


    reader.appendChild(scanLine);


    /* =================================
       HINT
    ================================= */

    const hint =
      document.createElement("div");


    hint.className =
      "scan-hint";


    hint.innerText =
      "Arahkan barcode ke dalam kotak";


    reader.appendChild(hint);


    /* =================================
       KONFIGURASI KAMERA
    ================================= */

    const constraints = {

      video: {

        deviceId: {
          exact: deviceId
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        frameRate: {
          ideal: 30,
          max: 60
        },

        facingMode: {
          ideal: "environment"
        }

      },

      audio: false

    };


    /*
     * Minta kamera resolusi tinggi.
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await video.play();


    /* =================================
       TRACK KAMERA
    ================================= */

    const tracks =
      stream.getVideoTracks();


    if (tracks.length > 0) {

      currentVideoTrack =
        tracks[0];

    }


    /* =================================
       KEMAMPUAN KAMERA
    ================================= */

    if (
      currentVideoTrack
    ) {


      try {


        const capabilities =
          currentVideoTrack
            .getCapabilities();


        /*
         * Autofocus
         */

        if (
          capabilities.focusMode
        ) {


          const modes =
            capabilities.focusMode;


          if (
            modes.includes(
              "continuous"
            )
          ) {


            await currentVideoTrack
              .applyConstraints({

                advanced: [

                  {
                    focusMode:
                      "continuous"
                  }

                ]

              });

          }

        }


        /*
         * Zoom
         */

        if (
          capabilities.zoom
        ) {


          minZoom =
            capabilities.zoom.min ||
            1;


          maxZoom =
            capabilities.zoom.max ||
            1;


          zoomStep =
            capabilities.zoom.step ||
            0.5;


          /*
           * Jangan langsung terlalu besar.
           * Mulai sekitar 1.5x kalau memungkinkan.
           */

          currentZoom =
            Math.min(

              maxZoom,

              Math.max(
                minZoom,
                1.5
              )

            );


          document
            .getElementById(
              "zoomControls"
            )
            .style.display =
            "flex";


          applyZoom();

        }


      }

      catch (e) {

        console.log(
          "Kemampuan kamera:",
          e
        );

      }

    }


    /* =================================
       STATUS
    ================================= */

    status.innerText =
      "📷 Scanner aktif — arahkan barcode";


    /* =================================
       ZXING DECODE
    ================================= */

    scannerControls =
      await codeReader
        .decodeFromStream(

          stream,

          video,

          function(
            result,
            error
          ) {


            if (!result) {
              return;
            }


            /*
             * Ambil barcode
             */

            const barcode =
              String(
                result.getText()
              )
              .trim()
              .toUpperCase();


            if (!barcode) {
              return;
            }


            /*
             * Hindari barcode yang sama
             * terbaca berkali-kali.
             */

            const now =
              Date.now();


            if (

              barcode ===
              lastBarcode &&

              now -
              lastScanTime <
              2500

            ) {

              return;

            }


            lastBarcode =
              barcode;


            lastScanTime =
              now;


            console.log(
              "BARCODE TERBACA:",
              barcode
            );


            /*
             * Masukkan barcode
             */

            const input =
              document
                .getElementById(
                  "barcodeInput"
                );


            input.value =
              barcode;


            /*
             * Cari harga
             */

            cariHarga(
              barcode
            );


          }

        );


  }

  catch (error) {


    console.error(
      "SCANNER ERROR:",
      error
    );


    tampilkanError(

      "Kamera/scanner tidak dapat digunakan." +

      "<br><br>" +

      aman(
        error.message ||
        error.name ||
        error
      )

    );


    stopScanner();

  }

}


/* =========================================
   APPLY ZOOM
========================================= */

async function applyZoom() {


  if (
    !currentVideoTrack
  ) {

    return;

  }


  try {


    currentZoom =
      Math.max(

        minZoom,

        Math.min(
          maxZoom,
          currentZoom
        )

      );


    await currentVideoTrack
      .applyConstraints({

        advanced: [

          {
            zoom:
              currentZoom
          }

        ]

      });


  }

  catch (error) {

    console.log(
      "Zoom tidak didukung:",
      error
    );

  }

}


/* =========================================
   ZOOM IN
========================================= */

function zoomIn() {


  currentZoom +=
    zoomStep;


  applyZoom();

}


/* =========================================
   ZOOM OUT
========================================= */

function zoomOut() {


  currentZoom -=
    zoomStep;


  applyZoom();

}


/* =========================================
   ZOOM RESET
========================================= */

function zoomReset() {


  currentZoom =
    minZoom;


  applyZoom();

}


/* =========================================
   STOP
========================================= */

function stopScanner() {


  try {

    if (
      scannerControls
    ) {

      scannerControls.stop();

    }

  }

  catch (e) {}


  scannerControls =
    null;


  try {

    if (
      codeReader
    ) {

      codeReader.reset();

    }

  }

  catch (e) {}


  codeReader =
    null;


  if (
    currentVideoTrack
  ) {


    try {

      currentVideoTrack.stop();

    }

    catch (e) {}


  }


  currentVideoTrack =
    null;


  isScanning =
    false;


  currentZoom =
    1;


  document
    .getElementById(
      "stopButton"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "startButton"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "zoomControls"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "scannerStatus"
    )
    .innerText =
    "Scanner siap";


  document
    .getElementById(
      "reader"
    )
    .innerHTML =

    '<div id="cameraMessage" class="camera-message">' +

      'Tekan MULAI SCAN untuk membuka kamera' +

    '</div>';

}


/* =========================================
   INPUT MANUAL
========================================= */

document
  .getElementById(
    "barcodeInput"
  )
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value
          .toUpperCase();

    }
  );


/* =========================================
   CEK MANUAL
========================================= */

function checkManual() {


  const input =
    document
      .getElementById(
        "barcodeInput"
      );


  const barcode =
    String(
      input.value || ""
    )
    .trim()
    .toUpperCase();


  input.value =
    barcode;


  if (!barcode) {


    tampilkanError(
      "Masukkan barcode terlebih dahulu."
    );


    return;

  }


  cariHarga(
    barcode
  );

}


/* =========================================
   CARI HARGA
========================================= */

function cariHarga(
  barcode
) {


  document
    .getElementById(
      "result"
    )
    .innerHTML =

    '<div class="loading">' +

      '🔎 Mencari harga...' +

    '</div>';


  const API_URL =

    "https://script.google.com/macros/s/AKfycbzCIC_CqDz406f9DCpg9hihD_Jgqw5b-yfwjOrNm7F-eRwUeR-D4uSOyi3KqZRTVpw/exec";


  fetch(

    API_URL +

    "?barcode=" +

    encodeURIComponent(
      barcode
    )

  )

  .then(
    response => {

      if (
        !response.ok
      ) {

        throw new Error(
          "Server tidak merespons."
        );

      }


      return response.json();

    }

  )

  .then(
    data => {

      tampilkanHasil(
        data
      );

    }

  )

  .catch(
    error => {


      console.error(
        error
      );


      tampilkanError(
        "Gagal mengambil data harga."
      );


    }

  );

}


/* =========================================
   HASIL
========================================= */

function tampilkanHasil(
  data
) {


  if (
    data.ok
  ) {


    document
      .getElementById(
        "result"
      )
      .innerHTML =


      '<div class="result">' +


        '<div class="product-name">' +

          aman(
            data.name
          ) +

        '</div>' +


        '<div class="price">' +

          'Rp ' +

          aman(
            data.price
          ) +

        '</div>' +


        '<div class="success-message">' +

          '✓ Produk ditemukan' +

        '</div>' +


      '</div>';


  }

  else {


    let pesan =
      aman(
        data.message ||
        "Produk tidak ditemukan."
      );


    if (
      data.barcode
    ) {


      pesan +=

        "<br><br>Barcode: " +

        aman(
          data.barcode
        );


    }


    tampilkanError(
      pesan
    );


  }

}


/* =========================================
   ERROR
========================================= */

function tampilkanError(
  pesan
) {


  document
    .getElementById(
      "result"
    )
    .innerHTML =


    '<div class="error">' +

      pesan +

    '</div>';

}


/* =========================================
   HTML SAFETY
========================================= */

function aman(
  text
) {


  return String(
    text
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ENTER
========================================= */

document
  .getElementById(
    "barcodeInput"
  )
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key === "Enter"
      ) {

        checkManual();

      }


    }
  );


</script>


</body>

</html>
