<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Sentral Makmur - Cek Harga & Stok
</title>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #f5f6f8;

  color:
    #222;

}


.container {

  width: 100%;

  max-width: 600px;

  margin: auto;

  padding: 18px;

}


.header {

  text-align: center;

  margin-bottom: 18px;

}


.logo {

  font-size: 28px;

  font-weight: 800;

  color: #d71920;

}


.subtitle {

  margin-top: 5px;

  color: #777;

  font-size: 14px;

}


/* =====================================================
   SEARCH
   ===================================================== */

.search-box {

  background: white;

  border-radius: 18px;

  padding: 14px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.07);

}


.search-row {

  display: flex;

  gap: 8px;

}


#keyword {

  flex: 1;

  min-width: 0;

  border:
    1px solid #ddd;

  border-radius: 12px;

  padding:
    14px;

  font-size: 16px;

  outline: none;

}


#keyword:focus {

  border-color:
    #d71920;

}


button {

  border: none;

  cursor: pointer;

}


.search-btn {

  background:
    #d71920;

  color: white;

  border-radius: 12px;

  padding:
    0 18px;

  font-size: 15px;

  font-weight: 700;

}


.camera-btn {

  margin-top: 10px;

  width: 100%;

  padding: 13px;

  border-radius: 12px;

  background:
    #222;

  color: white;

  font-size: 15px;

  font-weight: 700;

}


/* =====================================================
   CAMERA
   ===================================================== */

.camera {

  display: none;

  margin-top: 14px;

  position: relative;

  overflow: hidden;

  border-radius: 18px;

  background: black;

}


.camera.active {

  display: block;

}


#video {

  display: block;

  width: 100%;

  height: 300px;

  object-fit: cover;

}


.scan-frame {

  position: absolute;

  left: 50%;

  top: 50%;

  width: 70%;

  height: 120px;

  transform:
    translate(-50%, -50%);

  border:
    3px solid white;

  border-radius: 12px;

  box-shadow:
    0 0 0
    9999px
    rgba(0,0,0,0.35);

}


.close-camera {

  position: absolute;

  right: 10px;

  top: 10px;

  width: 38px;

  height: 38px;

  border-radius: 50%;

  background:
    rgba(0,0,0,0.65);

  color: white;

  font-size: 20px;

}


.camera-status {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 12px;

  text-align: center;

  color: white;

  font-size: 13px;

}


/* =====================================================
   LOADING
   ===================================================== */

.loading {

  display: none;

  text-align: center;

  padding: 25px;

  color: #777;

}


.loading.show {

  display: block;

}


/* =====================================================
   RESULT
   ===================================================== */

.results {

  margin-top: 18px;

}


.result-count {

  color: #777;

  font-size: 13px;

  margin-bottom: 10px;

}


.product {

  background: white;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 10px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.06);

  cursor: pointer;

}


.product-name {

  font-size: 17px;

  font-weight: 700;

  line-height: 1.35;

}


.product-code {

  color: #777;

  font-size: 13px;

  margin-top: 6px;

}


.product-barcode {

  color: #999;

  font-size: 12px;

  margin-top: 3px;

}


.product-price {

  margin-top: 12px;

  font-size: 20px;

  font-weight: 800;

  color: #d71920;

}


/* =====================================================
   DETAIL
   ===================================================== */

.detail {

  display: none;

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-top: 18px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.08);

}


.detail.show {

  display: block;

}


.detail-title {

  font-size: 20px;

  font-weight: 800;

  line-height: 1.35;

}


.detail-code {

  color: #777;

  margin-top: 5px;

}


.stock-box {

  margin-top: 18px;

  padding: 18px;

  border-radius: 14px;

  background:
    #f3f4f6;

  text-align: center;

}


.stock-label {

  font-size: 13px;

  color: #777;

}


.stock-number {

  margin-top: 5px;

  font-size: 34px;

  font-weight: 900;

}


.price-detail {

  margin-top: 14px;

  font-size: 22px;

  font-weight: 800;

  color: #d71920;

}


.back-btn {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border-radius: 12px;

  background:
    #222;

  color: white;

  font-weight: 700;

}


/* =====================================================
   ERROR
   ===================================================== */

.error {

  display: none;

  margin-top: 15px;

  background:
    #fff0f0;

  color:
    #c00000;

  border-radius: 12px;

  padding: 14px;

  font-size: 14px;

}


.error.show {

  display: block;

}


.empty {

  text-align: center;

  padding: 35px 15px;

  color: #888;

}


</style>

</head>


<body>


<div class="container">


  <div class="header">

    <div class="logo">
      SENTRAL MAKMUR
    </div>

    <div class="subtitle">
      Cek Harga & Stok Produk
    </div>

  </div>


  <!-- =====================================================
       SEARCH
       ===================================================== -->

  <div class="search-box">

    <div class="search-row">

      <input
        id="keyword"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        class="search-btn"
        onclick="cariProduk()"
      >
        CARI
      </button>

    </div>


    <button
      class="camera-btn"
      onclick="bukaScanner()"
    >
      📷 SCAN BARCODE
    </button>


    <!-- CAMERA -->

    <div
      id="camera"
      class="camera"
    >

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="scan-frame"></div>

      <button
        class="close-camera"
        onclick="tutupScanner()"
      >
        ×
      </button>

      <div
        id="cameraStatus"
        class="camera-status"
      >
        Arahkan barcode ke kotak
      </div>

    </div>

  </div>


  <!-- =====================================================
       ERROR
       ===================================================== -->

  <div
    id="error"
    class="error"
  ></div>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    id="loading"
    class="loading"
  >
    Memuat...
  </div>


  <!-- =====================================================
       RESULTS
       ===================================================== -->

  <div
    id="results"
    class="results"
  ></div>


  <!-- =====================================================
       DETAIL
       ===================================================== -->

  <div
    id="detail"
    class="detail"
  ></div>


</div>


<script>


/* ==========================================================
   URL APPS SCRIPT
   ========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* ==========================================================
   ELEMENT
   ========================================================== */

const keywordInput =
  document.getElementById(
    'keyword'
  );

const results =
  document.getElementById(
    'results'
  );

const loading =
  document.getElementById(
    'loading'
  );

const errorBox =
  document.getElementById(
    'error'
  );

const detailBox =
  document.getElementById(
    'detail'
  );

const cameraBox =
  document.getElementById(
    'camera'
  );

const video =
  document.getElementById(
    'video'
  );

const cameraStatus =
  document.getElementById(
    'cameraStatus'
  );


/* ==========================================================
   ENTER
   ========================================================== */

keywordInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cariProduk();

    }

  }
);


/* ==========================================================
   CARI PRODUK
   ========================================================== */

async function cariProduk() {

  const keyword =
    keywordInput.value.trim();


  if (!keyword) {

    tampilError(
      'Masukkan nama, kode, atau barcode produk.'
    );

    return;

  }


  sembunyikanError();

  sembunyikanDetail();

  tampilLoading(true);


  results.innerHTML = '';


  try {

    const url =
      API_URL +
      '?aksi=cari&keyword=' +
      encodeURIComponent(
        keyword
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    tampilLoading(false);


    if (
      !data.success
    ) {

      tampilError(
        data.error ||
        'Gagal mencari produk.'
      );

      return;

    }


    tampilHasil(
      data.data || []
    );

  }

  catch (error) {

    tampilLoading(false);

    tampilError(
      'Tidak dapat terhubung ke server.'
    );

    console.error(error);

  }

}


/* ==========================================================
   TAMPIL HASIL
   ========================================================== */

function tampilHasil(
  products
) {

  if (
    !products ||
    products.length === 0
  ) {

    results.innerHTML =
      '<div class="empty">' +
      'Produk tidak ditemukan di Master Produk.' +
      '</div>';

    return;

  }


  let html = '';

  html +=
    '<div class="result-count">' +
    products.length +
    ' produk ditemukan' +
    '</div>';


  products.forEach(
    function(product) {

      html +=

        '<div class="product" ' +

        'onclick="lihatStok(' +
        escapeJs(
          product.id
        ) +
        ')">' +

        '<div class="product-name">' +
        escapeHtml(
          product.nama ||
          product.name ||
          '-'
        ) +
        '</div>' +

        '<div class="product-code">' +
        'Kode: ' +
        escapeHtml(
          product.kode ||
          product.no ||
          '-'
        ) +
        '</div>' +

        '<div class="product-barcode">' +
        'Barcode: ' +
        escapeHtml(
          product.barcode ||
          '-'
        ) +
        '</div>' +

        '</div>';

    }
  );


  results.innerHTML =
    html;

}


/* ==========================================================
   LIHAT STOK
   ========================================================== */

async function lihatStok(
  id
) {

  sembunyikanError();

  tampilLoading(true);


  try {

    const url =
      API_URL +
      '?aksi=stok&id=' +
      encodeURIComponent(
        id
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    tampilLoading(false);


    if (
      !data.success
    ) {

      tampilError(
        data.error ||
        'Gagal mengambil stok.'
      );

      return;

    }


    tampilDetail(
      data.data
    );

  }

  catch (error) {

    tampilLoading(false);

    tampilError(
      'Gagal mengambil data dari Accurate.'
    );

    console.error(error);

  }

}


/* ==========================================================
   TAMPIL DETAIL
   ========================================================== */

function tampilDetail(
  product
) {

  results.innerHTML =
    '';


  detailBox.innerHTML =

    '<div class="detail-title">' +

    escapeHtml(
      product.nama ||
      product.name ||
      '-'
    ) +

    '</div>' +

    '<div class="detail-code">' +

    'Kode: ' +

    escapeHtml(
      product.kode ||
      product.no ||
      '-'
    ) +

    '</div>' +

    '<div class="detail-code">' +

    'Barcode: ' +

    escapeHtml(
      product.barcode ||
      '-'
    ) +

    '</div>' +


    '<div class="price-detail">' +

    'Rp ' +

    escapeHtml(
      product.harga ||
      product.price ||
      '-'
    ) +

    '</div>' +


    '<div class="stock-box">' +

    '<div class="stock-label">' +
    'STOK TERSEDIA' +
    '</div>' +

    '<div class="stock-number">' +

    escapeHtml(
      String(
        product.stok ??
        product.stock ??
        0
      )
    ) +

    ' ' +

    escapeHtml(
      product.satuan ||
      'PCS'
    ) +

    '</div>' +

    '</div>' +


    '<button ' +

    'class="back-btn" ' +

    'onclick="kembaliKeHasil()">' +

    '← KEMBALI' +

    '</button>';


  detailBox.classList.add(
    'show'
  );

}


/* ==========================================================
   KEMBALI
   ========================================================== */

function kembaliKeHasil() {

  detailBox.classList.remove(
    'show'
  );

}


/* ==========================================================
   SCANNER
   ========================================================== */

let stream = null;

let scannerRunning = false;

let barcodeDetector = null;


/* ==========================================================
   BUKA SCANNER
   ========================================================== */

async function bukaScanner() {

  sembunyikanError();


  if (
    !('BarcodeDetector' in window)
  ) {

    tampilError(
      'Browser ini belum mendukung scan barcode otomatis. Gunakan Chrome versi terbaru.'
    );

    return;

  }


  try {

    barcodeDetector =
      new BarcodeDetector({

        formats: [

          'ean_13',

          'ean_8',

          'upc_a',

          'upc_e',

          'code_128',

          'code_39',

          'code_93',

          'codabar',

          'itf'

        ]

      });


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    cameraBox.classList.add(
      'active'
    );


    scannerRunning = true;


    await video.play();


    /* ======================================================
       AUTO ZOOM
       ====================================================== */

    aktifkanAutoZoom();


    cameraStatus.innerText =
      'Arahkan barcode ke kotak';


    scanLoop();

  }

  catch (error) {

    console.error(error);

    tampilError(
      'Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
    );

    tutupScanner();

  }

}


/* ==========================================================
   AUTO ZOOM
   ========================================================== */

async function aktifkanAutoZoom() {

  try {

    if (!stream) {
      return;
    }


    const tracks =
      stream.getVideoTracks();


    if (
      !tracks ||
      tracks.length === 0
    ) {

      return;

    }


    const track =
      tracks[0];


    const capabilities =
      track.getCapabilities();


    if (
      !capabilities.zoom
    ) {

      cameraStatus.innerText =
        'Arahkan barcode ke kotak';

      return;

    }


    const min =
      capabilities.zoom.min;


    const max =
      capabilities.zoom.max;


    const target =
      Math.min(
        max,
        Math.max(
          min,
          min +
          (max - min) *
          0.55
        )
      );


    await track.applyConstraints({

      advanced: [

        {
          zoom:
            target
        }

      ]

    });


    cameraStatus.innerText =
      'Zoom otomatis aktif';

  }

  catch (error) {

    console.log(
      'Zoom otomatis tidak tersedia.'
    );

  }

}


/* ==========================================================
   SCAN LOOP
   ========================================================== */

async function scanLoop() {

  if (!scannerRunning) {
    return;
  }


  try {

    const barcodes =
      await barcodeDetector.detect(
        video
      );


    if (
      barcodes &&
      barcodes.length > 0
    ) {

      const value =
        barcodes[0].rawValue;


      if (value) {

        cameraStatus.innerText =
          'Barcode ditemukan...';


        keywordInput.value =
          value;


        tutupScanner();


        cariProduk();


        return;

      }

    }

  }

  catch (error) {

    console.log(error);

  }


  requestAnimationFrame(
    scanLoop
  );

}


/* ==========================================================
   TUTUP SCANNER
   ========================================================== */

function tutupScanner() {

  scannerRunning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  stream = null;

  video.srcObject = null;


  cameraBox.classList.remove(
    'active'
  );

}


/* ==========================================================
   LOADING
   ========================================================== */

function tampilLoading(
  show
) {

  if (show) {

    loading.classList.add(
      'show'
    );

  }

  else {

    loading.classList.remove(
      'show'
    );

  }

}


/* ==========================================================
   ERROR
   ========================================================== */

function tampilError(
  message
) {

  errorBox.innerText =
    message;

  errorBox.classList.add(
    'show'
  );

}


function sembunyikanError() {

  errorBox.classList.remove(
    'show'
  );

}


/* ==========================================================
   DETAIL
   ========================================================== */

function sembunyikanDetail() {

  detailBox.classList.remove(
    'show'
  );

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==========================================================
   ESCAPE JS
   ========================================================== */

function escapeJs(
  value
) {

  return JSON.stringify(
    String(
      value ?? ''
    )
  );

}


/* ==========================================================
   START
   ========================================================== */

console.log(
  'Sentral Makmur siap.'
);

</script>


</body>

</html>
