<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#1f4e78">

<title>Cek Harga - Sentral Makmur</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html {
  touch-action: manipulation;
}

body {
  margin: 0;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

.title {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-top: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin: 6px 0 18px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

/* =====================================================
   CAMERA
===================================================== */

#reader {
  width: 100%;
  height: 340px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  padding: 25px;
}

.scan-box {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 29%;
  height: 42%;
  border: 2px solid #fff;
  border-radius: 8px;
  z-index: 20;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.22);
}

.scan-line {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 50%;
  height: 2px;
  background: #fff;
  z-index: 21;
  pointer-events: none;
  box-shadow: 0 0 8px #fff;
}

.scan-hint {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 13px;
  z-index: 22;
  text-shadow: 0 1px 4px #000;
  pointer-events: none;
}

.scan-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.65);
  color: #fff;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  display: none;
  pointer-events: none;
}

/* =====================================================
   ZOOM
===================================================== */

#zoomControl {
  display: none;
  margin-top: 12px;
  background: #f1f1f1;
  padding: 13px;
  border-radius: 12px;
}

.zoom-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.zoom-help {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin: 5px 0 9px;
}

.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.zoom-label {
  font-size: 12px;
  font-weight: bold;
  min-width: 28px;
  text-align: center;
}

#zoomSlider {
  flex: 1;
  height: 38px;
  touch-action: pan-x;
}

#zoomValue {
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  margin-top: 4px;
}

/* =====================================================
   BUTTON
===================================================== */

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.scan-button {
  background: #1f4e78;
  color: #fff;
}

.stop-button {
  background: #ddd;
  color: #222;
  display: none;
}

.check-button {
  width: auto;
  margin-top: 0;
  background: #1f4e78;
  color: #fff;
}

.clear-button {
  background: #eee;
  color: #222;
}

/* =====================================================
   STATUS
===================================================== */

.status {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #777;
}

/* =====================================================
   SEARCH
===================================================== */

.search-area {
  margin-top: 18px;
}

.search-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.manual {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  text-transform: uppercase;
}

input:focus {
  outline: none;
  border-color: #1f4e78;
}

/* =====================================================
   RESULT
===================================================== */

.result {
  margin-top: 18px;
}

.product-card {
  background: #eef8f1;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.4;
}

.product-barcode {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
}

.price {
  font-size: 38px;
  font-weight: bold;
  margin-top: 10px;
}

.stock-box {
  margin-top: 18px;
  padding: 15px;
  border-radius: 13px;
  text-align: center;
}

.stok-aman {
  background: #e8f7ed;
  color: #187a3d;
}

.stok-habis {
  background: #fff1f1;
  color: #b42318;
}

.stock-label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
}

.stock-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 5px;
}

.accurate-code {
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}

/* =====================================================
   MULTIPLE RESULT
===================================================== */

.result-count {
  font-weight: bold;
  margin-bottom: 8px;
}

.result-item {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 14px;
  margin-top: 9px;
  cursor: pointer;
}

.result-item:active {
  transform: scale(.99);
}

.result-item-name {
  font-weight: bold;
  line-height: 1.4;
}

.result-item-barcode,
.result-item-code {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.result-item-price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 7px;
}

/* =====================================================
   MESSAGE
===================================================== */

.error {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #fff1f1;
  color: #b42318;
  text-align: center;
  font-weight: bold;
  word-break: break-word;
}

.loading {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #f1f5f9;
  color: #475569;
  text-align: center;
  font-weight: bold;
}

.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #888;
}

</style>
</head>

<body>

<div class="container">

  <div class="title">
    SENTRAL MAKMUR
  </div>

  <div class="subtitle">
    CEK HARGA & STOK PRODUK
  </div>

  <div class="card">

    <!-- CAMERA -->

    <div id="reader">

      <div class="camera-message">
        Tekan MULAI SCAN untuk membuka kamera
      </div>

    </div>

    <!-- ZOOM -->

    <div id="zoomControl">

      <div class="zoom-title">
        🔍 ZOOM KAMERA
      </div>

      <div class="zoom-help">
        Atur zoom jika barcode terlalu kecil.
      </div>

      <div class="zoom-row">

        <div class="zoom-label">
          1×
        </div>

        <input
          id="zoomSlider"
          type="range"
          min="1"
          max="3"
          step="0.1"
          value="1">

        <div class="zoom-label">
          3×
        </div>

      </div>

      <div id="zoomValue">
        1.0×
      </div>

    </div>

    <!-- STATUS -->

    <div id="status" class="status">
      ⏳ Memuat data produk...
    </div>

    <!-- START -->

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()">

      📷 MULAI SCAN

    </button>

    <!-- STOP -->

    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()">

      ⏹ HENTIKAN SCAN

    </button>

    <!-- SEARCH -->

    <div class="search-area">

      <div class="search-title">
        🔎 Cari barcode, nama produk, atau Kode Accurate
      </div>

      <div class="manual">

        <input
          id="searchInput"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="AMZ003 / CHOCOLATE / AMZ003">

        <button
          class="check-button"
          onclick="searchProduct()">

          CEK

        </button>

      </div>

      <button
        class="clear-button"
        onclick="clearSearch()">

        HAPUS PENCARIAN

      </button>

    </div>

    <div id="result"></div>

  </div>

  <div class="footer">
    Scan barcode atau cari nama produk
  </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   DATA
===================================================== */

let products = [];

let codeReader = null;
let scannerControls = null;
let currentStream = null;
let scannerStarting = false;

let lastBarcode = '';
let lastScanTime = 0;

const LOCAL_PRODUCTS_KEY =
  'SENTRAL_MAKMUR_PRODUCTS_V1';


/* =====================================================
   ZOOM
===================================================== */

let zoomTrack = null;
let zoomMin = 1;
let zoomMax = 3;
let zoomStep = 0.1;
let zoomCurrent = 1;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


/* =====================================================
   LOAD PRODUCTS
===================================================== */

function loadProducts() {

  const status =
    document.getElementById('status');


  /*
   * LANGSUNG TAMPILKAN CACHE BROWSER
   */

  try {

    const local =
      localStorage.getItem(
        LOCAL_PRODUCTS_KEY
      );

    if (local) {

      const parsed =
        JSON.parse(local);

      if (
        Array.isArray(parsed) &&
        parsed.length > 0
      ) {

        products =
          parsed;

        status.innerText =
          '✓ ' +
          products.length +
          ' produk siap digunakan';

      }

    }

  }

  catch(error) {

    console.log(
      'Cache browser tidak tersedia:',
      error
    );

  }


  /*
   * TETAP UPDATE DARI SERVER
   */

  const callbackName =
    'produkCallback_' +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (
          data &&
          data.success === true &&
          Array.isArray(data.data)
        ) {

          products =
            data.data;


          try {

            localStorage.setItem(
              LOCAL_PRODUCTS_KEY,
              JSON.stringify(
                products
              )
            );

          }

          catch(error) {

            console.log(
              'Gagal menyimpan cache browser:',
              error
            );

          }


          status.innerText =
            '✓ ' +
            products.length +
            ' produk siap digunakan';

        }

        else if (
          products.length === 0
        ) {

          status.innerText =
            '❌ Data produk tidak ditemukan';

          tampilkanError(
            'Data produk dari server tidak sesuai.'
          );

        }

      }

      catch(error) {

        console.error(
          'ERROR LOAD PRODUK:',
          error
        );

        if (
          products.length === 0
        ) {

          status.innerText =
            '❌ Gagal membaca data produk';

          tampilkanError(
            'Gagal membaca data produk.'
          );

        }

      }


      hapusScriptCallback(
        callbackName
      );

    };


  const script =
    document.createElement('script');


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?aksi=produk' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      if (
        products.length === 0
      ) {

        status.innerText =
          '❌ Data produk gagal dimuat';

        tampilkanError(
          'Tidak dapat mengambil data produk dari server.'
        );

      }

      hapusScriptCallback(
        callbackName
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {

  if (scannerStarting) {
    return;
  }

  if (currentStream) {
    return;
  }


  scannerStarting = true;


  try {

    aktifkanAudio();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );

    }


    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML = '';


    const video =
      document.createElement(
        'video'
      );


    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    video.setAttribute(
      'playsinline',
      ''
    );


    reader.appendChild(
      video
    );


    const scanBox =
      document.createElement(
        'div'
      );

    scanBox.className =
      'scan-box';

    reader.appendChild(
      scanBox
    );


    const scanLine =
      document.createElement(
        'div'
      );

    scanLine.className =
      'scan-line';

    reader.appendChild(
      scanLine
    );


    const hint =
      document.createElement(
        'div'
      );

    hint.className =
      'scan-hint';

    hint.innerText =
      'Arahkan barcode ke dalam kotak';

    reader.appendChild(
      hint
    );


    const scanStatus =
      document.createElement(
        'div'
      );

    scanStatus.className =
      'scan-status';

    scanStatus.id =
      'scanStatus';

    reader.appendChild(
      scanStatus
    );


    /*
     * CARI KAMERA
     */

    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /*
     * PRIORITAS KAMERA BELAKANG
     */

    let deviceId =
      devices[devices.length - 1].deviceId;


    for (
      const device of devices
    ) {

      const label =
        String(
          device.label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('belakang')
      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    /*
     * BUKA KAMERA
     */

    currentStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {
              exact: deviceId
            },

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30,
              max: 30
            }

          },

          audio: false

        });


    video.srcObject =
      currentStream;


    await video.play();


    /*
     * COBA AKTIFKAN AUTOFOCUS
     */

    aktifkanFocus(
      currentStream
    );


    setupZoom();


    document
      .getElementById(
        'startButton'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'stopButton'
      )
      .style.display =
        'block';


    document
      .getElementById(
        'status'
      )
      .innerText =
        '📷 Scanner aktif — siap scan';


    /*
     * ZXING
     */

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    scannerControls =
      await codeReader
        .decodeFromStream(
          currentStream,
          video,
          function(
            result,
            error
          ) {

            if (!result) {
              return;
            }


            const barcode =
              String(
                result.getText()
              )
              .trim()
              .toUpperCase();


            if (!barcode) {
              return;
            }


            const now =
              Date.now();


            /*
             * BARCODE SAMA JANGAN DIPROSES
             * BERULANG DALAM 2 DETIK
             */

            if (
              barcode === lastBarcode &&
              now - lastScanTime < 2000
            ) {

              return;

            }


            lastBarcode =
              barcode;

            lastScanTime =
              now;


            /*
             * BARCODE BERHASIL
             */

            bunyiBerhasil();
            getarBerhasil();


            tampilkanScanStatus(
              '✓ Barcode terbaca'
            );


            document
              .getElementById(
                'searchInput'
              )
              .value =
                barcode;


            /*
             * PENTING:
             *
             * KAMERA TIDAK DIHENTIKAN.
             *
             * Setelah hasil tampil,
             * scanner tetap aktif.
             */

            searchBarcode(
              barcode
            );

          }
        );

  }

  catch(error) {

    console.error(
      'KAMERA ERROR:',
      error
    );


    tampilkanError(
      'Kamera tidak dapat digunakan.' +
      '<br><br>' +
      aman(
        error.message ||
        error.name ||
        ''
      )
    );


    stopScanner();

  }

  finally {

    scannerStarting =
      false;

  }

}


/* =====================================================
   AUTOFOCUS
===================================================== */

function aktifkanFocus(
  stream
) {

  try {

    const track =
      stream.getVideoTracks()[0];


    if (
      !track ||
      !track.getCapabilities
    ) {

      return;

    }


    const capabilities =
      track.getCapabilities();


    const advanced = {};


    if (
      capabilities.focusMode
    ) {

      if (
        capabilities.focusMode.includes(
          'continuous'
        )
      ) {

        advanced.focusMode =
          'continuous';

      }

    }


    if (
      Object.keys(
        advanced
      ).length > 0
    ) {

      track.applyConstraints({

        advanced: [
          advanced
        ]

      }).catch(
        function() {}
      );

    }

  }

  catch(error) {

    console.log(
      'Autofocus tidak tersedia.'
    );

  }

}


/* =====================================================
   AUDIO
===================================================== */

function aktifkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {}

}


function getarBerhasil() {

  try {

    if (
      'vibrate' in navigator
    ) {

      navigator.vibrate(
        [70]
      );

    }

  }

  catch(error) {}

}


function bunyiBerhasil() {

  try {

    aktifkanAudio();


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.setValueAtTime(
      1450,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.45,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.16
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.17
    );

  }

  catch(error) {}

}


/* =====================================================
   ZOOM
===================================================== */

function setupZoom() {

  const control =
    document.getElementById(
      'zoomControl'
    );


  const slider =
    document.getElementById(
      'zoomSlider'
    );


  if (!currentStream) {

    control.style.display =
      'none';

    return;

  }


  const tracks =
    currentStream.getVideoTracks();


  if (
    !tracks ||
    tracks.length === 0
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomTrack =
    tracks[0];


  if (
    !zoomTrack.getCapabilities
  ) {

    control.style.display =
      'none';

    return;

  }


  const capabilities =
    zoomTrack.getCapabilities();


  if (
    !capabilities.zoom
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomMin =
    Number(
      capabilities.zoom.min || 1
    );


  zoomMax =
    Math.min(
      Number(
        capabilities.zoom.max || 3
      ),
      3
    );


  zoomStep =
    Number(
      capabilities.zoom.step || 0.1
    );


  slider.min =
    zoomMin;


  slider.max =
    zoomMax;


  slider.step =
    zoomStep;


  zoomCurrent =
    Math.max(
      1,
      zoomMin
    );


  slider.value =
    zoomCurrent;


  control.style.display =
    'block';


  updateZoomDisplay();


  applyZoom();

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

document
  .getElementById(
    'zoomSlider'
  )
  .addEventListener(
    'input',
    function() {

      if (!zoomTrack) {
        return;
      }


      zoomCurrent =
        Number(
          this.value
        );


      applyZoom();

    }
  );


function applyZoom() {

  if (!zoomTrack) {
    return;
  }


  try {

    zoomTrack.applyConstraints({

      advanced: [

        {
          zoom:
            zoomCurrent
        }

      ]

    });


    updateZoomDisplay();

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

  }

}


function updateZoomDisplay() {

  document
    .getElementById(
      'zoomValue'
    )
    .innerText =
      Number(
        zoomCurrent
      ).toFixed(1) +
      '×';

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

  try {

    if (scannerControls) {

      scannerControls.stop();

    }

  }

  catch(error) {}


  scannerControls =
    null;


  try {

    if (codeReader) {

      codeReader.reset();

    }

  }

  catch(error) {}


  codeReader =
    null;


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  currentStream =
    null;


  zoomTrack =
    null;


  scannerStarting =
    false;


  document
    .getElementById(
      'zoomControl'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'stopButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'startButton'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'reader'
    )
    .innerHTML =
      '<div class="camera-message">' +
      'Tekan MULAI SCAN untuk membuka kamera' +
      '</div>';

}


/* =====================================================
   SEARCH PRODUCT
===================================================== */

function searchProduct() {

  const input =
    document.getElementById(
      'searchInput'
    );


  const keyword =
    String(
      input.value || ''
    )
    .trim()
    .toUpperCase();


  input.value =
    keyword;


  if (!keyword) {

    tampilkanError(
      'Masukkan barcode, nama produk, atau Kode Accurate.'
    );

    return;

  }


  /*
   * 1. BARCODE EXACT
   */

  const exactBarcode =
    products.find(
      function(product) {

        return normalisasi(
          product.barcode
        ) === keyword;

      }
    );


  if (exactBarcode) {

    cekProduk(
      exactBarcode
    );

    return;

  }


  /*
   * 2. KODE ACCURATE EXACT
   *
   * INI YANG MEMBUAT PRODUK
   * TANPA BARCODE TETAP BISA DICEK.
   */

  const exactKode =
    products.find(
      function(product) {

        return normalisasi(
          product.kodeAccurate
        ) === keyword;

      }
    );


  if (exactKode) {

    cekProduk(
      exactKode
    );

    return;

  }


  /*
   * 3. NAMA PRODUK
   */

  const hasil =
    products.filter(
      function(product) {

        const name =
          normalisasi(
            product.name
          );


        return name.includes(
          keyword
        );

      }
    );


  if (
    hasil.length === 0
  ) {

    tampilkanError(
      'Produk "' +
      aman(keyword) +
      '" tidak ditemukan di MASTER PRODUK.'
    );

    return;

  }


  if (
    hasil.length === 1
  ) {

    cekProduk(
      hasil[0]
    );

    return;

  }


  tampilkanDaftar(
    hasil
  );

}


/* =====================================================
   CEK PRODUK
===================================================== */

function cekProduk(
  product
) {

  if (!product) {
    return;
  }


  const barcode =
    normalisasi(
      product.barcode
    );


  const kodeAccurate =
    normalisasi(
      product.kodeAccurate
    );


  /*
   * Kalau ada barcode gunakan barcode.
   *
   * Kalau tidak ada barcode,
   * gunakan Kode Accurate.
   */

  if (barcode) {

    searchBarcode(
      barcode
    );

    return;

  }


  if (kodeAccurate) {

    searchByKodeAccurate(
      kodeAccurate
    );

    return;

  }


  tampilkanError(
    'Produk ini belum memiliki Barcode maupun Kode Accurate.'
  );

}


/* =====================================================
   SEARCH BARCODE
===================================================== */

function searchBarcode(
  barcode
) {

  barcode =
    normalisasi(
      barcode
    );


  if (!barcode) {
    return;
  }


  requestStok(
    'barcode',
    barcode
  );

}


/* =====================================================
   SEARCH KODE ACCURATE
===================================================== */

function searchByKodeAccurate(
  kodeAccurate
) {

  kodeAccurate =
    normalisasi(
      kodeAccurate
    );


  if (!kodeAccurate) {
    return;
  }


  requestStok(
    'kodeAccurate',
    kodeAccurate
  );

}


/* =====================================================
   REQUEST STOK
===================================================== */

function requestStok(
  jenis,
  nilai
) {

  document
    .getElementById(
      'status'
    )
    .innerText =
      '⏳ Mengecek harga dan stok...';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '<div class="loading">' +
      '⏳ Mengambil data stok Accurate...' +
      '</div>';


  const callbackName =
    'stokCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        console.log(
          'RESPONSE STOK:',
          response
        );


        if (
          !response ||
          response.success !== true
        ) {

          const pesan =
            response &&
            response.error
            ?
            response.error
            :
            'Data produk tidak ditemukan.';


          tampilkanError(
            aman(pesan)
          );


          document
            .getElementById(
              'status'
            )
            .innerText =
              '❌ Data tidak ditemukan';


          return;

        }


        if (
          !response.data
        ) {

          tampilkanError(
            'Data produk kosong.'
          );

          return;

        }


        tampilkanProdukDenganStok(
          response.data
        );


        document
          .getElementById(
            'status'
          )
          .innerText =
            '✓ Produk ditemukan';


      }

      catch(error) {

        console.error(
          error
        );


        tampilkanError(
          'Terjadi kesalahan membaca data server.'
        );

      }


      hapusScriptCallback(
        callbackName
      );

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;


  let url =
    API_URL +
    '?aksi=stok';


  if (
    jenis === 'barcode'
  ) {

    url +=
      '&barcode=' +
      encodeURIComponent(
        nilai
      );

  }

  else {

    url +=
      '&kodeAccurate=' +
      encodeURIComponent(
        nilai
      );

  }


  url +=
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      tampilkanError(
        '❌ Tidak dapat terhubung ke server Apps Script.'
      );


      document
        .getElementById(
          'status'
        )
        .innerText =
          '❌ Gagal terhubung ke server';


      hapusScriptCallback(
        callbackName
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   DISPLAY PRODUCT
===================================================== */

function tampilkanProdukDenganStok(
  data
) {

  const stok =
    Number(
      data.stok || 0
    );


  const stokClass =
    stok > 0
    ?
    'stok-aman'
    :
    'stok-habis';


  const stokText =
    stok > 0
    ?
    stok +
    ' ' +
    (
      data.satuan ||
      'PCS'
    )
    :
    'HABIS';


  const barcode =
    data.barcode
    ?
    data.barcode
    :
    'Tidak ada barcode';


  document
    .getElementById(
      'result'
    )
    .innerHTML =

    '<div class="product-card">' +

      '<div class="product-name">' +
        aman(
          data.nama || ''
        ) +
      '</div>' +

      '<div class="product-barcode">' +
        'Barcode: ' +
        aman(
          barcode
        ) +
      '</div>' +

      '<div class="price">' +
        'Rp ' +
        aman(
          data.harga || '-'
        ) +
      '</div>' +

      '<div class="stock-box ' +
        stokClass +
      '">' +

        '<div class="stock-label">' +
          'STOK TERSEDIA' +
        '</div>' +

        '<div class="stock-number">' +
          aman(
            stokText
          ) +
        '</div>' +

      '</div>' +

      '<div class="accurate-code">' +
        'Kode Accurate: ' +
        aman(
          data.kodeAccurate || '-'
        ) +
      '</div>' +

    '</div>';

}


/* =====================================================
   MULTIPLE RESULT
===================================================== */

function tampilkanDaftar(
  hasil
) {

  window.hasilPencarian =
    hasil;


  let html =
    '<div class="result-count">' +
      '🔎 Ditemukan ' +
      hasil.length +
      ' produk' +
    '</div>';


  hasil.forEach(
    function(
      product,
      index
    ) {

      const barcode =
        normalisasi(
          product.barcode
        );


      const kode =
        normalisasi(
          product.kodeAccurate
        );


      html +=

        '<div class="result-item" ' +
          'onclick="pilihProduk(' +
          index +
          ')">' +

          '<div class="result-item-name">' +
            aman(
              product.name || '-'
            ) +
          '</div>' +

          '<div class="result-item-barcode">' +
            'Barcode: ' +
            aman(
              barcode ||
              'Tidak ada'
            ) +
          '</div>' +

          '<div class="result-item-code">' +
            'Kode Accurate: ' +
            aman(
              kode ||
              '-'
            ) +
          '</div>' +

          '<div class="result-item-price">' +
            'Rp ' +
            aman(
              product.price || '-'
            ) +
          '</div>' +

        '</div>';

    }
  );


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      html;

}


/* =====================================================
   PILIH PRODUK
===================================================== */

function pilihProduk(
  index
) {

  const product =
    window.hasilPencarian[
      index
    ];


  if (!product) {
    return;
  }


  const barcode =
    normalisasi(
      product.barcode
    );


  const kode =
    normalisasi(
      product.kodeAccurate
    );


  document
    .getElementById(
      'searchInput'
    )
    .value =
      barcode ||
      kode ||
      '';


  cekProduk(
    product
  );

}


/* =====================================================
   CLEAR
===================================================== */

function clearSearch() {

  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'status'
    )
    .innerText =
      products.length +
      ' produk siap digunakan';

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  message
) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="error">' +
        message +
      '</div>';

}


/* =====================================================
   SCAN STATUS
===================================================== */

function tampilkanScanStatus(
  text
) {

  const element =
    document.getElementById(
      'scanStatus'
    );


  if (!element) {
    return;
  }


  element.innerText =
    text;


  element.style.display =
    'block';


  setTimeout(
    function() {

      if (element) {

        element.style.display =
          'none';

      }

    },
    700
  );

}


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(
  value
) {

  return String(
    value || ''
  )
  .trim()
  .toUpperCase();

}


/* =====================================================
   HAPUS CALLBACK SCRIPT
===================================================== */

function hapusScriptCallback(
  callbackName
) {

  const script =
    document.getElementById(
      callbackName
    );


  if (script) {

    script.remove();

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch(error) {}

}


/* =====================================================
   SAFE HTML
===================================================== */

function aman(
  text
) {

  return String(
    text
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =====================================================
   INPUT CAPITAL
===================================================== */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


/* =====================================================
   ENTER
===================================================== */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
        'Enter'
      ) {

        searchProduct();

      }

    }
  );


/* =====================================================
   LOAD
===================================================== */

loadProducts();

</script>
