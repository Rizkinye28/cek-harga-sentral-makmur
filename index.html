<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Cek Harga - Sentral Makmur</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html {
  touch-action: manipulation;
}

body {
  margin: 0;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-top: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

/* CAMERA */

#reader {
  width: 100%;
  height: 320px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  padding: 25px;
}

/* SCAN BOX */

.scan-box {
  position: absolute;
  left: 6%;
  right: 6%;
  top: 32%;
  height: 36%;
  border: 2px solid white;
  border-radius: 8px;
  z-index: 20;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.20);
}

.scan-line {
  position: absolute;
  left: 6%;
  right: 6%;
  top: 50%;
  height: 2px;
  background: white;
  z-index: 21;
  pointer-events: none;
  box-shadow: 0 0 8px white;
}

.scan-hint {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  color: white;
  font-size: 13px;
  z-index: 22;
  text-shadow: 0 1px 4px black;
  pointer-events: none;
}

/* CAMERA STATUS */

.camera-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.65);
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  white-space: nowrap;
}

/* AUTO ZOOM */

.auto-zoom-status {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.65);
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  display: none;
}

/* ZOOM */

#zoomControl {
  display: none;
  margin-top: 12px;
  background: #f1f1f1;
  padding: 14px;
  border-radius: 12px;
}

.zoom-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 3px;
}

.zoom-help {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin-bottom: 10px;
}

.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.zoom-label {
  font-size: 13px;
  font-weight: bold;
  min-width: 28px;
  text-align: center;
}

#zoomSlider {
  flex: 1;
  width: 100%;
  height: 38px;
  cursor: pointer;
  touch-action: pan-x;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}

#zoomSlider::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -9px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid white;
  box-shadow: 0 1px 5px rgba(0,0,0,.25);
}

#zoomSlider::-moz-range-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid white;
}

#zoomValue {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 6px;
}

/* BUTTON */

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.scan-button {
  background: #1f4e78;
  color: white;
}

.stop-button {
  background: #ddd;
  color: #222;
  display: none;
}

/* SEARCH */

.search-area {
  margin-top: 18px;
}

.search-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.manual {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  text-transform: uppercase;
}

.check-button {
  width: auto;
  margin-top: 0;
  background: #1f4e78;
  color: white;
}

.clear-button {
  background: #eee;
  color: #222;
}

/* STATUS */

.status {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #777;
}

/* RESULT */

.result {
  margin-top: 18px;
}

.product-card {
  background: #eef8f1;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.4;
}

.product-barcode {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
}

.price {
  font-size: 38px;
  font-weight: bold;
  margin-top: 10px;
}

/* STOK */

.stock-box {
  margin-top: 18px;
  padding: 15px;
  border-radius: 13px;
  text-align: center;
}

.stok-aman {
  background: #e8f7ed;
  color: #187a3d;
}

.stok-habis {
  background: #fff1f1;
  color: #b42318;
}

.stock-label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
}

.stock-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 5px;
}

.accurate-code {
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}

/* MULTIPLE RESULT */

.result-count {
  font-weight: bold;
  margin-bottom: 8px;
}

.result-item {
  background: white;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 14px;
  margin-top: 9px;
  cursor: pointer;
}

.result-item:active {
  transform: scale(.99);
}

.result-item-name {
  font-weight: bold;
  line-height: 1.4;
}

.result-item-barcode {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.result-item-price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 7px;
}

/* ERROR */

.error {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #fff1f1;
  color: #b42318;
  text-align: center;
  font-weight: bold;
}

.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #888;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
SENTRAL MAKMUR
</div>

<div class="subtitle">
CEK HARGA & STOK PRODUK
</div>

<div class="card">

<!-- CAMERA -->

<div id="reader">

<div class="camera-message">
Tekan MULAI SCAN untuk membuka kamera belakang
</div>

</div>


<!-- ZOOM -->

<div id="zoomControl">

<div class="zoom-title">
🔍 ZOOM KAMERA
</div>

<div class="zoom-help">
Barcode kecil akan dicoba diperbesar otomatis.
</div>

<div class="zoom-row">

<div class="zoom-label">
1×
</div>

<input
id="zoomSlider"
type="range"
min="1"
max="3"
step="0.1"
value="1">

<div class="zoom-label">
3×
</div>

</div>

<div id="zoomValue">
1.0×
</div>

</div>


<!-- STATUS -->

<div id="status" class="status">
Memuat data produk...
</div>


<!-- START -->

<button
id="startButton"
class="scan-button"
onclick="startScanner()">

📷 MULAI SCAN

</button>


<!-- STOP -->

<button
id="stopButton"
class="stop-button"
onclick="stopScanner()">

⏹ HENTIKAN SCAN

</button>


<!-- SEARCH -->

<div class="search-area">

<div class="search-title">
🔎 Cari barcode atau nama produk
</div>

<div class="manual">

<input
id="searchInput"
type="text"
inputmode="text"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
placeholder="AMZ003 / CHOCOLATE">

<button
class="check-button"
onclick="searchProduct()">

CEK

</button>

</div>

<button
class="clear-button"
onclick="clearSearch()">

HAPUS PENCARIAN

</button>

</div>


<div id="result"></div>

</div>

<div class="footer">

Scan barcode atau cari nama produk

</div>

</div>


<script>

/* =====================================================
   URL API GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzCIC_CqDz406f9DCpg9hihD_Jgqw5b-yfwjOrNm7F-eRwUeR-D4uSOyi3KqZRTVpw/exec';


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let codeReader = null;

let scannerControls = null;

let currentStream = null;

let zoomTrack = null;

let zoomMin = 1;

let zoomMax = 3;

let zoomStep = 0.1;

let zoomCurrent = 1;

let autoZoomTimer = null;

let autoZoomLevel = 1;

let lastBarcode = '';

let lastScanTime = 0;

let audioContext = null;

const AUTO_ZOOM_MAX = 3;


/* =====================================================
   LOAD PRODUCTS
===================================================== */

function loadProducts() {

const status =
document.getElementById('status');

status.innerText =
'⏳ Memuat data produk...';

const callbackName =
'produkCallback_' + Date.now();

window[callbackName] =
function(data) {

products =
Array.isArray(data)
? data
: [];

status.innerText =
'✓ ' +
products.length +
' produk siap digunakan';

const script =
document.getElementById(callbackName);

if (script) {
script.remove();
}

delete window[callbackName];

};

const script =
document.createElement('script');

script.id =
callbackName;

script.src =
API_URL +
'?callback=' +
encodeURIComponent(callbackName);

script.onerror =
function() {

status.innerText =
'❌ Data produk gagal dimuat';

tampilkanError(
'Tidak dapat mengambil data produk.'
);

delete window[callbackName];

};

document.body.appendChild(script);

}


/* =====================================================
   START SCANNER
   KAMERA BELAKANG
===================================================== */

async function startScanner() {

try {

aktifkanAudio();

if (
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
) {

throw new Error(
'Browser tidak mendukung akses kamera.'
);

}


/* TOMBOL */

document
.getElementById('startButton')
.style.display = 'none';

document
.getElementById('stopButton')
.style.display = 'block';


/* READER */

const reader =
document.getElementById('reader');

reader.innerHTML = '';


/* VIDEO */

const video =
document.createElement('video');

video.autoplay = true;

video.muted = true;

video.playsInline = true;

video.setAttribute(
'playsinline',
'');

video.setAttribute(
'webkit-playsinline',
'');

reader.appendChild(video);


/* STATUS KAMERA */

const cameraStatus =
document.createElement('div');

cameraStatus.className =
'camera-status';

cameraStatus.innerText =
'📷 Kamera belakang';

reader.appendChild(
cameraStatus
);


/* SCAN BOX */

const scanBox =
document.createElement('div');

scanBox.className =
'scan-box';

reader.appendChild(
scanBox
);


/* SCAN LINE */

const scanLine =
document.createElement('div');

scanLine.className =
'scan-line';

reader.appendChild(
scanLine
);


/* HINT */

const hint =
document.createElement('div');

hint.className =
'scan-hint';

hint.innerText =
'Arahkan barcode ke dalam kotak';

reader.appendChild(
hint
);


/* AUTO ZOOM */

const autoZoomStatus =
document.createElement('div');

autoZoomStatus.className =
'auto-zoom-status';

autoZoomStatus.id =
'autoZoomStatus';

autoZoomStatus.innerText =
'🔍 Auto Zoom';

reader.appendChild(
autoZoomStatus
);


/* =====================================================
   BAGIAN PALING PENTING:
   PAKSA CAMERA ENVIRONMENT / BELAKANG
===================================================== */

let stream = null;


/*
 * Percobaan pertama:
 * exact environment.
 *
 * Ini meminta kamera belakang secara tegas.
 */

try {

stream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: {
exact: 'environment'
},

width: {
ideal: 1920
},

height: {
ideal: 1080
}

},

audio: false

});

}


/*
 * Jika exact ditolak browser,
 * coba environment biasa.
 */

catch (firstError) {

console.warn(
'Exact environment gagal:',
firstError
);

stream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: 'environment',

width: {
ideal: 1920
},

height: {
ideal: 1080
}

},

audio: false

});

}


currentStream =
stream;


/* =====================================================
   CEK KAMERA YANG AKTIF
===================================================== */

const tracks =
stream.getVideoTracks();

if (
!tracks ||
tracks.length === 0
) {

throw new Error(
'Kamera tidak ditemukan.'
);

}

const activeTrack =
tracks[0];

const settings =
activeTrack.getSettings();

console.log(
'Kamera aktif:',
activeTrack.label
);

console.log(
'Camera settings:',
settings
);


/* =====================================================
   TAMPILKAN VIDEO
===================================================== */

video.srcObject =
stream;

await video.play();


/* =====================================================
   ZOOM
===================================================== */

setupZoom();


/* STATUS */

document
.getElementById('status')
.innerText =
'📷 Kamera belakang aktif';


/* =====================================================
   ZXING
===================================================== */

codeReader =
new ZXingBrowser
.BrowserMultiFormatReader();


/*
 * Decode langsung dari stream
 * yang sudah kita paksa menjadi environment.
 */

scannerControls =
await codeReader.decodeFromStream(

stream,

video,

function(result, error) {

if (!result) {

jalankanAutoZoom();

return;

}


const barcode =
String(
result.getText()
)
.trim()
.toUpperCase();


if (!barcode) {

jalankanAutoZoom();

return;

}


const now =
Date.now();


if (
barcode === lastBarcode &&
now - lastScanTime < 2000
) {

return;

}


lastBarcode =
barcode;

lastScanTime =
now;


hentikanAutoZoom();


bunyiBerhasil();

getarBerhasil();


document
.getElementById('searchInput')
.value =
barcode;


searchBarcode(
barcode
);

}

);

}

catch (error) {

console.error(
'CAMERA ERROR:',
error
);

tampilkanError(

'❌ Kamera tidak dapat digunakan.' +

'<br><br>' +

aman(
error.message ||
error.name ||
''
)

);

stopScanner();

}

}


/* =====================================================
   AUDIO
===================================================== */

function aktifkanAudio() {

try {

if (!audioContext) {

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if (
audioContext.state ===
'suspended'
) {

audioContext.resume();

}

}

catch (error) {

console.log(
'Audio tidak tersedia:',
error
);

}

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

try {

if (
'vibrate' in navigator
) {

navigator.vibrate(
[100]
);

}

}

catch (error) {}

}


function getarTidakDitemukan() {

try {

if (
'vibrate' in navigator
) {

navigator.vibrate(
[80,70,80]
);

}

}

catch (error) {}

}


/* =====================================================
   BUNYI BERHASIL
===================================================== */

function bunyiBerhasil() {

try {

aktifkanAudio();

if (!audioContext) {
return;
}

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.type =
'sine';

oscillator.frequency.setValueAtTime(
1450,
audioContext.currentTime
);

gain.gain.setValueAtTime(
0.0001,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.55,
audioContext.currentTime + 0.01
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioContext.currentTime + 0.20
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start();

oscillator.stop(
audioContext.currentTime + 0.21
);

}

catch (error) {}

}


/* =====================================================
   BUNYI TIDAK DITEMUKAN
===================================================== */

function bunyiTidakDitemukan() {

try {

aktifkanAudio();

if (!audioContext) {
return;
}

bunyiNada(
650,
0
);

setTimeout(
function() {

bunyiNada(
450,
150
);

},
150
);

}

catch (error) {}

}


/* =====================================================
   NADA
===================================================== */

function bunyiNada(
frequency,
delay
) {

setTimeout(
function() {

try {

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.type =
'sine';

oscillator.frequency.setValueAtTime(
frequency,
audioContext.currentTime
);

gain.gain.setValueAtTime(
0.0001,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.35,
audioContext.currentTime + 0.01
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioContext.currentTime + 0.12
);

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start();

oscillator.stop(
audioContext.currentTime + 0.13
);

}

catch (error) {}

},
delay
);

}


/* =====================================================
   SETUP ZOOM
===================================================== */

function setupZoom() {

const control =
document.getElementById(
'zoomControl'
);

const slider =
document.getElementById(
'zoomSlider'
);

if (!currentStream) {

control.style.display =
'none';

return;

}

const tracks =
currentStream.getVideoTracks();

if (
!tracks ||
tracks.length === 0
) {

control.style.display =
'none';

return;

}

const track =
tracks[0];

zoomTrack =
track;


if (!track.getCapabilities) {

control.style.display =
'none';

return;

}

const capabilities =
track.getCapabilities();


if (!capabilities.zoom) {

control.style.display =
'none';

return;

}


zoomMin =
Number(
capabilities.zoom.min || 1
);

zoomMax =
Number(
capabilities.zoom.max || 3
);

zoomStep =
Number(
capabilities.zoom.step || 0.1
);


zoomMax =
Math.min(
zoomMax,
3
);


slider.min =
zoomMin;

slider.max =
zoomMax;

slider.step =
zoomStep;


zoomCurrent =
Math.max(
1,
zoomMin
);


if (
zoomCurrent > zoomMax
) {

zoomCurrent =
zoomMax;

}


slider.value =
zoomCurrent;


control.style.display =
'block';

updateZoomDisplay();

applyZoom();

}


/* =====================================================
   SLIDER
===================================================== */

document
.getElementById(
'zoomSlider'
)
.addEventListener(
'input',
function() {

if (!zoomTrack) {
return;
}

hentikanAutoZoom();

zoomCurrent =
Number(
this.value
);

zoomCurrent =
roundZoom(
zoomCurrent
);

applyZoom();

}
);


/* =====================================================
   APPLY ZOOM
===================================================== */

function applyZoom() {

if (!zoomTrack) {
return;
}

try {

zoomTrack.applyConstraints({

advanced: [
{
zoom:
zoomCurrent
}
]

});

updateZoomDisplay();

}

catch (error) {

console.log(
'Zoom tidak tersedia:',
error
);

}

}


/* =====================================================
   AUTO ZOOM
===================================================== */

function jalankanAutoZoom() {

if (!zoomTrack) {
return;
}

if (
zoomMax <= 1
) {

return;

}

if (autoZoomTimer) {
return;
}


autoZoomTimer =
setTimeout(
function() {

autoZoomTimer =
null;


if (
!zoomTrack ||
!currentStream
) {

return;

}


if (
autoZoomLevel <
AUTO_ZOOM_MAX
) {

autoZoomLevel +=
0.5;


if (
autoZoomLevel >
zoomMax
) {

autoZoomLevel =
zoomMax;

}


zoomCurrent =
autoZoomLevel;


const slider =
document.getElementById(
'zoomSlider'
);

slider.value =
zoomCurrent;


applyZoom();

tampilkanAutoZoom();

}

},
1200
);

}


/* =====================================================
   RESET AUTO ZOOM
===================================================== */

function resetAutoZoom() {

autoZoomLevel =
Math.max(
1,
zoomMin
);

}


/* =====================================================
   STOP AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

if (autoZoomTimer) {

clearTimeout(
autoZoomTimer
);

autoZoomTimer =
null;

}

resetAutoZoom();

sembunyikanAutoZoom();

}


/* =====================================================
   TAMPILKAN AUTO ZOOM
===================================================== */

function tampilkanAutoZoom() {

const element =
document.getElementById(
'autoZoomStatus'
);

if (!element) {
return;
}

element.style.display =
'block';

element.innerText =
'🔍 Auto Zoom ' +
Number(
zoomCurrent
)
.toFixed(1) +
'×';


setTimeout(
function() {

sembunyikanAutoZoom();

},
900
);

}


/* =====================================================
   SEMBUNYIKAN AUTO ZOOM
===================================================== */

function sembunyikanAutoZoom() {

const element =
document.getElementById(
'autoZoomStatus'
);

if (element) {

element.style.display =
'none';

}

}


/* =====================================================
   UPDATE ZOOM
===================================================== */

function updateZoomDisplay() {

document
.getElementById(
'zoomValue'
)
.innerText =
Number(
zoomCurrent
)
.toFixed(1) +
'×';

}


/* =====================================================
   ROUND ZOOM
===================================================== */

function roundZoom(
value
) {

return Math.round(
value * 10
) / 10;

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

hentikanAutoZoom();


try {

if (scannerControls) {

scannerControls.stop();

}

}

catch (e) {}


scannerControls =
null;


try {

if (codeReader) {

codeReader.reset();

}

}

catch (e) {}


codeReader =
null;


if (currentStream) {

currentStream
.getTracks()
.forEach(
function(track) {

track.stop();

}
);

}


currentStream =
null;

zoomTrack =
null;


document
.getElementById(
'zoomControl'
)
.style.display =
'none';


document
.getElementById(
'stopButton'
)
.style.display =
'none';


document
.getElementById(
'startButton'
)
.style.display =
'block';


document
.getElementById(
'reader'
)
.innerHTML =

'<div class="camera-message">' +

'Tekan MULAI SCAN untuk membuka kamera belakang' +

'</div>';

}


/* =====================================================
   SEARCH MANUAL
===================================================== */

function searchProduct() {

const input =
document.getElementById(
'searchInput'
);

const keyword =
String(
input.value || ''
)
.trim()
.toUpperCase();


input.value =
keyword;


if (!keyword) {

tampilkanError(
'Masukkan barcode atau nama produk.'
);

return;

}


/* CARI BARCODE */

const exact =
products.find(
function(product) {

return (

String(
product.barcode || ''
)
.trim()
.toUpperCase()

===

keyword

);

}
);


if (exact) {

searchBarcode(
exact.barcode
);

return;

}


/* CARI NAMA */

const hasil =
products.filter(
function(product) {

const name =
String(
product.name || ''
)
.toUpperCase();

return name.includes(
keyword
);

}
);


if (
hasil.length === 0
) {

tampilkanError(
'Produk tidak ditemukan.' +
'<br><br>' +
'Pencarian: ' +
aman(keyword)
);

return;

}


if (
hasil.length === 1
) {

searchBarcode(
hasil[0].barcode
);

return;

}


tampilkanDaftar(
hasil
);

}


/* =====================================================
   SEARCH BARCODE
===================================================== */

function searchBarcode(
barcode
) {

barcode =
String(
barcode || ''
)
.trim()
.toUpperCase();


if (!barcode) {
return;
}


document
.getElementById(
'status'
)
.innerText =
'⏳ Mengecek harga dan stok Accurate...';


const callbackName =
'stokCallback_' +
Date.now();


window[callbackName] =
function(response) {

try {

if (
!response ||
!response.success
) {

bunyiTidakDitemukan();

getarTidakDitemukan();

tampilkanError(

response &&
response.error

?

aman(
response.error
)

:

'Data produk tidak ditemukan.'

);

document
.getElementById(
'status'
)
.innerText =
'❌ Produk tidak ditemukan';

return;

}


const data =
response.data;


tampilkanProdukDenganStok(
data
);


document
.getElementById(
'status'
)
.innerText =
'✓ Produk ditemukan';

}

catch (error) {

console.error(
error
);

tampilkanError(
'Terjadi kesalahan saat membaca data.'
);

}


const script =
document.getElementById(
callbackName
);

if (script) {

script.remove();

}

delete window[
callbackName
];

};


const script =
document.createElement(
'script'
);

script.id =
callbackName;


script.src =

API_URL +

'?aksi=stok' +

'&barcode=' +

encodeURIComponent(
barcode
) +

'&callback=' +

encodeURIComponent(
callbackName
);


script.onerror =
function() {

tampilkanError(
'Tidak dapat mengambil data stok Accurate.'
);

document
.getElementById(
'status'
)
.innerText =
'❌ Gagal mengambil stok';

delete window[
callbackName
];

};


document
.body
.appendChild(
script
);

}


/* =====================================================
   TAMPILKAN PRODUK
===================================================== */

function tampilkanProdukDenganStok(
data
) {

const stok =
Number(
data.stok || 0
);


const stokClass =
stok > 0
?
'stok-aman'
:
'stok-habis';


const stokText =
stok > 0

?

stok +
' ' +
(data.satuan || 'PCS')

:

'HABIS';


document
.getElementById(
'result'
)
.innerHTML =

'<div class="product-card">' +

'<div class="product-name">' +

aman(
data.nama || ''
) +

'</div>' +

'<div class="product-barcode">' +

'Barcode: ' +

aman(
data.barcode || ''
) +

'</div>' +

'<div class="price">' +

'Rp ' +

aman(
data.harga || '-'
) +

'</div>' +

'<div class="stock-box ' +

stokClass +

'">' +

'<div class="stock-label">' +

'STOK TERSEDIA' +

'</div>' +

'<div class="stock-number">' +

aman(
stokText
) +

'</div>' +

'</div>' +

'<div class="accurate-code">' +

'Kode Accurate: ' +

aman(
data.kodeAccurate || '-'
) +

'</div>' +

'</div>';

}


/* =====================================================
   MULTIPLE RESULT
===================================================== */

function tampilkanDaftar(
hasil
) {

let html =

'<div class="result-count">' +

'🔎 Ditemukan ' +

hasil.length +

' produk' +

'</div>';


hasil.forEach(
function(product,index) {

html +=

'<div class="result-item" ' +

'onclick="pilihProduk(' +

index +

')">' +

'<div class="result-item-name">' +

aman(
product.name
) +

'</div>' +

'<div class="result-item-barcode">' +

'Barcode: ' +

aman(
product.barcode
) +

'</div>' +

'<div class="result-item-price">' +

'Rp ' +

aman(
product.price
) +

'</div>' +

'</div>';

}
);


window.hasilPencarian =
hasil;


document
.getElementById(
'result'
)
.innerHTML =
html;

}


/* =====================================================
   PILIH PRODUK
===================================================== */

function pilihProduk(
index
) {

const product =
window.hasilPencarian[
index
];


if (!product) {
return;
}


document
.getElementById(
'searchInput'
)
.value =
String(
product.barcode || ''
)
.toUpperCase();


searchBarcode(
product.barcode
);

}


/* =====================================================
   CLEAR
===================================================== */

function clearSearch() {

document
.getElementById(
'searchInput'
)
.value =
'';


document
.getElementById(
'result'
)
.innerHTML =
'';

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
message
) {

document
.getElementById(
'result'
)
.innerHTML =

'<div class="error">' +

message +

'</div>';

}


/* =====================================================
   SAFE TEXT
===================================================== */

function aman(
text
) {

return String(text)

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}


/* =====================================================
   INPUT KAPITAL
===================================================== */

document
.getElementById(
'searchInput'
)
.addEventListener(
'input',
function() {

this.value =
this.value.toUpperCase();

}
);


/* =====================================================
   ENTER
===================================================== */

document
.getElementById(
'searchInput'
)
.addEventListener(
'keydown',
function(event) {

if (
event.key === 'Enter'
) {

searchProduct();

}

}
);


/* =====================================================
   LOAD DATA
===================================================== */

loadProducts();

</script>

</body>

</html>
