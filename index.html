<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Cek Harga - Sentral Makmur</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html {
  touch-action: manipulation;
}

body {
  margin: 0;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-top: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}


/* =========================================================
   CAMERA
========================================================= */

#reader {
  width: 100%;
  height: 340px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #111;
}

.camera-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  padding: 25px;
  z-index: 10;
}


/* =========================================================
   SCAN AREA
========================================================= */

.scan-box {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 27%;
  height: 46%;
  border: 2px solid #fff;
  border-radius: 8px;
  z-index: 20;
  pointer-events: none;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.18);
}

.scan-line {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 50%;
  height: 2px;
  background: #fff;
  z-index: 21;
  pointer-events: none;
  box-shadow: 0 0 8px #fff;
}

.scan-hint {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 13px;
  z-index: 22;
  text-shadow: 0 1px 4px #000;
  pointer-events: none;
}

.auto-zoom-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.7);
  color: #fff;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  display: none;
}


/* =========================================================
   ZOOM
========================================================= */

#zoomControl {
  display: none;
  margin-top: 12px;
  background: #f1f1f1;
  padding: 14px;
  border-radius: 12px;
}

.zoom-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.zoom-help {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin: 5px 0 10px;
}

.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.zoom-label {
  font-size: 13px;
  font-weight: bold;
  min-width: 28px;
  text-align: center;
}

#zoomSlider {
  flex: 1;
  width: 100%;
  height: 38px;
  cursor: pointer;
  touch-action: pan-x;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}

#zoomSlider::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -9px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid #fff;
}

#zoomSlider::-moz-range-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid #fff;
}

#zoomValue {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 6px;
}


/* =========================================================
   BUTTON
========================================================= */

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.scan-button {
  background: #1f4e78;
  color: #fff;
}

.stop-button {
  background: #ddd;
  color: #222;
  display: none;
}


/* =========================================================
   SEARCH
========================================================= */

.search-area {
  margin-top: 18px;
}

.search-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.manual {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  text-transform: uppercase;
}

.check-button {
  width: auto;
  margin-top: 0;
  background: #1f4e78;
  color: #fff;
}

.clear-button {
  background: #eee;
  color: #222;
}


/* =========================================================
   STATUS
========================================================= */

.status {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #777;
}


/* =========================================================
   RESULT
========================================================= */

.result {
  margin-top: 18px;
}

.product-card {
  background: #eef8f1;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.4;
}

.product-barcode {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
}

.price {
  font-size: 38px;
  font-weight: bold;
  margin-top: 10px;
}

.stock-box {
  margin-top: 18px;
  padding: 15px;
  border-radius: 13px;
  text-align: center;
}

.stok-aman {
  background: #e8f7ed;
  color: #187a3d;
}

.stok-habis {
  background: #fff1f1;
  color: #b42318;
}

.stock-label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
}

.stock-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 5px;
}

.accurate-code {
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}


/* =========================================================
   ERROR / LOADING
========================================================= */

.error {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #fff1f1;
  color: #b42318;
  text-align: center;
  font-weight: bold;
  word-break: break-word;
}

.loading {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #f1f5f9;
  color: #475569;
  text-align: center;
  font-weight: bold;
}


/* =========================================================
   MULTIPLE RESULT
========================================================= */

.result-count {
  font-weight: bold;
  margin-bottom: 8px;
}

.result-item {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 14px;
  margin-top: 9px;
  cursor: pointer;
}

.result-item:active {
  transform: scale(.99);
}

.result-item-name {
  font-weight: bold;
  line-height: 1.4;
}

.result-item-barcode {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.result-item-price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 7px;
}

.result-item-code {
  font-size: 12px;
  color: #888;
  margin-top: 5px;
}

.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #888;
}

</style>

</head>


<body>


<div class="container">

  <div class="title">
    SENTRAL MAKMUR
  </div>

  <div class="subtitle">
    CEK HARGA & STOK PRODUK
  </div>


  <div class="card">


    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <div id="reader">

      <div class="camera-message">
        Tekan MULAI SCAN untuk membuka kamera
      </div>

    </div>


    <!-- =====================================================
         ZOOM
    ====================================================== -->

    <div id="zoomControl">

      <div class="zoom-title">
        🔍 ZOOM KAMERA
      </div>

      <div class="zoom-help">
        Auto Zoom membantu membaca barcode kecil.
      </div>

      <div class="zoom-row">

        <div class="zoom-label">
          1×
        </div>

        <input
          id="zoomSlider"
          type="range"
          min="1"
          max="3"
          step="0.1"
          value="1">

        <div class="zoom-label">
          3×
        </div>

      </div>

      <div id="zoomValue">
        1.0×
      </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div id="status" class="status">
      Siap digunakan
    </div>


    <!-- =====================================================
         BUTTON
    ====================================================== -->

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()">

      📷 MULAI SCAN

    </button>


    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()">

      ⏹ HENTIKAN SCAN

    </button>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div class="search-area">

      <div class="search-title">
        🔎 Cari barcode atau nama produk
      </div>

      <div class="manual">

        <input
          id="searchInput"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="AMZ003 / CHOCOLATE">

        <button
          class="check-button"
          onclick="searchProduct()">

          CEK

        </button>

      </div>


      <button
        class="clear-button"
        onclick="clearSearch()">

        HAPUS PENCARIAN

      </button>

    </div>


    <div id="result"></div>


  </div>


  <div class="footer">
    Scan barcode atau cari nama produk
  </div>


</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =========================================================
   DATA
========================================================= */

let products = [];

let codeReader = null;

let scannerControls = null;

let currentStream = null;

let scannerStarting = false;

let lastBarcode = '';

let lastScanTime = 0;

let zoomTrack = null;

let zoomMin = 1;

let zoomMax = 3;

let zoomCurrent = 1;

let autoZoomTimer = null;

let autoZoomLevel = 1;

let audioContext = null;


/* =========================================================
   AUTO ZOOM
========================================================= */

const AUTO_ZOOM_MAX = 3;

const AUTO_ZOOM_DELAY = 350;

const AUTO_ZOOM_STEP = 0.7;


/* =========================================================
   LOAD PRODUCTS
========================================================= */

function loadProducts() {

  const status =
    document.getElementById('status');


  status.innerText =
    '⏳ Menyiapkan data produk...';


  const callbackName =
    'produkCallback_' +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (
          data &&
          data.success === true &&
          Array.isArray(data.data)
        ) {

          products =
            data.data;


          status.innerText =
            '✓ ' +
            products.length +
            ' produk siap digunakan';

        }

        else {

          status.innerText =
            '⚠ Data produk belum tersedia';

        }

      }

      catch(error) {

        console.error(
          error
        );

        status.innerText =
          '⚠ Gagal membaca data produk';

      }


      hapusScriptCallback(
        callbackName
      );

    };


  const script =
    document.createElement('script');


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?aksi=produk' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      status.innerText =
        '⚠ Data produk belum dapat dimuat';

      hapusScriptCallback(
        callbackName
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   HELPER CALLBACK
========================================================= */

function hapusScriptCallback(
  callbackName
) {

  const script =
    document.getElementById(
      callbackName
    );


  if (script) {

    script.remove();

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch(error) {}

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  if (scannerStarting) {
    return;
  }


  if (currentStream) {
    return;
  }


  scannerStarting = true;


  try {

    aktifkanAudio();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML = '';


    const video =
      document.createElement('video');


    video.autoplay = true;

    video.muted = true;

    video.playsInline = true;

    video.setAttribute(
      'playsinline',
      ''
    );


    reader.appendChild(
      video
    );


    buatOverlayScanner(
      reader
    );


    /* =====================================================
       ZXING
    ===================================================== */

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /* =====================================================
       PILIH KAMERA BELAKANG
    ===================================================== */

    let deviceId =
      devices[devices.length - 1].deviceId;


    for (
      const device of devices
    ) {

      const label =
        String(
          device.label || ''
        )
        .toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('belakang')
      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    /* =====================================================
       CAMERA CONSTRAINT
    ===================================================== */

    currentStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {
              exact: deviceId
            },

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30,
              max: 60
            }

          },

          audio: false

        });


    video.srcObject =
      currentStream;


    await video.play();


    setupZoom();


    document
      .getElementById(
        'startButton'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'stopButton'
      )
      .style.display =
        'block';


    document
      .getElementById(
        'status'
      )
      .innerText =
        '📷 Scanner aktif — arahkan barcode';


    /* =====================================================
       START ZXING
    ===================================================== */

    scannerControls =
      await codeReader
        .decodeFromStream(

          currentStream,

          video,

          function(result, error) {

            if (!result) {

              jalankanAutoZoom();

              return;

            }


            const barcode =
              String(
                result.getText() || ''
              )
              .trim()
              .toUpperCase();


            if (!barcode) {
              return;
            }


            const now =
              Date.now();


            if (
              barcode === lastBarcode &&
              now - lastScanTime < 2500
            ) {

              return;

            }


            lastBarcode =
              barcode;


            lastScanTime =
              now;


            hentikanAutoZoom();


            bunyiBerhasil();

            getarBerhasil();


            document
              .getElementById(
                'searchInput'
              )
              .value =
                barcode;


            /*
             * LANGSUNG CEK BARCODE.
             *
             * Tidak menunggu products selesai.
             */

            searchBarcode(
              barcode
            );

          }

        );

  }

  catch(error) {

    console.error(
      'KAMERA ERROR:',
      error
    );


    tampilkanError(
      'Kamera tidak dapat digunakan.' +
      '<br><br>' +
      aman(
        error.message ||
        error.name ||
        ''
      )
    );


    stopScanner();

  }

  finally {

    scannerStarting =
      false;

  }

}


/* =========================================================
   OVERLAY SCANNER
========================================================= */

function buatOverlayScanner(
  reader
) {

  const scanBox =
    document.createElement('div');


  scanBox.className =
    'scan-box';


  reader.appendChild(
    scanBox
  );


  const scanLine =
    document.createElement('div');


  scanLine.className =
    'scan-line';


  reader.appendChild(
    scanLine
  );


  const hint =
    document.createElement('div');


  hint.className =
    'scan-hint';


  hint.innerText =
    'Arahkan barcode ke dalam kotak';


  reader.appendChild(
    hint
  );


  const autoZoomStatus =
    document.createElement('div');


  autoZoomStatus.className =
    'auto-zoom-status';


  autoZoomStatus.id =
    'autoZoomStatus';


  autoZoomStatus.innerText =
    '🔍 Auto Zoom';


  reader.appendChild(
    autoZoomStatus
  );

}


/* =========================================================
   AUDIO
========================================================= */

function aktifkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {}

}


function bunyiBerhasil() {

  try {

    aktifkanAudio();


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.setValueAtTime(
      1450,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.45,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.18
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.19
    );

  }

  catch(error) {}

}


function bunyiTidakDitemukan() {

  try {

    aktifkanAudio();


    bunyiNada(
      650
    );


    setTimeout(
      function() {

        bunyiNada(
          450
        );

      },
      150
    );

  }

  catch(error) {}

}


function bunyiNada(
  frequency
) {

  try {

    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.setValueAtTime(
      frequency,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.3,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.12
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.13
    );

  }

  catch(error) {}

}


function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [100]
      );

    }

  }

  catch(error) {}

}


function getarTidakDitemukan() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [80,70,80]
      );

    }

  }

  catch(error) {}

}


/* =========================================================
   ZOOM
========================================================= */

function setupZoom() {

  const control =
    document.getElementById(
      'zoomControl'
    );


  const slider =
    document.getElementById(
      'zoomSlider'
    );


  if (!currentStream) {

    control.style.display =
      'none';

    return;

  }


  const tracks =
    currentStream.getVideoTracks();


  if (
    !tracks ||
    tracks.length === 0
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomTrack =
    tracks[0];


  if (
    !zoomTrack.getCapabilities
  ) {

    control.style.display =
      'none';

    return;

  }


  const capabilities =
    zoomTrack.getCapabilities();


  if (
    !capabilities.zoom
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomMin =
    Number(
      capabilities.zoom.min || 1
    );


  zoomMax =
    Number(
      capabilities.zoom.max || 3
    );


  zoomMax =
    Math.min(
      zoomMax,
      3
    );


  slider.min =
    zoomMin;


  slider.max =
    zoomMax;


  slider.step =
    Number(
      capabilities.zoom.step || 0.1
    );


  zoomCurrent =
    Math.max(
      1,
      zoomMin
    );


  if (
    zoomCurrent >
    zoomMax
  ) {

    zoomCurrent =
      zoomMax;

  }


  autoZoomLevel =
    zoomCurrent;


  slider.value =
    zoomCurrent;


  control.style.display =
    'block';


  applyZoom();

}


/* =========================================================
   MANUAL ZOOM
========================================================= */

document
  .getElementById(
    'zoomSlider'
  )
  .addEventListener(
    'input',
    function() {

      if (!zoomTrack) {
        return;
      }


      hentikanAutoZoom();


      zoomCurrent =
        Number(
          this.value
        );


      applyZoom();

    }
  );


function applyZoom() {

  if (!zoomTrack) {
    return;
  }


  try {

    zoomTrack.applyConstraints({

      advanced: [

        {

          zoom:
            zoomCurrent

        }

      ]

    });


    updateZoomDisplay();

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

  }

}


/* =========================================================
   AUTO ZOOM
========================================================= */

function jalankanAutoZoom() {

  if (!zoomTrack) {
    return;
  }


  if (
    zoomMax <= 1
  ) {

    return;

  }


  if (autoZoomTimer) {
    return;
  }


  autoZoomTimer =
    setTimeout(
      function() {

        autoZoomTimer =
          null;


        if (
          !zoomTrack ||
          !currentStream
        ) {

          return;

        }


        if (
          autoZoomLevel <
          AUTO_ZOOM_MAX
        ) {

          autoZoomLevel +=
            AUTO_ZOOM_STEP;


          if (
            autoZoomLevel >
            zoomMax
          ) {

            autoZoomLevel =
              zoomMax;

          }


          zoomCurrent =
            autoZoomLevel;


          const slider =
            document.getElementById(
              'zoomSlider'
            );


          if (slider) {

            slider.value =
              zoomCurrent;

          }


          applyZoom();


          tampilkanAutoZoom();

        }

      },
      AUTO_ZOOM_DELAY
    );

}


function hentikanAutoZoom() {

  if (autoZoomTimer) {

    clearTimeout(
      autoZoomTimer
    );

    autoZoomTimer =
      null;

  }


  autoZoomLevel =
    Math.max(
      1,
      zoomMin
    );


  sembunyikanAutoZoom();

}


function tampilkanAutoZoom() {

  const element =
    document.getElementById(
      'autoZoomStatus'
    );


  if (!element) {
    return;
  }


  element.style.display =
    'block';


  element.innerText =
    '🔍 Auto Zoom ' +
    Number(
      zoomCurrent
    ).toFixed(1) +
    '×';

}


function sembunyikanAutoZoom() {

  const element =
    document.getElementById(
      'autoZoomStatus'
    );


  if (element) {

    element.style.display =
      'none';

  }

}


function updateZoomDisplay() {

  document
    .getElementById(
      'zoomValue'
    )
    .innerText =
      Number(
        zoomCurrent
      ).toFixed(1) +
      '×';

}


/* =========================================================
   STOP SCANNER
========================================================= */

function stopScanner() {

  hentikanAutoZoom();


  try {

    if (scannerControls) {

      scannerControls.stop();

    }

  }

  catch(error) {}


  scannerControls =
    null;


  try {

    if (codeReader) {

      codeReader.reset();

    }

  }

  catch(error) {}


  codeReader =
    null;


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  currentStream =
    null;


  zoomTrack =
    null;


  scannerStarting =
    false;


  document
    .getElementById(
      'zoomControl'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'stopButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'startButton'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'reader'
    )
    .innerHTML =
      '<div class="camera-message">' +
      'Tekan MULAI SCAN untuk membuka kamera' +
      '</div>';

}


/* =========================================================
   SEARCH PRODUK
========================================================= */

function searchProduct() {

  const input =
    document.getElementById(
      'searchInput'
    );


  const keyword =
    String(
      input.value || ''
    )
    .trim()
    .toUpperCase();


  input.value =
    keyword;


  if (!keyword) {

    tampilkanError(
      'Masukkan barcode atau nama produk.'
    );

    return;

  }


  /* =======================================================
     1. BARCODE EXACT
  ======================================================= */

  const exactBarcode =
    products.find(
      function(product) {

        return (
          normalisasi(
            product.barcode
          ) === keyword
        );

      }
    );


  if (exactBarcode) {

    searchBarcode(
      exactBarcode.barcode
    );

    return;

  }


  /* =======================================================
     2. KODE ACCURATE EXACT
     
     Ini memungkinkan user mencari produk
     berdasarkan Kode Accurate.
  ======================================================= */

  const exactKode =
    products.find(
      function(product) {

        return (
          normalisasi(
            product.kodeAccurate
          ) === keyword
        );

      }
    );


  if (exactKode) {

    searchKodeAccurate(
      exactKode.kodeAccurate,
      exactKode
    );

    return;

  }


  /* =======================================================
     3. NAMA PRODUK
  ======================================================= */

  const hasil =
    products.filter(
      function(product) {

        const name =
          normalisasi(
            product.name
          );


        return name.includes(
          keyword
        );

      }
    );


  if (
    hasil.length === 0
  ) {

    tampilkanError(
      'Produk "' +
      aman(keyword) +
      '" tidak ditemukan.'
    );

    bunyiTidakDitemukan();

    getarTidakDitemukan();

    return;

  }


  if (
    hasil.length === 1
  ) {

    pilihProduk(
      0,
      hasil
    );

    return;

  }


  tampilkanDaftar(
    hasil
  );

}


/* =========================================================
   SEARCH BARCODE
========================================================= */

function searchBarcode(
  barcode
) {

  barcode =
    normalisasi(
      barcode
    );


  if (!barcode) {
    return;
  }


  document
    .getElementById(
      'status'
    )
    .innerText =
      '⏳ Mengecek stok Accurate...';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '<div class="loading">' +
      '⏳ Mengambil harga & stok...' +
      '</div>';


  requestJsonp(

    API_URL +
    '?aksi=stok' +
    '&barcode=' +
    encodeURIComponent(
      barcode
    ),

    function(response) {

      prosesResponseStok(
        response
      );

    }

  );

}


/* =========================================================
   SEARCH KODE ACCURATE
========================================================= */

function searchKodeAccurate(
  kodeAccurate,
  product
) {

  kodeAccurate =
    normalisasi(
      kodeAccurate
    );


  if (!kodeAccurate) {

    tampilkanError(
      'Produk ini belum memiliki Kode Accurate.'
    );

    return;

  }


  document
    .getElementById(
      'status'
    )
    .innerText =
      '⏳ Mengecek stok Accurate...';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '<div class="loading">' +
      '⏳ Mengambil harga & stok...' +
      '</div>';


  requestJsonp(

    API_URL +
    '?aksi=stokkode' +
    '&kodeAccurate=' +
    encodeURIComponent(
      kodeAccurate
    ),

    function(response) {

      /*
       * Kalau backend mengembalikan data,
       * harga/nama sudah berasal dari MASTER PRODUK.
       */

      prosesResponseStok(
        response
      );

    }

  );

}


/* =========================================================
   JSONP REQUEST
========================================================= */

function requestJsonp(
  url,
  callback
) {

  const callbackName =
    'callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 10000
    );


  let selesai =
    false;


  window[callbackName] =
    function(response) {

      if (selesai) {
        return;
      }


      selesai =
        true;


      try {

        callback(
          response
        );

      }

      finally {

        hapusScriptCallback(
          callbackName
        );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;


  script.src =
    url +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      if (selesai) {
        return;
      }


      selesai =
        true;


      tampilkanError(
        '❌ Tidak dapat terhubung ke server Apps Script.'
      );


      document
        .getElementById(
          'status'
        )
        .innerText =
        '❌ Gagal terhubung ke server';


      hapusScriptCallback(
        callbackName
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   RESPONSE STOK
========================================================= */

function prosesResponseStok(
  response
) {

  if (
    !response ||
    response.success !== true
  ) {

    bunyiTidakDitemukan();

    getarTidakDitemukan();


    tampilkanError(
      aman(
        response &&
        response.error
        ?
        response.error
        :
        'Data produk tidak ditemukan.'
      )
    );


    document
      .getElementById(
        'status'
      )
      .innerText =
      '❌ Data tidak ditemukan';


    return;

  }


  if (!response.data) {

    tampilkanError(
      'Data produk kosong.'
    );

    return;

  }


  tampilkanProdukDenganStok(
    response.data
  );


  document
    .getElementById(
      'status'
    )
    .innerText =
    '✓ Produk ditemukan';


  bunyiBerhasil();

  getarBerhasil();

}


/* =========================================================
   TAMPILKAN PRODUK
========================================================= */

function tampilkanProdukDenganStok(
  data
) {

  const stok =
    Number(
      data.stok || 0
    );


  const stokClass =
    stok > 0
    ?
    'stok-aman'
    :
    'stok-habis';


  const stokText =
    stok > 0
    ?
    formatAngka(stok) +
    ' ' +
    (
      data.satuan ||
      'PCS'
    )
    :
    'HABIS';


  const barcode =
    data.barcode
    ?
    data.barcode
    :
    'Tidak ada barcode';


  document
    .getElementById(
      'result'
    )
    .innerHTML =

    '<div class="product-card">' +

      '<div class="product-name">' +
        aman(
          data.nama || ''
        ) +
      '</div>' +

      '<div class="product-barcode">' +
        'Barcode: ' +
        aman(
          barcode
        ) +
      '</div>' +

      '<div class="price">' +
        'Rp ' +
        aman(
          data.harga || '-'
        ) +
      '</div>' +

      '<div class="stock-box ' +
        stokClass +
      '">' +

        '<div class="stock-label">' +
          'STOK TERSEDIA' +
        '</div>' +

        '<div class="stock-number">' +
          aman(
            stokText
          ) +
        '</div>' +

      '</div>' +

      '<div class="accurate-code">' +
        'Kode Accurate: ' +
        aman(
          data.kodeAccurate || '-'
        ) +
      '</div>' +

    '</div>';

}


/* =========================================================
   MULTIPLE RESULT
========================================================= */

function tampilkanDaftar(
  hasil
) {

  window.hasilPencarian =
    hasil;


  let html =
    '<div class="result-count">' +
      '🔎 Ditemukan ' +
      hasil.length +
      ' produk' +
    '</div>';


  hasil.forEach(
    function(
      product,
      index
    ) {

      const barcode =
        product.barcode
        ?
        product.barcode
        :
        'Tidak ada barcode';


      html +=

        '<div class="result-item" ' +
          'onclick="pilihProduk(' +
          index +
          ')">' +

          '<div class="result-item-name">' +
            aman(
              product.name || ''
            ) +
          '</div>' +

          '<div class="result-item-barcode">' +
            'Barcode: ' +
            aman(
              barcode
            ) +
          '</div>' +

          '<div class="result-item-price">' +
            'Rp ' +
            aman(
              product.price || '-'
            ) +
          '</div>' +

          '<div class="result-item-code">' +
            'Kode Accurate: ' +
            aman(
              product.kodeAccurate || '-'
            ) +
          '</div>' +

        '</div>';

    }
  );


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      html;

}


/* =========================================================
   PILIH PRODUK
========================================================= */

function pilihProduk(
  index,
  daftar
) {

  const list =
    daftar ||
    window.hasilPencarian ||
    [];


  const product =
    list[index];


  if (!product) {
    return;
  }


  document
    .getElementById(
      'searchInput'
    )
    .value =
      normalisasi(
        product.barcode ||
        product.kodeAccurate ||
        product.name
      );


  /*
   * PRODUK PUNYA BARCODE
   */

  if (
    normalisasi(
      product.barcode
    )
  ) {

    searchBarcode(
      product.barcode
    );

    return;

  }


  /*
   * PRODUK TIDAK PUNYA BARCODE
   *
   * Gunakan Kode Accurate.
   */

  if (
    normalisasi(
      product.kodeAccurate
    )
  ) {

    searchKodeAccurate(
      product.kodeAccurate,
      product
    );

    return;

  }


  tampilkanError(
    'Produk ini belum memiliki Barcode maupun Kode Accurate.'
  );

}


/* =========================================================
   CLEAR
========================================================= */

function clearSearch() {

  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'status'
    )
    .innerText =
      products.length
      ?
      products.length +
      ' produk siap digunakan'
      :
      'Siap digunakan';

}


/* =========================================================
   ERROR
========================================================= */

function tampilkanError(
  message
) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="error">' +
        message +
      '</div>';

}


/* =========================================================
   SAFE HTML
========================================================= */

function aman(
  text
) {

  return String(
    text || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =========================================================
   NORMALISASI
========================================================= */

function normalisasi(
  text
) {

  return String(
    text || ''
  )
  .trim()
  .toUpperCase();

}


/* =========================================================
   FORMAT ANGKA
========================================================= */

function formatAngka(
  value
) {

  const number =
    Number(
      value
    );


  if (
    isNaN(number)
  ) {

    return '0';

  }


  return number.toLocaleString(
    'id-ID'
  );

}


/* =========================================================
   INPUT CAPITAL
========================================================= */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        searchProduct();

      }

    }
  );


/* =========================================================
   LOAD
========================================================= */

loadProducts();

</script>
