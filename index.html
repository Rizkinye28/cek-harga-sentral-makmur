<style>

* {
  box-sizing: border-box;
}

html {
  touch-action: manipulation;
}

body {
  margin: 0;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

.title {
  text-align: center;
  font-size: 26px;
  font-weight: bold;

}

.subtitle {
  text-align: center;
  color: #777;
  margin: 6px 0 18px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}


/* =========================================================
   CAMERA
========================================================= */

#reader {
  width: 100%;
  height: 360px;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #111;
}

.camera-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  padding: 25px;
  font-size: 15px;
}


/* =========================================================
   SCAN BOX
========================================================= */

.scan-box {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 25%;
  height: 50%;
  border: 2px solid white;
  border-radius: 10px;
  z-index: 20;
  pointer-events: none;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.22);
}

.scan-corner {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  z-index: 22;
}

.corner-tl {
  left: 3%;
  top: 25%;
  border-width: 4px 0 0 4px;
}

.corner-tr {
  right: 3%;
  top: 25%;
  border-width: 4px 4px 0 0;
}

.corner-bl {
  left: 3%;
  bottom: 25%;
  border-width: 0 0 4px 4px;
}

.corner-br {
  right: 3%;
  bottom: 25%;
  border-width: 0 4px 4px 0;
}

.scan-line {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  height: 2px;
  background: white;
  z-index: 21;
  pointer-events: none;
  box-shadow: 0 0 9px white;
}

.scan-hint {
  position: absolute;
  bottom: 13px;
  left: 0;
  right: 0;
  text-align: center;
  color: white;
  font-size: 13px;
  z-index: 25;
  text-shadow: 0 1px 5px black;
  pointer-events: none;
}

.auto-zoom-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.7);
  color: white;
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  display: none;
  pointer-events: none;
}


/* =========================================================
   ZOOM
========================================================= */

#zoomControl {
  display: none;
  margin-top: 12px;
  background: #f1f1f1;
  padding: 13px;
  border-radius: 12px;
}

.zoom-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.zoom-help {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin: 4px 0 8px;
}

.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.zoom-label {
  min-width: 28px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

#zoomSlider {
  flex: 1;
  width: 100%;
  height: 38px;
  cursor: pointer;
  touch-action: pan-x;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}

#zoomSlider::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 27px;
  height: 27px;
  margin-top: -10px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid white;
  box-shadow: 0 1px 5px rgba(0,0,0,.25);
}

#zoomSlider::-moz-range-track {
  height: 7px;
  border-radius: 10px;
  background: #ccc;
}

#zoomSlider::-moz-range-thumb {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #1f4e78;
  border: 3px solid white;
}

#zoomValue {
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  margin-top: 5px;
}

========================================================= */

button {

<body>

<div class="container">

  <div class="title">
    SENTRAL MAKMUR
  </div>

  <div class="subtitle">
    CEK HARGA & STOK PRODUK
  </div>


  <div class="card">


    <!-- ===================================================
         CAMERA
    ==================================================== -->

    <div id="reader">

      <div class="camera-message">
        Tekan MULAI SCAN untuk membuka kamera
      </div>

    </div>


    <!-- ===================================================
         ZOOM
    ==================================================== -->

    <div id="zoomControl">

      <div class="zoom-title">
        🔍 ZOOM KAMERA
      </div>

      <div class="zoom-help">
        Auto Zoom akan membantu membaca barcode kecil.
      </div>

      <div class="zoom-row">

        <div class="zoom-label">
          1×
        </div>

        <input
          id="zoomSlider"
          type="range"
          min="1"
          max="3"
          step="0.1"
          value="1"
        >

        <div class="zoom-label">
          3×
        </div>

      </div>

      <div id="zoomValue">
        1.0×
      </div>

    </div>


    <!-- ===================================================
         STATUS
    ==================================================== -->

      ⏳ Memuat data produk...
    </div>


    <!-- ===================================================
         START
    ==================================================== -->

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()"
    >
      📷 MULAI SCAN
    </button>


    <!-- ===================================================
         STOP
    ==================================================== -->

    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()"
    >
      ⏹ HENTIKAN SCAN
    </button>


    <!-- ===================================================
         SEARCH
    ==================================================== -->

      <div class="search-title">

      </div>

          id="searchInput"
          type="text"

          autocapitalize="characters"
          spellcheck="false"
          placeholder="AMZ003 / CHOCOLATE / KODE"
        >

        <button
          class="check-button"
          onclick="searchProduct()"
        >
          CEK
        </button>

      </div>

        class="clear-button"

        HAPUS PENCARIAN

<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =========================================================
   DATA
========================================================= */

let products = [];

let codeReader = null;

let scannerControls = null;

let currentStream = null;

let scannerStarting = false;

let lastBarcode = '';

let lastScanTime = 0;

let hasilPencarian = [];


/* =========================================================
   ZOOM
========================================================= */

let zoomTrack = null;

let zoomMin = 1;

let zoomMax = 3;

let zoomStep = 0.1;

let zoomCurrent = 1;

let autoZoomTimer = null;

let autoZoomLevel = 1;


const AUTO_ZOOM_MAX = 3;

const AUTO_ZOOM_DELAY = 350;

const AUTO_ZOOM_STEP = 0.6;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


/* =========================================================
   LOAD PRODUCTS
========================================================= */

function loadProducts() {

  const status =
    document.getElementById('status');

  status.innerText =
    '⏳ Memuat data produk...';


  const callbackName =
    'produkCallback_' +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        console.log(
          'RESPONSE PRODUK:',
          data
        );


        if (
          data &&
          data.success === true &&
          Array.isArray(data.data)
        ) {

          products =
            data.data;


          status.innerText =
            '✓ ' +
            products.length +
            ' produk siap digunakan';

        }

        else {

          products = [];

          status.innerText =
            '❌ Data produk tidak ditemukan';

          tampilkanError(
            'Data produk dari server tidak sesuai format.'
          );

        }

      }

      catch(error) {

        console.error(
          'LOAD PRODUCT ERROR:',
          error
        );


        products = [];


        tampilkanError(
          'Gagal membaca data produk.'
        );

      }


      bersihkanCallback(
        callbackName
      );

    };


  const script =
    document.createElement('script');


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?aksi=produk' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      products = [];


      status.innerText =
        '❌ Data produk gagal dimuat';


      tampilkanError(
        'Tidak dapat mengambil data produk dari server.'
      );


      bersihkanCallback(
        callbackName
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =========================================================
   CLEAN CALLBACK
========================================================= */

function bersihkanCallback(
  callbackName
) {

  const script =
    document.getElementById(
      callbackName
    );


  if (script) {

    script.remove();

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch(error) {}

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  if (scannerStarting) {
    return;
  }


  if (currentStream) {
    return;
  }


  scannerStarting = true;


  try {

    aktifkanAudio();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );

    }


    document
      .getElementById(
        'startButton'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'stopButton'
      )
      .style.display =
        'block';


    const reader =
      document.getElementById(
        'reader'
      );


    reader.innerHTML = '';


    const video =
      document.createElement(
        'video'
      );


    video.autoplay = true;

    video.muted = true;

    video.playsInline = true;

    video.setAttribute(
      'playsinline',
      ''
    );


    reader.appendChild(
      video
    );


    /* -----------------------------------------------------
       SCAN BOX
    ----------------------------------------------------- */

    const scanBox =
      document.createElement(
        'div'
      );


    scanBox.className =
      'scan-box';


    reader.appendChild(
      scanBox
    );


    const cornerClasses = [
      'corner-tl',
      'corner-tr',
      'corner-bl',
      'corner-br'
    ];


    cornerClasses.forEach(
      function(className) {

        const corner =
          document.createElement(
            'div'
          );


        corner.className =
          'scan-corner ' +
          className;


        reader.appendChild(
          corner
        );

      }
    );


    const scanLine =
      document.createElement(
        'div'
      );


    scanLine.className =
      'scan-line';


    reader.appendChild(
      scanLine
    );


    const hint =
      document.createElement(
        'div'
      );


    hint.className =
      'scan-hint';


    hint.innerText =
      'Arahkan barcode ke dalam kotak';


    reader.appendChild(
      hint
    );


    const autoZoomStatus =
      document.createElement(
        'div'
      );


    autoZoomStatus.className =
      'auto-zoom-status';


    autoZoomStatus.id =
      'autoZoomStatus';


    autoZoomStatus.innerText =
      '🔍 Auto Zoom';


    reader.appendChild(
      autoZoomStatus
    );


    /* -----------------------------------------------------
       ZXING
    ----------------------------------------------------- */

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /*
     * Prioritas kamera belakang.
     */

    let deviceId =
      devices[
        devices.length - 1
      ].deviceId;


    for (
      const device of devices
    ) {

      const label =
        String(
          device.label || ''
        )
        .toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('belakang')
      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    /* -----------------------------------------------------
       GET USER MEDIA
    ----------------------------------------------------- */

    currentStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {
              exact:
                deviceId
            },

            facingMode: {
              ideal:
                'environment'
            },

            width: {
              ideal:
                1920
            },

            height: {
              ideal:
                1080
            },

            frameRate: {
              ideal:
                30,
              max:
                60
            }

          },

          audio:
            false

        });


    video.srcObject =
      currentStream;


    await video.play();


    /* -----------------------------------------------------
       FOCUS CONTINUOUS
    ----------------------------------------------------- */

    const track =
      currentStream
        .getVideoTracks()[0];


    if (
      track &&
      track.getCapabilities
    ) {

      const capabilities =
        track.getCapabilities();


      try {

        const advanced = {};


        if (
          capabilities.focusMode &&
          capabilities.focusMode
            .includes('continuous')
        ) {

          advanced.focusMode =
            'continuous';

        }


        if (
          Object.keys(
            advanced
          ).length > 0
        ) {

          await track.applyConstraints({

            advanced: [
              advanced
            ]

          });

        }

      }

      catch(error) {

        console.log(
          'Continuous focus tidak tersedia:',
          error
        );

      }

    }


    setupZoom();


    document
      .getElementById(
        'status'
      )
      .innerText =
        '📷 Scanner aktif — arahkan barcode';


    /* -----------------------------------------------------
       START ZXING
    ----------------------------------------------------- */

    scannerControls =
      await codeReader
        .decodeFromStream(

          currentStream,

          video,

          function(
            result,
            error
          ) {

            /*
             * BELUM TERBACA
             */

            if (!result) {

              jalankanAutoZoom();

              return;

            }


            const barcode =
              String(
                result.getText()
              )
              .trim()
              .toUpperCase();


            if (!barcode) {

              return;

            }


            const now =
              Date.now();


            /*
             * Barcode sama dalam 1.5 detik
             * tidak diproses ulang.
             *
             * Setelah itu barcode yang sama
             * tetap bisa discan lagi.
             */

            if (
              barcode ===
              lastBarcode &&
              now -
              lastScanTime <
              1500
            ) {

              return;

            }


            lastBarcode =
              barcode;


            lastScanTime =
              now;


            /*
             * STOP AUTO ZOOM SEMENTARA.
             *
             * Scanner TIDAK dihentikan.
             */

            hentikanAutoZoom();


            document
              .getElementById(
                'searchInput'
              )
              .value =
                barcode;


            bunyiBerhasil();

            getarBerhasil();


            searchBarcode(
              barcode
            );

          }

        );

  }

  catch(error) {

    console.error(
      'KAMERA ERROR:',
      error
    );


    tampilkanError(

      'Kamera tidak dapat digunakan.' +
      '<br><br>' +
      aman(
        error.message ||
        error.name ||
        ''
      )

    );


    stopScanner();

  }

  finally {

    scannerStarting =
      false;

  }

}


/* =========================================================
   AUDIO
========================================================= */

function aktifkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {}

}


function getarBerhasil() {

  try {

    if (
      'vibrate' in navigator
    ) {

      navigator.vibrate(
        70
      );

    }

  }

  catch(error) {}

}


function getarTidakDitemukan() {

  try {

    if (
      'vibrate' in navigator
    ) {

      navigator.vibrate(
        [70,60,70]
      );

    }

  }

  catch(error) {}

}


function bunyiBerhasil() {

  try {

    aktifkanAudio();


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.setValueAtTime(
      1450,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.5,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + 0.18
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.19
    );

  }

  catch(error) {}

}


function bunyiTidakDitemukan() {

  try {

    aktifkanAudio();


    if (!audioContext) {
      return;
    }


    bunyiNada(
      600,
      0
    );


    setTimeout(
      function() {

        bunyiNada(
          400,
          130
        );

      },
      130
    );

  }

  catch(error) {}

}


function bunyiNada(
  frequency,
  delay
) {

  setTimeout(
    function() {

      try {

        const oscillator =
          audioContext
            .createOscillator();


        const gain =
          audioContext
            .createGain();


        oscillator.type =
          'sine';


        oscillator.frequency.setValueAtTime(
          frequency,
          audioContext.currentTime
        );


        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.3,
          audioContext.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + 0.11
        );


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          0.12
        );

      }

      catch(error) {}

    },
    delay
  );

}


/* =========================================================
   ZOOM SETUP
========================================================= */

function setupZoom() {

  const control =
    document.getElementById(
      'zoomControl'
    );


  const slider =
    document.getElementById(
      'zoomSlider'
    );


  if (!currentStream) {

    control.style.display =
      'none';

    return;

  }


  const tracks =
    currentStream
      .getVideoTracks();


  if (
    !tracks ||
    tracks.length === 0
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomTrack =
    tracks[0];


  if (
    !zoomTrack.getCapabilities
  ) {

    control.style.display =
      'none';

    return;

  }


  const capabilities =
    zoomTrack.getCapabilities();


  if (
    !capabilities.zoom
  ) {

    control.style.display =
      'none';

    return;

  }


  zoomMin =
    Number(
      capabilities.zoom.min || 1
    );


  zoomMax =
    Number(
      capabilities.zoom.max || 3
    );


  zoomStep =
    Number(
      capabilities.zoom.step || 0.1
    );


  zoomMax =
    Math.min(
      zoomMax,
      3
    );


  slider.min =
    zoomMin;


  slider.max =
    zoomMax;


  slider.step =
    zoomStep;


  zoomCurrent =
    Math.max(
      zoomMin,
      1
    );


  if (
    zoomCurrent >
    zoomMax
  ) {

    zoomCurrent =
      zoomMax;

  }


  slider.value =
    zoomCurrent;


  autoZoomLevel =
    zoomCurrent;


  control.style.display =
    'block';


  updateZoomDisplay();


  applyZoom();

}


/* =========================================================
   MANUAL ZOOM
========================================================= */

document
  .getElementById(
    'zoomSlider'
  )
  .addEventListener(
    'input',
    function() {

      if (!zoomTrack) {
        return;
      }


      hentikanAutoZoom();


      zoomCurrent =
        Number(
          this.value
        );


      zoomCurrent =
        roundZoom(
          zoomCurrent
        );


      autoZoomLevel =
        zoomCurrent;


      applyZoom();

    }
  );


function applyZoom() {

  if (!zoomTrack) {
    return;
  }


  try {

    zoomTrack.applyConstraints({

      advanced: [

        {

          zoom:
            zoomCurrent

        }

      ]

    });


    updateZoomDisplay();

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

  }

}


/* =========================================================
   AUTO ZOOM
========================================================= */

function jalankanAutoZoom() {

  if (!zoomTrack) {
    return;
  }


  if (
    zoomMax <= zoomMin
  ) {

    return;

  }


  if (autoZoomTimer) {
    return;
  }


  autoZoomTimer =
    setTimeout(
      function() {

        autoZoomTimer =
          null;


        if (
          !zoomTrack ||
          !currentStream
        ) {

          return;

        }


        /*
         * Naik bertahap:
         *
         * 1.0
         * 1.6
         * 2.2
         * 2.8
         * 3.0
         */

        if (
          autoZoomLevel <
          zoomMax
        ) {

          autoZoomLevel +=
            AUTO_ZOOM_STEP;


          if (
            autoZoomLevel >
            zoomMax
          ) {

            autoZoomLevel =
              zoomMax;

          }


          zoomCurrent =
            roundZoom(
              autoZoomLevel
            );


          const slider =
            document.getElementById(
              'zoomSlider'
            );


          if (slider) {

            slider.value =
              zoomCurrent;

          }


          applyZoom();


          tampilkanAutoZoom();

        }

      },
      AUTO_ZOOM_DELAY
    );

}


function resetAutoZoom() {

  autoZoomLevel =
    Math.max(
      zoomMin,
      1
    );

}


function hentikanAutoZoom() {

  if (autoZoomTimer) {

    clearTimeout(
      autoZoomTimer
    );


    autoZoomTimer =
      null;

  }


  resetAutoZoom();

  sembunyikanAutoZoom();

}


function tampilkanAutoZoom() {

  const element =
    document.getElementById(
      'autoZoomStatus'
    );


  if (!element) {
    return;
  }


  element.style.display =
    'block';


  element.innerText =
    '🔍 Auto Zoom ' +
    Number(
      zoomCurrent
    ).toFixed(1) +
    '×';


  setTimeout(
    function() {

      sembunyikanAutoZoom();

    },
    700
  );

}


function sembunyikanAutoZoom() {

  const element =
    document.getElementById(
      'autoZoomStatus'
    );


  if (element) {

    element.style.display =
      'none';

  }

}


function updateZoomDisplay() {

  const element =
    document.getElementById(
      'zoomValue'
    );


  if (!element) {
    return;
  }


  element.innerText =
    Number(
      zoomCurrent
    ).toFixed(1) +
    '×';

}


function roundZoom(
  value
) {

  return Math.round(
    value * 10
  ) / 10;

}


/* =========================================================
   STOP SCANNER
========================================================= */

function stopScanner() {

  hentikanAutoZoom();


  try {

    if (scannerControls) {

      scannerControls.stop();

    }

  }

  catch(error) {}


  scannerControls =
    null;


  try {

    if (codeReader) {

      codeReader.reset();

    }

  }

  catch(error) {}


  codeReader =
    null;


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  currentStream =
    null;


  zoomTrack =
    null;


  scannerStarting =
    false;


  document
    .getElementById(
      'zoomControl'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'stopButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'startButton'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'reader'
    )
    .innerHTML =

      '<div class="camera-message">' +
        'Tekan MULAI SCAN untuk membuka kamera' +
      '</div>';

}


/* =========================================================
   SEARCH PRODUCT
========================================================= */

function searchProduct() {

  const input =
    document.getElementById(
      'searchInput'
    );


  const keyword =
    String(
      input.value || ''
    )
    .trim()
    .toUpperCase();


  input.value =
    keyword;


  if (!keyword) {

    tampilkanError(
      'Masukkan barcode, nama produk, atau Kode Accurate.'
    );

    return;

  }


  /* -------------------------------------------------------
     1. BARCODE EXACT
  ------------------------------------------------------- */

  const exactBarcode =
    products.find(
      function(product) {

        return normalisasi(
          product.barcode
        ) === keyword;

      }
    );


  if (exactBarcode) {

    searchBarcode(
      exactBarcode.barcode
    );

    return;

  }


  /* -------------------------------------------------------
     2. KODE ACCURATE EXACT
     
     INI PENTING UNTUK PRODUK TANPA BARCODE.
  ------------------------------------------------------- */

  const exactKode =
    products.find(
      function(product) {

        return normalisasi(
          product.kodeAccurate
        ) === keyword;

      }
    );


  if (exactKode) {

    searchKodeAccurate(
      exactKode.kodeAccurate
    );

    return;

  }


  /* -------------------------------------------------------
     3. NAMA PRODUK
  ------------------------------------------------------- */

  const hasil =
    products.filter(
      function(product) {

        const name =
          String(
            product.name || ''
          )
          .toUpperCase();


        return name.includes(
          keyword
        );

      }
    );


  if (
    hasil.length === 0
  ) {

    /*
     * Kalau tidak ditemukan di MASTER,
     * coba langsung anggap input sebagai
     * Kode Accurate.
     */

    searchKodeAccurate(
      keyword
    );

    return;

  }


  if (
    hasil.length === 1
  ) {

    /*
     * Produk satu-satunya.
     *
     * Kalau punya barcode:
     * gunakan barcode.
     *
     * Kalau tidak punya barcode:
     * gunakan Kode Accurate.
     */

    if (
      normalisasi(
        hasil[0].barcode
      )
    ) {

      searchBarcode(
        hasil[0].barcode
      );

    }

    else if (
      normalisasi(
        hasil[0].kodeAccurate
      )
    ) {

      searchKodeAccurate(
        hasil[0].kodeAccurate
      );

    }

    else {

      tampilkanError(
        'Produk ditemukan tetapi belum memiliki Kode Accurate.'
      );

    }


    return;

  }


  tampilkanDaftar(
    hasil
  );

}


/* =========================================================
   SEARCH BARCODE
========================================================= */

function searchBarcode(
  barcode
) {

  barcode =
    normalisasi(
      barcode
    );


  if (!barcode) {
    return;
  }


  tampilkanLoading(
    '⏳ Mengecek harga & stok...'
  );


  const callbackName =
    'stokCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        console.log(
          'RESPONSE STOK:',
          response
        );


        if (
          !response ||
          response.success !== true
        ) {

          bunyiTidakDitemukan();

          getarTidakDitemukan();


          tampilkanError(
            aman(
              response &&
              response.error
                ?
                response.error
                :
                'Data produk tidak ditemukan.'
            )
          );


          setStatus(
            '❌ Data tidak ditemukan'
          );


          return;

        }


        if (
          !response.data
        ) {

          tampilkanError(
            'Data produk kosong.'
          );

          return;

        }


        tampilkanProdukDenganStok(
          response.data
        );


        setStatus(
          '✓ Produk ditemukan'
        );

      }

      catch(error) {

        console.error(
          error
        );


        tampilkanError(
          'Terjadi kesalahan membaca data server.'
        );

      }


      bersihkanCallback(
        callbackName
      );

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?aksi=stok' +
    '&barcode=' +
    encodeURIComponent(
      barcode
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      tampilkanError(
        '❌ Tidak dapat terhubung ke server Apps Script.'
      );


      setStatus(
        '❌ Gagal terhubung ke server'
      );


      bersihkanCallback(
        callbackName
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =========================================================
   SEARCH KODE ACCURATE
 *
 * Untuk produk tanpa barcode.
========================================================= */

function searchKodeAccurate(
  kode
) {

  kode =
    normalisasi(
      kode
    );


  if (!kode) {

    tampilkanError(
      'Kode Accurate kosong.'
    );

    return;

  }


  tampilkanLoading(
    '⏳ Mengecek stok Accurate...'
  );


  const callbackName =
    'stokKodeCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        console.log(
          'RESPONSE STOK KODE:',
          response
        );


        if (
          !response ||
          response.success !== true
        ) {

          bunyiTidakDitemukan();

          getarTidakDitemukan();


          tampilkanError(
            aman(
              response &&
              response.error
                ?
                response.error
                :
                'Kode Accurate tidak ditemukan.'
            )
          );


          setStatus(
            '❌ Produk tidak ditemukan'
          );


          return;

        }


        if (
          !response.data
        ) {

          tampilkanError(
            'Data produk kosong.'
          );

          return;

        }


        tampilkanProdukDenganStok(
          response.data
        );


        setStatus(
          '✓ Produk ditemukan'
        );

      }

      catch(error) {

        console.error(
          error
        );


        tampilkanError(
          'Terjadi kesalahan membaca data server.'
        );

      }


      bersihkanCallback(
        callbackName
      );

    };


  const script =
    document.createElement(
      'script'
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?aksi=stokKode' +
    '&kode=' +
    encodeURIComponent(
      kode
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      tampilkanError(
        '❌ Tidak dapat terhubung ke server Apps Script.'
      );


      setStatus(
        '❌ Gagal terhubung ke server'
      );


      bersihkanCallback(
        callbackName
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =========================================================
   TAMPILKAN PRODUK
========================================================= */

function tampilkanProdukDenganStok(
  data
) {

  const stok =
    Number(
      data.stok || 0
    );


  const stokClass =
    stok > 0
      ?
      'stok-aman'
      :
      'stok-habis';


  const stokText =
    stok > 0
      ?
      stok +
      ' ' +
      (
        data.satuan ||
        'PCS'
      )
      :
      'HABIS';


  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="product-card">' +

        '<div class="product-name">' +
          aman(
            data.nama || ''
          ) +
        '</div>' +

        (
          data.barcode
            ?
            '<div class="product-barcode">' +
              'Barcode: ' +
              aman(
                data.barcode
              ) +
            '</div>'
            :
            '<div class="product-barcode">' +
              'Produk tanpa barcode' +
            '</div>'
        ) +

        '<div class="price">' +
          'Rp ' +
          aman(
            data.harga || '-'
          ) +
        '</div>' +

        '<div class="stock-box ' +
          stokClass +
        '">' +

          '<div class="stock-label">' +
            'STOK TERSEDIA' +
          '</div>' +

          '<div class="stock-number">' +
            aman(
              stokText
            ) +
          '</div>' +

        '</div>' +

        '<div class="accurate-code">' +
          'Kode Accurate: ' +
          aman(
            data.kodeAccurate || '-'
          ) +
        '</div>' +

      '</div>';

}


/* =========================================================
   MULTIPLE RESULT
========================================================= */

function tampilkanDaftar(
  hasil
) {

  hasilPencarian =
    hasil;


  let html =
    '<div class="result-count">' +
      '🔎 Ditemukan ' +
      hasil.length +
      ' produk' +
    '</div>';


  hasil.forEach(
    function(
      product,
      index
    ) {

      html +=

        '<div class="result-item" ' +
          'onclick="pilihProduk(' +
          index +
          ')">' +

          '<div class="result-item-name">' +
            aman(
              product.name
            ) +
          '</div>' +

          (
            product.barcode
              ?
              '<div class="result-item-barcode">' +
                'Barcode: ' +
                aman(
                  product.barcode
                ) +
              '</div>'
              :
              '<div class="result-item-barcode">' +
                'Tanpa barcode' +
              '</div>'
          ) +

          '<div class="result-item-code">' +
            'Kode Accurate: ' +
            aman(
              product.kodeAccurate ||
              '-'
            ) +
          '</div>' +

          '<div class="result-item-price">' +
            'Rp ' +
            aman(
              product.price ||
              '-'
            ) +
          '</div>' +

        '</div>';

    }
  );


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      html;

}


/* =========================================================
   PILIH PRODUK
========================================================= */

function pilihProduk(
  index
) {

  const product =
    hasilPencarian[
      index
    ];


  if (!product) {
    return;
  }


  /*
   * Kalau ada barcode,
   * gunakan barcode.
   */

  if (
    normalisasi(
      product.barcode
    )
  ) {

    document
      .getElementById(
        'searchInput'
      )
      .value =
        normalisasi(
          product.barcode
        );


    searchBarcode(
      product.barcode
    );


    return;

  }


  /*
   * Kalau tidak ada barcode,
   * gunakan Kode Accurate.
   */

  if (
    normalisasi(
      product.kodeAccurate
    )
  ) {

    document
      .getElementById(
        'searchInput'
      )
      .value =
        normalisasi(
          product.kodeAccurate
        );


    searchKodeAccurate(
      product.kodeAccurate
    );


    return;

  }


  tampilkanError(
    'Produk ini belum memiliki barcode maupun Kode Accurate.'
  );

}


/* =========================================================
   LOADING
========================================================= */

function tampilkanLoading(
  message
) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="loading">' +
        message +
      '</div>';

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text
) {

  document
    .getElementById(
      'status'
    )
    .innerText =
      text;

}


/* =========================================================
   CLEAR
========================================================= */

function clearSearch() {

  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'result'
    )
    .innerHTML =
      '';


  setStatus(
    products.length +
    ' produk siap digunakan'
  );

}


/* =========================================================
   ERROR
========================================================= */

function tampilkanError(
  message
) {

  document
    .getElementById(
      'result'
    )
    .innerHTML =

      '<div class="error">' +
        message +
      '</div>';

}


/* =========================================================
   SAFE HTML
========================================================= */

function aman(
  text
) {

  return String(
    text
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =========================================================
   NORMALISASI
========================================================= */

function normalisasi(
  value
) {

  return String(
    value || ''
  )
  .trim()
  .toUpperCase();

}


/* =========================================================
   INPUT CAPITAL
========================================================= */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key ===
        'Enter'
      ) {

        searchProduct();

      }

    }
  );


/* =========================================================
   LOAD
========================================================= */

loadProducts();

</script>
