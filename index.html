<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">

<meta

  <title>Cek Harga & Stok — Sentral Makmur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f5f5,
          #ffffff
        );

      color: #222;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 80px;
      height: 80px;

      margin: 0 auto 14px;

      border-radius: 20px;

      background: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 26px;
      font-weight: 800;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);
    }

    .header h1 {
      margin: 0;

      font-size: 26px;
      font-weight: 800;
    }

    .header p {
      margin: 7px 0 0;

      color: #777;

      font-size: 14px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      background: white;

      border-radius: 18px;

      padding: 14px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);

      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 9px;
    }

    .search-input {
      flex: 1;

      min-width: 0;

      border: 2px solid #e5e5e5;

      border-radius: 13px;

      padding:
        14px 15px;

      font-size: 16px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .search-input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 3px
        rgba(0,0,0,.06);
    }

    .search-button {
      border: none;

      border-radius: 13px;

      padding:
        0 20px;

      background: #111;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    .search-button:hover {
      opacity: .9;
    }

    .search-button:active {
      transform: scale(.97);
    }

    .search-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .reset-button {
      width: 100%;

      margin-top: 9px;

      border: none;

      background: #f1f1f1;

      color: #555;

      border-radius: 11px;

      padding: 10px;

      font-size: 13px;

      cursor: pointer;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      text-align: center;

      padding: 16px;

      color: #777;

      font-size: 14px;

      display: none;
    }

    .loading {
      display: block;
    }

    .error {
      display: block;

      background: #fff1f1;

      color: #c62828;

      border-radius: 13px;

      margin-bottom: 15px;
    }

    /* =========================
       RESULT
    ========================= */

    .results {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .product-card {
      background: white;

      border-radius: 17px;

      padding: 18px;

      box-shadow:
        0 7px 25px
        rgba(0,0,0,.07);

      animation:
        fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform:
          translateY(5px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    .product-name {
      font-size: 17px;

      font-weight: 800;

      line-height: 1.4;

      margin-bottom: 8px;
    }

    .product-code {
      color: #888;

      font-size: 12px;

      margin-bottom: 16px;
    }

    .product-info {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }

    .info-box {
      background: #f7f7f7;

      border-radius: 12px;

      padding: 12px 9px;

      text-align: center;
    }

    .info-label {
      display: block;

      color: #888;

      font-size: 11px;

      margin-bottom: 5px;
    }

    .info-value {
      display: block;

      font-size: 15px;

      font-weight: 800;
    }

    .price {
      color: #111;
    }

    .stock {
      color: #16803c;
    }

    .stock.empty {
      color: #c62828;
    }

    .stock.zero {
      color: #c62828;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;

      border-radius: 17px;

      padding: 30px 20px;

      text-align: center;

      box-shadow:
        0 7px 25px
        rgba(0,0,0,.06);

      color: #777;
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 10px;
    }

    .empty-title {
      color: #333;

      font-weight: 700;

      margin-bottom: 5px;
    }

    .empty-text {
      font-size: 13px;

      line-height: 1.5;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      margin-top: 35px;

      color: #aaa;

      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (
      max-width: 480px
    ) {

      .container {
        padding:
          20px 12px 40px;
      }

      .header h1 {
        font-size: 23px;
      }

      .search-row {
        gap: 7px;
      }

      .search-input {
        padding:
          13px 12px;

        font-size: 15px;
      }

      .search-button {
        padding:
          0 16px;

        font-size: 14px;
      }

      .product-info {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .info-value {
        font-size: 14px;
      }
    }
  </style>

</head>

  </div>

  <script>

    /*
    =====================================================
    KONFIGURASI API
    =====================================================
    */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


    /*
    =====================================================
    ELEMENT
    =====================================================
    */

    const searchInput =
      document.getElementById(
        'searchInput'
      );

    const searchButton =
      document.getElementById(
        'searchButton'
      );

    const results =
      document.getElementById(
        'results'
      );

    const status =
      document.getElementById(
        'status'
      );


    /*
    =====================================================
    ENTER UNTUK CARI
    =====================================================
    */

    searchInput.addEventListener(
      'keydown',
      function(event) {

        if (
          event.key === 'Enter'
        ) {

          event.preventDefault();

          cariProduk();

        }

      }
    );


    /*
    =====================================================
    CARI PRODUK
    =====================================================
    */

    async function cariProduk() {

      const keyword =
        searchInput.value
          .trim();


      if (!keyword) {

        tampilkanPesan(
          'Masukkan nama, kode, atau barcode produk.',
          true
        );

        searchInput.focus();

        return;

      }


      if (
        !API_URL ||
        API_URL.includes(
          'GANTI_DENGAN'
        )
      ) {

        tampilkanPesan(
          'URL Web App Apps Script belum dipasang di index.html.',
          true
        );

        return;

      }


      setLoading(
        true
      );


      results.innerHTML =
        '';


      try {

        const url =
          API_URL +
          '?aksi=cari&keyword=' +
          encodeURIComponent(
            keyword
          ) +
          '&callback=handleSearch';


        await requestJSONP(
          url
        );

      }

      catch (error) {

        console.error(
          error
        );

        setLoading(
          false
        );

        tampilkanPesan(
          'Gagal terhubung ke server. Coba lagi.',
          true
        );

      }

    }


    /*
    =====================================================
    JSONP
    =====================================================
    */

    function requestJSONP(
      url
    ) {

      return new Promise(
        function(
          resolve,
          reject
        ) {

          const callbackName =
            'jsonp_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 100000
            );


          const script =
            document.createElement(
              'script'
            );


          let selesai =
            false;


          const timeout =
            setTimeout(
              function() {

                if (
                  selesai
                ) {
                  return;
                }

                selesai = true;

                cleanup();

                reject(
                  new Error(
                    'Request timeout'
                  )
                );

              },
              15000
            );


          window[
            callbackName
          ] =
            function(data) {

              if (
                selesai
              ) {
                return;
              }

              selesai = true;

              clearTimeout(
                timeout
              );

              cleanup();

              handleSearch(
                data
              );

              resolve(
                data
              );

            };


          function cleanup() {

            try {

              delete window[
                callbackName
              ];

            }

            catch (error) {

              window[
                callbackName
              ] =
                undefined;

            }


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }

          }


          script.src =
            url +
            '&callback=' +
            callbackName;


          script.onerror =
            function() {

              if (
                selesai
              ) {
                return;
              }

              selesai = true;

              clearTimeout(
                timeout
              );

              cleanup();

              reject(
                new Error(
                  'Network error'
                )
              );

            };


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }


    /*
    =====================================================
    HANDLE RESPONSE
    =====================================================
    */

    function handleSearch(
      response
    ) {

      setLoading(
        false
      );


      if (
        !response
      ) {

        tampilkanPesan(
          'Server tidak memberikan response.',
          true
        );

        return;

      }


      if (
        response.success !== true
      ) {

        tampilkanPesan(
          response.error ||
          'Produk tidak ditemukan.',
          true
        );

        return;

      }


      const data =
        Array.isArray(
          response.data
        )
          ? response.data
          : [];


      if (
        data.length === 0
      ) {

        tampilkanKosong();

        return;

      }


      tampilkanProduk(
        data
      );

    }


    /*
    =====================================================
    TAMPILKAN PRODUK
    =====================================================
    */

    function tampilkanProduk(
      products
    ) {

      results.innerHTML =
        '';


      products.forEach(
        function(product) {

          const card =
            document.createElement(
              'div'
            );


          card.className =
            'product-card';


          const nama =
            product.nama ||
            product.name ||
            'Produk tanpa nama';


          const kode =
            product.kodeAccurate ||
            product.no ||
            '-';


          const barcode =
            product.barcode ||
            '-';


          const harga =
            product.harga ||
            product.price ||
            '-';


          const stok =
            product.stok ??
            product.stock ??
            0;


          const satuan =
            product.satuan ||
            'PCS';


          let stockClass =
            'stock';


          if (
            Number(stok) <= 0
          ) {

            stockClass +=
              ' zero';

          }


          card.innerHTML = `

            <div class="product-name">
              ${escapeHTML(nama)}
            </div>

            <div class="product-code">
              Kode:
              ${escapeHTML(kode)}
              &nbsp; • &nbsp;
              Barcode:
              ${escapeHTML(barcode)}
            </div>

            <div class="product-info">

              <div class="info-box">

                <span class="info-label">
                  HARGA
                </span>

                <span
                  class="info-value price"
                >
                  Rp ${escapeHTML(
                    String(harga)
                  )}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  STOK
                </span>

                <span
                  class="info-value ${stockClass}"
                >
                  ${escapeHTML(
                    String(stok)
                  )}
                </span>

              </div>


              <div class="info-box">

                <span class="info-label">
                  SATUAN
                </span>

                <span
                  class="info-value"
                >
                  ${escapeHTML(
                    String(satuan)
                  )}
                </span>

              </div>

            </div>

          `;


          results.appendChild(
            card
          );

        }
      );


      if (
        products.length >= 50
      ) {

        const info =
          document.createElement(
            'div'
          );


        info.style.textAlign =
          'center';

        info.style.color =
          '#999';

        info.style.fontSize =
          '12px';

        info.style.padding =
          '8px';


        info.textContent =
          'Menampilkan maksimal 50 hasil.';


        results.appendChild(
          info
        );

      }

    }


    /*
    =====================================================
    PESAN KOSONG
    =====================================================
    */

    function tampilkanKosong() {

      results.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            📦
          </div>

          <div class="empty-title">
            Produk tidak ditemukan
          </div>

          <div class="empty-text">
            Coba gunakan nama produk,
            kode Accurate, atau barcode
            yang berbeda.
          </div>

        </div>

      `;

    }


    /*
    =====================================================
    PESAN
    =====================================================
    */

    function tampilkanPesan(
      message,
      error
    ) {

      status.textContent =
        message;

      status.className =
        'status' +
        (
          error
            ? ' error'
            : ''
        );

      status.style.display =
        'block';

    }


    /*
    =====================================================
    LOADING
    =====================================================
    */

    function setLoading(
      loading
    ) {

      if (
        loading
      ) {

        status.textContent =
          'Mencari produk...';

        status.className =
          'status loading';

        status.style.display =
          'block';

        searchButton.disabled =
          true;

        searchButton.textContent =
          '...';

      }

      else {

        status.style.display =
          'none';

        searchButton.disabled =
          false;

        searchButton.textContent =
          'Cari';

      }

    }


    /*
    =====================================================
    RESET
    =====================================================
    */

    function resetPencarian() {

      searchInput.value =
        '';

      results.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔎
          </div>

          <div class="empty-title">
            Cari produk
          </div>

          <div class="empty-text">
            Ketik nama barang, kode Accurate,
            atau barcode untuk melihat
            harga dan stok.
          </div>

        </div>

      `;

      status.style.display =
        'none';

      searchInput.focus();

    }


    /*
    =====================================================
    ESCAPE HTML
    =====================================================
    */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ''
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>
