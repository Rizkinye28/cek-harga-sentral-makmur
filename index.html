<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sentral Makmur - Cek Harga & Stok</title>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #151515;
}

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
}

header {
  text-align: center;
  padding: 42px 0 30px;
}

.logo {
  width: 105px;
  height: 105px;
  margin: 0 auto 22px;
  border-radius: 30px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 800;
  box-shadow: 0 12px 30px rgba(0,0,0,.12);
}

h1 {
  margin: 0;
  font-size: 36px;
}

.subtitle {
  margin-top: 8px;
  color: #777;
  font-size: 18px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input-wrap {
  flex: 1;
  position: relative;
}

input {
  width: 100%;
  height: 58px;
  padding: 0 48px 0 18px;
  border: 2px solid #ddd;
  border-radius: 16px;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #111;
}

.clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 25px;
  color: #777;
  cursor: pointer;
  display: none;
  padding: 0;
}

button {
  border: none;
  border-radius: 16px;
  padding: 0 25px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-gray {
  background: #eee;
  color: #555;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-row button {
  height: 52px;
  flex: 1;
}


/* =====================================================
   CAMERA
===================================================== */

.scanner-card {
  margin-top: 18px;
  background: #111;
  border-radius: 24px;
  padding: 16px;
  display: none;
}

.scanner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  margin-bottom: 12px;
}

.scanner-title {
  font-size: 17px;
  font-weight: 700;
}

.close-camera {
  background: #333;
  color: white;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.video-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
}

video {
  width: 100%;
  display: block;
  min-height: 250px;
  max-height: 500px;
  object-fit: cover;
  background: #000;
}

.scan-box {
  position: absolute;
  width: 75%;
  height: 32%;
  left: 12.5%;
  top: 34%;
  border: 2px solid white;
  border-radius: 12px;
  pointer-events: none;
}

.scan-line {
  position: absolute;
  left: 13%;
  right: 13%;
  top: 50%;
  height: 2px;
  background: white;
  opacity: .85;
  pointer-events: none;
}

.camera-status {
  color: #ccc;
  text-align: center;
  font-size: 14px;
  padding: 10px 5px 2px;
}

.zoom-control {
  margin-top: 12px;
  color: white;
}

.zoom-control input {
  height: auto;
  padding: 0;
  margin-top: 7px;
}


/* =====================================================
   RESULT
===================================================== */

.result-card {
  margin-top: 18px;
  background: white;
  border-radius: 24px;
  padding: 30px;
  min-height: 220px;
  box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.empty {
  text-align: center;
  color: #777;
  padding: 35px 10px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-title {
  font-size: 22px;
  font-weight: 700;
  color: #333;
  margin-bottom: 8px;
}

.product {
  display: none;
}

.product-name {
  font-size: 27px;
  font-weight: 800;
  margin-bottom: 20px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.info {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 16px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 6px;
}

.value {
  font-size: 19px;
  font-weight: 700;
  word-break: break-word;
}

.price-box {
  background: #f5f5f5;
}

.price-value {
  font-size: 27px;
}

.stock {
  background: #111;
  color: white;
}

.stock .label {
  color: #bbb;
}

.stock .value {
  font-size: 26px;
}

.search-results {
  display: none;
  margin-top: 15px;
}

.result-item {
  background: white;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 9px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.result-item:hover {
  background: #f0f0f0;
}

.result-item-name {
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 7px;
}

.result-item-price {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 6px;
}

.result-item-code {
  color: #777;
  font-size: 13px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
  font-weight: 600;
}

.warning {
  margin-top: 15px;
  background: #fff4d6;
  color: #755b00;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 40px 0;
  color: #aaa;
  font-size: 14px;
}


@media(max-width:600px) {

  header {
    padding-top: 25px;
  }

  h1 {
    font-size: 28px;
  }

  .logo {
    width: 85px;
    height: 85px;
    font-size: 32px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    height: 54px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .result-card {
    padding: 22px;
  }

  .product-name {
    font-size: 22px;
  }

  .price-value {
    font-size: 25px;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <div class="logo">
    SM
  </div>

  <h1>
    Sentral Makmur
  </h1>

  <div class="subtitle">
    Cek Harga & Stok Produk
  </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-card">

  <div class="search-row">

    <div class="search-input-wrap">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>

    <button
      id="searchBtn"
      class="btn-black"
      type="button"
    >
      Cari
    </button>

  </div>


  <div class="action-row">

    <button
      id="scanBtn"
      class="btn-black"
      type="button"
    >
      📷 Scan Barcode
    </button>

    <button
      id="resetBtn"
      class="btn-gray"
      type="button"
    >
      Reset
    </button>

  </div>

</section>


<!-- =====================================================
     CAMERA
===================================================== -->

<section
  id="scannerCard"
  class="scanner-card"
>

  <div class="scanner-header">

    <div class="scanner-title">
      📷 Kamera Belakang
    </div>

    <button
      id="closeCameraBtn"
      class="close-camera"
      type="button"
    >
      Tutup
    </button>

  </div>


  <div class="video-wrap">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="scan-box"></div>

    <div class="scan-line"></div>

  </div>


  <div
    id="cameraStatus"
    class="camera-status"
  >
    Arahkan barcode ke dalam kotak.
  </div>


  <div
    id="zoomControl"
    class="zoom-control"
  >

    Zoom

    <input
      id="zoomRange"
      type="range"
      min="1"
      max="1"
      step="0.1"
      value="1"
    >

  </div>

</section>


<!-- =====================================================
     SEARCH RESULTS
===================================================== -->

<div
  id="searchResults"
  class="search-results"
></div>


<!-- =====================================================
     RESULT
===================================================== -->

<section
  id="resultCard"
  class="result-card"
>

  <div
    id="emptyState"
    class="empty"
  >

    <div class="empty-icon">
      🔎
    </div>

    <div class="empty-title">
      Cari produk
    </div>

    <div>
      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

  </div>


  <div
    id="loading"
    class="loading"
    style="display:none;"
  >
    Mengambil data produk...
  </div>


  <div
    id="errorState"
    class="error"
    style="display:none;"
  ></div>


  <div
    id="product"
    class="product"
  >

    <div
      id="productName"
      class="product-name"
    ></div>


    <div class="info-grid">


      <div class="info">

        <div class="label">
          Barcode
        </div>

        <div
          id="productBarcode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Kode Accurate
        </div>

        <div
          id="productCode"
          class="value"
        ></div>

      </div>


      <div class="info price-box">

        <div class="label">
          Harga
        </div>

        <div
          id="productPrice"
          class="value price-value"
        ></div>

      </div>


      <div class="info stock">

        <div class="label">
          Stok
        </div>

        <div
          id="productStock"
          class="value"
        ></div>

      </div>

    </div>


    <div
      id="warningState"
      class="warning"
      style="display:none;"
    ></div>

  </div>

</section>


<footer>
  Sentral Makmur • Cek Harga & Stok
</footer>


</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const zoomRange =
  document.getElementById('zoomRange');

const cameraStatus =
  document.getElementById('cameraStatus');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');

const warningState =
  document.getElementById('warningState');


/* =====================================================
   SCANNER VARIABLES
===================================================== */

let codeReader = null;

let currentStream = null;

let currentTrack = null;

let scanning = false;

let scannerStarting = false;


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);


/* =====================================================
   INPUT
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display = 'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(
  'keydown',
  function(event) {

    if (event.key === 'Enter') {

      cari();

    }

  }
);


/* =====================================================
   CARI
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


async function cari() {

  const keyword =
    searchInput.value.trim();


  if (!keyword) {

    resetResult();

    return;

  }


  tutupScanner();

  tampilLoading();


  try {

    const url =
      API_URL +
      '?aksi=cari&keyword=' +
      encodeURIComponent(keyword);


    const response =
      await fetch(url, {
        cache: 'no-store'
      });


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const json =
      await response.json();


    if (!json.success) {

      tampilError(
        json.error ||
        'Gagal mencari produk.'
      );

      return;

    }


    if (
      !json.data ||
      json.data.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan.'
      );

      return;

    }


    /*
     * SATU PRODUK
     * langsung tampilkan harga + stok
     */

    if (json.data.length === 1) {

      await tampilProduk(
        json.data[0]
      );

      return;

    }


    /*
     * BANYAK PRODUK
     */

    tampilDaftarHasil(
      json.data
    );

  }


  catch(error) {

    console.error(error);

    tampilError(
      'Tidak dapat terhubung ke API.'
    );

  }

}


/* =====================================================
   DAFTAR HASIL PENCARIAN
===================================================== */

function tampilDaftarHasil(data) {

  emptyState.style.display = 'none';

  loading.style.display = 'none';

  errorState.style.display = 'none';

  product.style.display = 'none';

  searchResults.style.display = 'block';

  searchResults.innerHTML = '';


  data.forEach(function(item) {

    const div =
      document.createElement('div');


    div.className =
      'result-item';


    div.innerHTML =

      '<div class="result-item-name">' +

      escapeHtml(
        item.nama ||
        item.name ||
        '-'
      ) +

      '</div>' +

      '<div class="result-item-price">' +

      'Rp ' +

      escapeHtml(
        item.harga ||
        item.price ||
        '-'
      ) +

      '</div>' +

      '<div class="result-item-code">' +

      'Barcode: ' +

      escapeHtml(
        item.barcode ||
        '-'
      ) +

      ' • Kode: ' +

      escapeHtml(
        item.kodeAccurate ||
        '-'
      ) +

      '</div>';


    div.addEventListener(
      'click',
      function() {

        tampilProduk(item);

      }
    );


    searchResults.appendChild(div);

  });

}


/* =====================================================
   TAMPIL PRODUK
===================================================== */

async function tampilProduk(item) {

  searchResults.style.display = 'none';

  searchResults.innerHTML = '';

  emptyState.style.display = 'none';

  errorState.style.display = 'none';

  product.style.display = 'none';

  warningState.style.display = 'none';

  loading.style.display = 'block';


  try {

    const params =
      new URLSearchParams();


    params.set(
      'aksi',
      'stok'
    );


    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (item.kodeAccurate) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString(),
        {
          cache: 'no-store'
        }
      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const json =
      await response.json();


    /*
     * Jika backend mengembalikan
     * success false tetapi masih ada data,
     * kita tetap tampilkan produk.
     */

    if (
      !json.success &&
      !json.data
    ) {

      tampilError(
        json.error ||
        'Produk gagal diambil.'
      );

      return;

    }


    const data =
      json.data || item;


    /* =========================
       NAMA
    ========================= */

    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      data.name ||
      item.nama ||
      item.name ||
      '-';


    /* =========================
       BARCODE
    ========================= */

    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      item.barcode ||
      '-';


    /* =========================
       KODE
    ========================= */

    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      data.no ||
      item.kodeAccurate ||
      '-';


    /* =========================
       HARGA
    ========================= */

    const harga =
      data.harga ||
      data.price ||
      item.harga ||
      item.price ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      harga === '-' ||
      String(harga).startsWith('Rp')
        ? harga
        : 'Rp ' + harga;


    /* =========================
       STOK
    ========================= */

    const stok =
      data.stok ??
      data.stock;


    if (
      stok === null ||
      stok === undefined ||
      stok === ''
    ) {

      document.getElementById(
        'productStock'
      ).textContent =
        '-';

    }

    else {

      document.getElementById(
        'productStock'
      ).textContent =

        String(stok) +
        ' ' +
        (
          data.satuan ||
          'PCS'
        );

    }


    /* =========================
       WARNING
    ========================= */

    if (json.warning) {

      warningState.textContent =
        json.warning;

      warningState.style.display =
        'block';

    }


    loading.style.display = 'none';

    product.style.display = 'block';


    /*
     * Scroll ke hasil
     */

    setTimeout(function() {

      document.getElementById(
        'resultCard'
      ).scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

    }, 100);

  }


  catch(error) {

    console.error(error);

    /*
     * Kalau pencarian sudah menemukan
     * produk, harga tetap ditampilkan
     * walaupun Accurate sedang gagal.
     */

    document.getElementById(
      'productName'
    ).textContent =
      item.nama ||
      item.name ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      item.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      item.kodeAccurate ||
      item.no ||
      '-';


    const harga =
      item.harga ||
      item.price ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      harga === '-' ||
      String(harga).startsWith('Rp')
        ? harga
        : 'Rp ' + harga;


    document.getElementById(
      'productStock'
    ).textContent =
      '-';


    loading.style.display = 'none';

    product.style.display = 'block';

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display = 'none';

  errorState.style.display = 'none';

  product.style.display = 'none';

  searchResults.style.display = 'none';

  loading.style.display = 'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(message) {

  emptyState.style.display = 'none';

  loading.style.display = 'none';

  product.style.display = 'none';

  searchResults.style.display = 'none';

  warningState.style.display = 'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display = 'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display = 'block';

  loading.style.display = 'none';

  errorState.style.display = 'none';

  product.style.display = 'none';

  searchResults.style.display = 'none';

  searchResults.innerHTML = '';

  warningState.style.display = 'none';

}


/* =====================================================
   BUKA SCANNER
===================================================== */

scanBtn.addEventListener(
  'click',
  bukaScanner
);


async function bukaScanner() {

  if (scannerStarting) {
    return;
  }


  scannerStarting = true;


  scannerCard.style.display =
    'block';


  cameraStatus.textContent =
    'Membuka kamera belakang...';


  try {

    /*
     * Bersihkan scanner sebelumnya
     */

    tutupScanner();


    scannerCard.style.display =
      'block';


    /*
     * Buat ZXing
     */

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    /*
     * PENTING:
     *
     * Kita TIDAK lagi memilih devices[0].
     *
     * Kita paksa browser meminta
     * kamera belakang dengan:
     *
     * facingMode: environment
     */

    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    scanning = true;


    await codeReader.decodeFromConstraints(
      constraints,
      video,
      function(result, error) {

        if (
          result &&
          scanning
        ) {

          scanning = false;


          const barcode =
            result.getText();


          console.log(
            'BARCODE TERBACA:',
            barcode
          );


          /*
           * Masukkan barcode ke search
           */

          searchInput.value =
            barcode;


          clearBtn.style.display =
            'block';


          cameraStatus.textContent =
            'Barcode ditemukan: ' +
            barcode;


          /*
           * Tutup kamera
           */

          tutupScanner();


          /*
           * LANGSUNG CARI
           */

          cari();

        }

      }
    );


    /*
     * Ambil stream kamera
     */

    currentStream =
      video.srcObject;


    if (currentStream) {

      const tracks =
        currentStream.getVideoTracks();


      if (tracks.length) {

        currentTrack =
          tracks[0];


        aktifkanZoom(
          currentTrack
        );

      }

    }


    cameraStatus.textContent =
      'Kamera belakang aktif. Arahkan barcode ke kotak.';

  }


  catch(error) {

    console.error(
      'CAMERA ERROR:',
      error
    );


    scannerCard.style.display =
      'none';


    /*
     * Pesan error yang lebih jelas
     */

    let pesan =
      'Kamera tidak dapat digunakan. ';


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      pesan +=
        'Izin kamera ditolak. Izinkan akses kamera pada browser.';

    }

    else if (
      error &&
      error.name ===
      'NotFoundError'
    ) {

      pesan +=
        'Kamera tidak ditemukan.';

    }

    else if (
      error &&
      error.name ===
      'NotReadableError'
    ) {

      pesan +=
        'Kamera sedang digunakan aplikasi lain.';

    }

    else {

      pesan +=
        'Pastikan izin kamera sudah diberikan dan buka website melalui HTTPS.';

    }


    alert(pesan);

  }


  finally {

    scannerStarting = false;

  }

}


/* =====================================================
   ZOOM
===================================================== */

function aktifkanZoom(track) {

  try {

    const capabilities =
      track.getCapabilities();


    if (
      capabilities &&
      capabilities.zoom
    ) {

      const min =
        capabilities.zoom.min;

      const max =
        capabilities.zoom.max;

      const step =
        capabilities.zoom.step ||
        0.1;


      zoomRange.min =
        min;

      zoomRange.max =
        max;

      zoomRange.step =
        step;


      let autoZoom =
        Math.min(
          max,
          Math.max(
            min,
            2
          )
        );


      zoomRange.value =
        autoZoom;


      zoomRange.style.display =
        'block';


      track.applyConstraints({

        advanced: [

          {
            zoom:
              autoZoom
          }

        ]

      }).catch(function(error) {

        console.log(
          'Auto zoom gagal:',
          error
        );

      });

    }

    else {

      zoomRange.style.display =
        'none';

    }

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

    zoomRange.style.display =
      'none';

  }

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

zoomRange.addEventListener(
  'input',
  function() {

    if (!currentTrack) {
      return;
    }


    const value =
      Number(
        zoomRange.value
      );


    currentTrack
      .applyConstraints({

        advanced: [

          {
            zoom:
              value
          }

        ]

      })
      .catch(function(error) {

        console.log(
          'Manual zoom gagal:',
          error
        );

      });

  }
);


/* =====================================================
   TUTUP CAMERA
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  tutupScanner
);


function tutupScanner() {

  scanning = false;


  if (codeReader) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        'ZXing reset:',
        error
      );

    }

  }


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  if (video.srcObject) {

    try {

      video.srcObject
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }

    catch(error) {

      console.log(error);

    }

  }


  video.srcObject =
    null;


  currentStream =
    null;


  currentTrack =
    null;


  codeReader =
    null;


  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
