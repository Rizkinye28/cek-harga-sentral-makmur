<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Cek Harga & Stok - Sentral Makmur</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
  color: #222;
}

body {
  min-height: 100vh;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 27px;
  font-weight: 800;
  margin-top: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin: 6px 0 20px;
  font-size: 14px;
}

.card {
  background: #fff;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

/* CAMERA */

#reader {
  width: 100%;
  height: 320px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  padding: 25px;
  line-height: 1.5;
}

.scan-box {
  position: absolute;
  left: 6%;
  right: 6%;
  top: 32%;
  height: 36%;
  border: 2px solid #fff;
  border-radius: 8px;
  z-index: 20;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.20);
}

.scan-line {
  position: absolute;
  left: 6%;
  right: 6%;
  top: 50%;
  height: 2px;
  background: #fff;
  z-index: 21;
  pointer-events: none;
  box-shadow: 0 0 8px #fff;
}

.scan-hint {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 13px;
  z-index: 22;
  text-shadow: 0 1px 4px #000;
  pointer-events: none;
}

.auto-zoom-status {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.7);
  color: #fff;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  display: none;
}

/* ZOOM */

#zoomControl {
  display: none;
  margin-top: 12px;
  background: #f1f1f1;
  padding: 14px;
  border-radius: 12px;
}

.zoom-title {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.zoom-help {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin: 5px 0 10px;
}

.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.zoom-label {
  font-size: 13px;
  font-weight: bold;
  min-width: 28px;
  text-align: center;
}

#zoomSlider {
  flex: 1;
  width: 100%;
  height: 38px;
  cursor: pointer;
  touch-action: pan-x;
}

#zoomValue {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 6px;
}

/* BUTTON */

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.scan-button {
  background: #1f4e78;
  color: #fff;
}

.stop-button {
  background: #ddd;
  color: #222;
  display: none;
}

/* SEARCH */

.search-area {
  margin-top: 18px;
}

.search-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.manual {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  text-transform: uppercase;
}

.check-button {
  width: auto;
  margin-top: 0;
  background: #1f4e78;
  color: #fff;
}

.clear-button {
  background: #eee;
  color: #222;
}

/* STATUS */

.status {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #777;
}

/* RESULT */

.product-card {
  margin-top: 18px;
  background: #eef8f1;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.4;
}

.product-barcode {
  margin-top: 7px;
  font-size: 13px;
  color: #777;
}

.price {
  font-size: 38px;
  font-weight: bold;
  margin-top: 10px;
}

.stock-box {
  margin-top: 18px;
  padding: 15px;
  border-radius: 13px;
  text-align: center;
}

.stok-aman {
  background: #e8f7ed;
  color: #187a3d;
}

.stok-habis {
  background: #fff1f1;
  color: #b42318;
}

.stock-label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
}

.stock-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 5px;
}

.accurate-code {
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}

.result-count {
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

.result-item {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 14px;
  margin-top: 9px;
  cursor: pointer;
}

.result-item-name {
  font-weight: bold;
  line-height: 1.4;
}

.result-item-barcode {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.result-item-price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 7px;
}

.error {
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  background: #fff1f1;
  color: #b42318;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #888;
}
</style>
</head>

<body>

<div class="container">

<div class="title">
SENTRAL MAKMUR
</div>

<div class="subtitle">
CEK HARGA & STOK PRODUK
</div>

<div class="card">

<div id="reader">

<div class="camera-message">
Tekan <b>&nbsp;MULAI SCAN&nbsp;</b> untuk membuka kamera
</div>

</div>

<div id="zoomControl">

<div class="zoom-title">
🔍 ZOOM KAMERA
</div>

<div class="zoom-help">
Gunakan slider jika barcode terlalu kecil.
</div>

<div class="zoom-row">

<div class="zoom-label">1×</div>

<input
id="zoomSlider"
type="range"
min="1"
max="3"
step="0.1"
value="1">

<div class="zoom-label">3×</div>

</div>

<div id="zoomValue">1.0×</div>

</div>

<div id="status" class="status">
Memuat data produk...
</div>

<button
id="startButton"
class="scan-button"
onclick="startScanner()">

📷 MULAI SCAN

</button>

<button
id="stopButton"
class="stop-button"
onclick="stopScanner()">

⏹ HENTIKAN SCAN

</button>

<div class="search-area">

<div class="search-title">
🔎 Cari barcode atau nama produk
</div>

<div class="manual">

<input
id="searchInput"
type="text"
inputmode="text"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
placeholder="AMZ003 / CHOCOLATE">

<button
class="check-button"
onclick="searchProduct()">

CEK

</button>

</div>

<button
class="clear-button"
onclick="clearSearch()">

HAPUS PENCARIAN

</button>

</div>

<div id="result"></div>

</div>

<div class="footer">
Scan barcode atau cari nama produk
</div>

</div>

<script>

/* =========================================
   GOOGLE APPS SCRIPT API
========================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =========================================
   VARIABLES
========================================= */

let products = [];

let codeReader = null;

let scannerControls = null;

let currentStream = null;

let zoomTrack = null;

let zoomMin = 1;

let zoomMax = 3;

let zoomCurrent = 1;

let lastBarcode = '';

let lastScanTime = 0;


/* =========================================
   LOAD PRODUCTS
========================================= */

function loadProducts() {

const status =
document.getElementById('status');

status.innerText =
'⏳ Memuat data produk...';

const callbackName =
'produkCallback_' + Date.now();

window[callbackName] =
function(data) {

products =
Array.isArray(data)
? data
: [];

status.innerText =
'✓ ' +
products.length +
' produk siap digunakan';

const script =
document.getElementById(callbackName);

if (script) {
script.remove();
}

delete window[callbackName];

};

const script =
document.createElement('script');

script.id =
callbackName;

script.src =
API_URL +
'?callback=' +
encodeURIComponent(callbackName);

script.onerror =
function() {

status.innerText =
'❌ Data produk gagal dimuat';

tampilkanError(
'Tidak dapat mengambil data produk.'
);

delete window[callbackName];

};

document.body.appendChild(script);

}


/* =========================================
   START CAMERA
========================================= */

async function startScanner() {

try {

if (!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia) {

throw new Error(
'Browser tidak mendukung kamera.'
);

}


/* MINTA IZIN KAMERA */

const permissionStream =
await navigator.mediaDevices.getUserMedia({

video: {
facingMode: {
ideal: 'environment'
}
},

audio: false

});


/* HENTIKAN STREAM PERMINTAAN */

permissionStream
.getTracks()
.forEach(function(track) {
track.stop();
});


/* UI */

document
.getElementById('startButton')
.style.display = 'none';

document
.getElementById('stopButton')
.style.display = 'block';


const reader =
document.getElementById('reader');

reader.innerHTML = '';


const video =
document.createElement('video');

video.autoplay = true;

video.muted = true;

video.playsInline = true;

video.setAttribute(
'playsinline',
'');

reader.appendChild(video);


/* SCAN BOX */

const scanBox =
document.createElement('div');

scanBox.className =
'scan-box';

reader.appendChild(scanBox);


/* SCAN LINE */

const scanLine =
document.createElement('div');

scanLine.className =
'scan-line';

reader.appendChild(scanLine);


/* HINT */

const hint =
document.createElement('div');

hint.className =
'scan-hint';

hint.innerText =
'Arahkan barcode ke dalam kotak';

reader.appendChild(hint);


/* ZXING */

codeReader =
new ZXingBrowser
.BrowserMultiFormatReader();


/* CARI KAMERA */

const devices =
await ZXingBrowser
.BrowserCodeReader
.listVideoInputDevices();


if (!devices ||
    devices.length === 0) {

throw new Error(
'Kamera tidak ditemukan setelah izin diberikan.'
);

}


/* CARI KAMERA BELAKANG */

let deviceId =
devices[0].deviceId;

for (const device of devices) {

const label =
String(device.label || '')
.toLowerCase();

if (
label.includes('back') ||
label.includes('rear') ||
label.includes('environment')
) {

deviceId =
device.deviceId;

break;

}

}


/* STREAM UTAMA */

currentStream =
await navigator.mediaDevices.getUserMedia({

video: {

deviceId: {
exact: deviceId
},

width: {
ideal: 1920
},

height: {
ideal: 1080
}

},

audio: false

});


video.srcObject =
currentStream;

await video.play();


/* ZOOM */

setupZoom();


document
.getElementById('status')
.innerText =
'📷 Scanner aktif';


/* ZXING */

scannerControls =
await codeReader.decodeFromStream(

currentStream,

video,

function(result, error) {

if (!result) {
return;
}

const barcode =
String(
result.getText()
)
.trim()
.toUpperCase();

if (!barcode) {
return;
}

const now =
Date.now();

if (
barcode === lastBarcode &&
now - lastScanTime < 2000
) {

return;

}

lastBarcode =
barcode;

lastScanTime =
now;

document
.getElementById('searchInput')
.value =
barcode;

searchBarcode(barcode);

}

);

}

catch (error) {

console.error(
'CAMERA ERROR:',
error
);

tampilkanError(
'❌ Kamera tidak dapat digunakan.<br><br>' +
aman(
error.message ||
error.name ||
''
)
);

stopScanner();

}

}


/* =========================================
   ZOOM
========================================= */

function setupZoom() {

const control =
document.getElementById(
'zoomControl'
);

const slider =
document.getElementById(
'zoomSlider'
);

if (!currentStream) {
return;
}

const tracks =
currentStream.getVideoTracks();

if (!tracks.length) {
return;
}

zoomTrack =
tracks[0];

if (!zoomTrack.getCapabilities) {
return;
}

const capabilities =
zoomTrack.getCapabilities();

if (!capabilities.zoom) {
return;
}

zoomMin =
Number(
capabilities.zoom.min || 1
);

zoomMax =
Math.min(
Number(
capabilities.zoom.max || 3
),
3
);

slider.min =
zoomMin;

slider.max =
zoomMax;

slider.step =
Number(
capabilities.zoom.step || 0.1
);

zoomCurrent =
zoomMin;

slider.value =
zoomCurrent;

control.style.display =
'block';

updateZoom();

applyZoom();

}


document
.getElementById('zoomSlider')
.addEventListener(
'input',
function() {

zoomCurrent =
Number(this.value);

applyZoom();

}
);


function applyZoom() {

if (!zoomTrack) {
return;
}

try {

zoomTrack.applyConstraints({

advanced: [
{
zoom: zoomCurrent
}
]

});

updateZoom();

}

catch (error) {

console.log(
'Zoom tidak tersedia:',
error
);

}

}


function updateZoom() {

document
.getElementById('zoomValue')
.innerText =
Number(zoomCurrent)
.toFixed(1) +
'×';

}


/* =========================================
   STOP CAMERA
========================================= */

function stopScanner() {

try {

if (scannerControls) {
scannerControls.stop();
}

}
catch (e) {}

scannerControls =
null;

try {

if (codeReader) {
codeReader.reset();
}

}
catch (e) {}

codeReader =
null;

if (currentStream) {

currentStream
.getTracks()
.forEach(function(track) {
track.stop();
});

}

currentStream =
null;

zoomTrack =
null;

document
.getElementById('zoomControl')
.style.display =
'none';

document
.getElementById('stopButton')
.style.display =
'none';

document
.getElementById('startButton')
.style.display =
'block';

document
.getElementById('reader')
.innerHTML =
'<div class="camera-message">' +
'Tekan <b>&nbsp;MULAI SCAN&nbsp;</b> untuk membuka kamera' +
'</div>';

}


/* =========================================
   SEARCH
========================================= */

function searchProduct() {

const input =
document.getElementById(
'searchInput'
);

const keyword =
String(
input.value || ''
)
.trim()
.toUpperCase();

input.value =
keyword;

if (!keyword) {

tampilkanError(
'Masukkan barcode atau nama produk.'
);

return;

}


/* BARCODE */

const exact =
products.find(function(product) {

return String(
product.barcode || ''
)
.trim()
.toUpperCase() ===
keyword;

});

if (exact) {

searchBarcode(
exact.barcode
);

return;

}


/* NAMA */

const hasil =
products.filter(function(product) {

const name =
String(
product.name || ''
)
.toUpperCase();

return name.includes(keyword);

});

if (!hasil.length) {

tampilkanError(
'Produk tidak ditemukan.<br><br>' +
'Pencarian: ' +
aman(keyword)
);

return;

}

if (hasil.length === 1) {

searchBarcode(
hasil[0].barcode
);

return;

}

tampilkanDaftar(hasil);

}


/* =========================================
   SEARCH BARCODE
========================================= */

function searchBarcode(barcode) {

barcode =
String(
barcode || ''
)
.trim()
.toUpperCase();

if (!barcode) {
return;
}

document
.getElementById('status')
.innerText =
'⏳ Mengecek harga dan stok Accurate...';


const callbackName =
'stokCallback_' +
Date.now();


window[callbackName] =
function(response) {

try {

if (!response ||
    !response.success) {

tampilkanError(
response &&
response.error
?
aman(response.error)
:
'Data produk tidak ditemukan.'
);

document
.getElementById('status')
.innerText =
'❌ Produk tidak ditemukan';

return;

}


tampilkanProdukDenganStok(
response.data
);

document
.getElementById('status')
.innerText =
'✓ Produk ditemukan';

}

catch (error) {

console.error(error);

tampilkanError(
'Terjadi kesalahan saat membaca data.'
);

}

const script =
document.getElementById(
callbackName
);

if (script) {
script.remove();
}

delete window[callbackName];

};


const script =
document.createElement('script');

script.id =
callbackName;

script.src =
API_URL +
'?aksi=stok' +
'&barcode=' +
encodeURIComponent(barcode) +
'&callback=' +
encodeURIComponent(callbackName);

script.onerror =
function() {

tampilkanError(
'Tidak dapat mengambil data stok Accurate.'
);

document
.getElementById('status')
.innerText =
'❌ Gagal mengambil stok';

delete window[callbackName];

};

document
.body
.appendChild(script);

}


/* =========================================
   PRODUCT RESULT
========================================= */

function tampilkanProdukDenganStok(data) {

const stok =
Number(data.stok || 0);

const stokClass =
stok > 0
? 'stok-aman'
: 'stok-habis';

const stokText =
stok > 0
?
stok + ' ' +
(data.satuan || 'PCS')
:
'HABIS';

document
.getElementById('result')
.innerHTML =

'<div class="product-card">' +

'<div class="product-name">' +
aman(data.nama || '') +
'</div>' +

'<div class="product-barcode">' +
'Barcode: ' +
aman(data.barcode || '') +
'</div>' +

'<div class="price">' +
'Rp ' +
aman(data.harga || '-') +
'</div>' +

'<div class="stock-box ' +
stokClass +
'">' +

'<div class="stock-label">' +
'STOK TERSEDIA' +
'</div>' +

'<div class="stock-number">' +
aman(stokText) +
'</div>' +

'</div>' +

'<div class="accurate-code">' +
'Kode Accurate: ' +
aman(data.kodeAccurate || '-') +
'</div>' +

'</div>';

}


/* =========================================
   MULTIPLE RESULT
========================================= */

function tampilkanDaftar(hasil) {

let html =
'<div class="result-count">' +
'🔎 Ditemukan ' +
hasil.length +
' produk' +
'</div>';

hasil.forEach(function(product, index) {

html +=

'<div class="result-item" ' +
'onclick="pilihProduk(' +
index +
')">' +

'<div class="result-item-name">' +
aman(product.name) +
'</div>' +

'<div class="result-item-barcode">' +
'Barcode: ' +
aman(product.barcode) +
'</div>' +

'<div class="result-item-price">' +
'Rp ' +
aman(product.price) +
'</div>' +

'</div>';

});

window.hasilPencarian =
hasil;

document
.getElementById('result')
.innerHTML =
html;

}


/* =========================================
   SELECT
========================================= */

function pilihProduk(index) {

const product =
window.hasilPencarian[index];

if (!product) {
return;
}

document
.getElementById('searchInput')
.value =
String(
product.barcode || ''
)
.toUpperCase();

searchBarcode(
product.barcode
);

}


/* =========================================
   CLEAR
========================================= */

function clearSearch() {

document
.getElementById('searchInput')
.value =
'';

document
.getElementById('result')
.innerHTML =
'';

}


/* =========================================
   ERROR
========================================= */

function tampilkanError(message) {

document
.getElementById('result')
.innerHTML =
'<div class="error">' +
message +
'</div>';

}


/* =========================================
   SAFE HTML
========================================= */

function aman(text) {

return String(text)

.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#039;');

}


/* =========================================
   INPUT
========================================= */

document
.getElementById('searchInput')
.addEventListener(
'input',
function() {

this.value =
this.value.toUpperCase();

});


document
.getElementById('searchInput')
.addEventListener(
'keydown',
function(event) {

if (event.key === 'Enter') {
searchProduct();
}

});


/* =========================================
   LOAD
========================================= */

loadProducts();

</script>

</body>
</html>
