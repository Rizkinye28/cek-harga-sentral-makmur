<style>

body {

}

header {

.logo {

    0 12px 30px rgba(0,0,0,.12);

/* =====================================================
   SEARCH
===================================================== */

.search-card {

  background:
    white;

    24px;

  padding:
    22px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.08);

}

.search-row {

  display:

}

.search-input-wrap {

input {

}

input:focus {

    #111;

}

.clear {

}

.video-wrap {

}

.zoom-control {

  margin-top:

}

.zoom-control input {

  height:

===================================================== */

.result-card {

    white;

  border-radius:
    24px;

    30px;

  min-height:

  box-shadow:

}

.empty {

  color:

}

}

.empty-title {

  font-size:
    22px;

  color:

  margin-bottom:
    8px;

}

.product {

  display:
    none;

}

.product-name {

    27px;

  font-weight:
    800;

  margin-bottom:

}

.info-grid {

}

.info {

  border-radius:

}

.label {

    13px;

  color:

}

.value {

}

.stock {

}

}

}

.search-results {

.result-item {

}

}

}

.loading {

  text-align:
    center;

}

.error {

footer {

@media(max-width:600px) {

  }

  .search-row {

  }

  }

  }

}

<body>

  >

      🔎
    </div>

      Cari produk
    </div>

      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

      </div>

        <div class="label">
          Kode Accurate

          id="productCode"

      </div>


      <div class="info">

        <div class="label">
          Harga
        </div>

          id="productPrice"

        ></div>

      </div>

          id="productStock"

</section>


<footer>

  Sentral Makmur • API Harga & Stok

</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const zoomRange =
  document.getElementById('zoomRange');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');


/* =====================================================
   VARIABEL
===================================================== */

let codeReader = null;
let currentStream = null;
let currentTrack = null;
let scanning = false;

let autoZoomTimer = null;
let autoZoomRunning = false;

let currentAutoZoom = 1;
let zoomMin = 1;
let zoomMax = 1;
let zoomStep = 0.1;

let masterCache = null;

let audioContext = null;


/* =====================================================
   AUDIO
===================================================== */

function siapkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === 'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {

    console.log(
      'Audio tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   BIP BERHASIL
===================================================== */

function bunyiBeep() {

  try {

    siapkanAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = 'sine';

    oscillator.frequency.setValueAtTime(
      1200,
      audioContext.currentTime
    );

    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.45,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.18
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.18
    );

  }

  catch(error) {

    console.log(
      'Beep gagal:',
      error
    );

  }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        100,
        50,
        150
      ]);

    }

  }

  catch(error) {

    console.log(
      'Getar tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   FEEDBACK PRODUK BERHASIL
===================================================== */

function feedbackProduk() {

  bunyiBeep();

  getarBerhasil();

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);


/* =====================================================
   CLEAR
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display =
      'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cari();

    }

  }
);


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(value) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   CACHE MASTER
===================================================== */

async function ambilMasterCache() {

  if (
    Array.isArray(masterCache)
  ) {

    return masterCache;

  }

  const response =
    await fetch(
      API_URL + '?aksi=master'
    );

  const json =
    await response.json();

  if (
    !json.success ||
    !Array.isArray(json.data)
  ) {

    throw new Error(
      'Master Produk tidak tersedia.'
    );

  }

  masterCache =
    json.data;

  return masterCache;

}


/* =====================================================
   CARI
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


async function cari() {

  const keyword =
    searchInput.value.trim();

  if (!keyword) {

    resetResult();

    return;

  }

  tutupScanner();

  tampilLoading();

  try {

    const master =
      await ambilMasterCache();

    const target =
      normalisasi(keyword);

    const hasil =
      master.filter(
        function(item) {

          const barcode =
            normalisasi(
              item.barcode
            );

          const nama =
            normalisasi(
              item.nama ||
              item.name
            );

          const kode =
            normalisasi(
              item.kodeAccurate ||
              item.no
            );

          const id =
            normalisasi(
              item.id
            );

          return (

            barcode.includes(target)

            ||

            nama.includes(target)

            ||

            kode.includes(target)

            ||

            id === target

          );

        }
      );


    if (
      hasil.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan di Master Produk.'
      );

      return;

    }


    if (
      hasil.length === 1
    ) {

      await tampilProduk(
        hasil[0]
      );

      return;

    }


    tampilDaftarHasil(
      hasil.slice(0, 50)
    );

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Tidak dapat mengambil data produk.'
    );

  }

}


/* =====================================================
   DAFTAR HASIL
===================================================== */

function tampilDaftarHasil(data) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'block';

  searchResults.innerHTML =
    '';


  data.forEach(
    function(item) {

      const div =
        document.createElement('div');

      div.className =
        'result-item';

      div.innerHTML =

        '<div class="result-item-name">' +

        escapeHtml(
          item.nama ||
          item.name ||
          '-'
        ) +

        '</div>' +

        '<div class="result-item-code">' +

        'Barcode: ' +

        escapeHtml(
          item.barcode ||
          '-'
        ) +

        ' • Kode: ' +

        escapeHtml(
          item.kodeAccurate ||
          item.no ||
          '-'
        ) +

        '</div>';

      div.addEventListener(
        'click',
        function() {

          tampilProduk(item);

        }
      );

      searchResults.appendChild(div);

    }
  );

}


/* =====================================================
   TAMPIL PRODUK
===================================================== */

async function tampilProduk(item) {

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  loading.style.display =
    'block';


  try {

    const params =
      new URLSearchParams();

    params.set(
      'aksi',
      'stok'
    );


    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (item.kodeAccurate) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString()
      );


    const json =
      await response.json();


    if (!json.success) {

      tampilError(
        json.error ||
        'Stok gagal diambil dari Accurate.'
      );

      return;

    }


    const data =
      json.data;


    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      data.harga ||
      '-';


    document.getElementById(
      'productStock'
    ).textContent =

      String(
        data.stok ??
        data.stock ??
        0
      ) +

      ' ' +

      (
        data.satuan ||
        'PCS'
      );


    loading.style.display =
      'none';

    product.style.display =
      'block';


    /*
     * =====================================
     * PRODUK SUDAH BERHASIL MUNCUL
     * BIP + GETAR
     * =====================================
     */

    feedbackProduk();

  }

  catch(error) {

    console.error(error);

    tampilError(
      'Gagal mengambil stok dari Accurate.'
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  loading.style.display =
    'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(message) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display =
    'block';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

}


/* =====================================================
   SCAN BUTTON
===================================================== */

scanBtn.addEventListener(
  'click',
  function() {

    // Aktifkan audio dari interaksi pengguna
    siapkanAudio();

    bukaScanner();

  }
);


/* =====================================================
   BUKA SCANNER
===================================================== */

async function bukaScanner() {

  // Bersihkan scanner sebelumnya
  tutupScanner();

  scannerCard.style.display =
    'block';

  try {

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    scanning =
      true;


    /*
     * =================================================
     * PAKSA KAMERA BELAKANG
     * =================================================
     *
     * Jangan lagi memilih devices[0].
     * Kita langsung minta kamera environment.
     *
     * Ini mencegah kamera berubah ke kamera depan
     * saat scan kedua, ketiga, dst.
     */

    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        },

        frameRate: {
          ideal: 30,
          max: 30
        }

      }

    };


    /*
     * =================================================
     * START CAMERA
     * =================================================
     */

    currentStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      currentStream;


    await video.play();


    /*
     * Ambil track kamera
     */

    const tracks =
      currentStream.getVideoTracks();


    if (
      !tracks.length
    ) {

      throw new Error(
        'Track kamera tidak ditemukan.'
      );

    }


    currentTrack =
      tracks[0];


    /*
     * =================================================
     * CEK KAMERA
     * =================================================
     */

    console.log(
      'Kamera aktif:',
      currentTrack.label
    );


    /*
     * =================================================
     * SET ZOOM AWAL
     * =================================================
     */

    siapkanZoom(
      currentTrack
    );


    /*
     * =================================================
     * MULAI ZXING
     * =================================================
     *
     * Karena stream sudah kita buat sendiri,
     * kita gunakan decodeFromVideoElement.
     */

    decodeBarcode();


    /*
     * =================================================
     * MULAI DETEKSI BARCODE UNTUK AUTO ZOOM
     * =================================================
     */

    mulaiAutoZoomDeteksi();

  }

  catch(error) {

    console.error(
      'Kamera gagal:',
      error
    );


    hentikanAutoZoom();


    scannerCard.style.display =
      'none';


    alert(
      'Kamera belakang tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
    );

  }

}


/* =====================================================
   DECODE BARCODE
===================================================== */

function decodeBarcode() {

  if (
    !codeReader ||
    !scanning
  ) {

    return;

  }


  codeReader.decodeFromVideoElement(
    video,
    function(result, error) {

      if (
        result &&
        scanning
      ) {

        /*
         * =============================================
         * BARCODE BERHASIL
         * =============================================
         */

        scanning =
          false;


        /*
         * STOP AUTO ZOOM SECEPATNYA
         */

        hentikanAutoZoom();


        /*
         * BEEP + GETAR
         */

        feedbackScan();


        /*
         * Ambil barcode
         */

        const text =
          result.getText();


        console.log(
          'Barcode terbaca:',
          text
        );


        /*
         * Masukkan barcode ke search
         */

        searchInput.value =
          text;


        clearBtn.style.display =
          'block';


        /*
         * Tutup kamera
         */

        tutupScanner();


        /*
         * Cari produk
         */

        cari();

      }

    }
  );

}


/* =====================================================
   SIAPKAN ZOOM
===================================================== */

function siapkanZoom(
  track
) {

  try {

    const capabilities =
      track.getCapabilities();


    /*
     * Kalau kamera tidak mendukung zoom
     */

    if (
      !capabilities.zoom
    ) {

      console.log(
        'Kamera tidak mendukung zoom.'
      );


      zoomRange.style.display =
        'none';


      return;

    }


    const min =
      capabilities.zoom.min;


    const max =
      capabilities.zoom.max;


    const step =
      capabilities.zoom.step ||
      0.1;


    /*
     * =================================================
     * BATASI MAX ZOOM
     * =================================================
     *
     * Walaupun kamera bisa 10x,
     * kita hanya izinkan sekitar 2.2x.
     */

    const batasZoom =
      Math.min(
        max,
        2.2
      );


    zoomRange.min =
      min;


    zoomRange.max =
      batasZoom;


    zoomRange.step =
      step;


    /*
     * START NORMAL
     */

    currentAutoZoom =
      Math.max(
        min,
        1
      );


    zoomRange.value =
      currentAutoZoom;


    zoomRange.style.display =
      'block';


    /*
     * Terapkan zoom normal
     */

    terapkanZoom(
      track,
      currentAutoZoom
    );


    /*
     * Simpan batas zoom
     */

    window.zoomMin =
      min;


    window.zoomMax =
      batasZoom;


    window.zoomStep =
      step;


    console.log(
      'Zoom:',
      min,
      '-',
      batasZoom
    );

  }

  catch(error) {

    console.log(
      'Gagal menyiapkan zoom:',
      error
    );


    zoomRange.style.display =
      'none';

  }

}


/* =====================================================
   DETEKSI BARCODE + AUTO ZOOM
===================================================== */

let barcodeDetector =
  null;

let autoZoomDetectionTimer =
  null;

let barcodeTerlihat =
  false;


/* =====================================================
   MULAI DETEKSI
===================================================== */

function mulaiAutoZoomDeteksi() {

  hentikanAutoZoom();


  barcodeTerlihat =
    false;


  /*
   * =================================================
   * BARCODE DETECTOR NATIVE
   * =================================================
   *
   * Browser modern tertentu mendukung BarcodeDetector.
   */

  if (
    'BarcodeDetector'
    in window
  ) {

    try {

      barcodeDetector =
        new BarcodeDetector({

          formats: [

            'ean_13',
            'ean_8',
            'upc_a',
            'upc_e',
            'code_128',
            'code_39',
            'code_93',
            'itf',
            'codabar'

          ]

        });


      console.log(
        'BarcodeDetector aktif.'
      );


      autoZoomDetectionTimer =
        setInterval(
          deteksiBarcodeUntukZoom,
          180
        );


      return;

    }

    catch(error) {

      console.log(
        'BarcodeDetector tidak bisa digunakan:',
        error
      );

    }

  }


  /*
   * =================================================
   * FALLBACK
   * =================================================
   *
   * Kalau browser tidak mendukung BarcodeDetector,
   * kita gunakan zoom bertahap yang sangat ringan.
   *
   * Tidak langsung zoom besar.
   */

  mulaiFallbackZoom();

}


/* =====================================================
   DETEKSI BARCODE NATIVE
===================================================== */

async function deteksiBarcodeUntukZoom() {

  if (
    !scanning ||
    !currentTrack ||
    !video.videoWidth
  ) {

    return;

  }


  try {

    const barcodes =
      await barcodeDetector.detect(
        video
      );


    /*
     * Tidak ada barcode
     */

    if (
      !barcodes ||
      !barcodes.length
    ) {

      barcodeTerlihat =
        false;

      return;

    }


    /*
     * BARCODE TERLIHAT
     */

    barcodeTerlihat =
      true;


    /*
     * =================================================
     * AUTO ZOOM BERDASARKAN UKURAN BARCODE
     * =================================================
     */

    const barcode =
      barcodes[0];


    const box =
      barcode.boundingBox;


    if (
      !box
    ) {

      return;

    }


    const lebarVideo =
      video.videoWidth;


    const tinggiVideo =
      video.videoHeight;


    const ukuranBarcode =
      Math.max(
        box.width / lebarVideo,
        box.height / tinggiVideo
      );


    /*
     * Barcode sudah cukup besar
     */

    if (
      ukuranBarcode >= 0.28
    ) {

      /*
       * Jangan zoom lagi
       */

      hentikanAutoZoom();

      return;

    }


    /*
     * Barcode terlalu kecil.
     * Naikkan zoom sedikit saja.
     */

    let targetZoom =
      1;


    if (
      ukuranBarcode < 0.08
    ) {

      targetZoom =
        1.8;

    }

    else if (
      ukuranBarcode < 0.14
    ) {

      targetZoom =
        1.5;

    }

    else if (
      ukuranBarcode < 0.20
    ) {

      targetZoom =
        1.3;

    }

    else {

      targetZoom =
        1.15;

    }


    /*
     * Batasi maksimum
     */

    targetZoom =
      Math.min(
        targetZoom,
        window.zoomMax || 2.2
      );


    /*
     * Jangan naik turun terus.
     */

    if (
      targetZoom >
      currentAutoZoom
    ) {

      currentAutoZoom =
        targetZoom;


      zoomRange.value =
        currentAutoZoom;


      terapkanZoom(
        currentTrack,
        currentAutoZoom
      );

    }

  }

  catch(error) {

    /*
     * Tidak perlu spam console
     */

  }

}


/* =====================================================
   FALLBACK AUTO ZOOM
===================================================== */

function mulaiFallbackZoom() {

  /*
   * Kalau BarcodeDetector tidak tersedia,
   * kita TIDAK langsung zoom.
   *
   * Mulai normal dulu.
   */

  currentAutoZoom =
    Math.max(
      window.zoomMin || 1,
      1
    );


  /*
   * Setelah 1.5 detik tanpa barcode,
   * naik sedikit saja.
   *
   * Ini hanya fallback karena browser tidak punya
   * BarcodeDetector.
   */

  autoZoomDetectionTimer =
    setTimeout(
      function() {

        if (
          !scanning ||
          !currentTrack
        ) {

          return;

        }


        const maxZoom =
          window.zoomMax || 2.2;


        /*
         * Naik hanya 0.25x
         */

        const nextZoom =
          Math.min(
            currentAutoZoom + 0.25,
            maxZoom
          );


        if (
          nextZoom >
          currentAutoZoom
        ) {

          currentAutoZoom =
            nextZoom;


          zoomRange.value =
            currentAutoZoom;


          terapkanZoom(
            currentTrack,
            currentAutoZoom
          );

        }


        /*
         * Ulangi perlahan.
         */

        mulaiFallbackZoom();

      },
      1500
    );

}


/* =====================================================
   TERAPKAN ZOOM
===================================================== */

function terapkanZoom(
  track,
  zoom
) {

  if (
    !track
  ) {

    return;

  }


  try {

    track.applyConstraints({

      advanced: [

        {
          zoom:
            zoom
        }

      ]

    }).catch(
      function(error) {

        console.log(
          'Zoom gagal:',
          error
        );

      }
    );

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   STOP AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

  if (
    autoZoomDetectionTimer
  ) {

    clearInterval(
      autoZoomDetectionTimer
    );

    clearTimeout(
      autoZoomDetectionTimer
    );


    autoZoomDetectionTimer =
      null;

  }

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

zoomRange.addEventListener(
  'input',
  function() {

    if (
      !currentTrack
    ) {

      return;

    }


    /*
     * Kalau user mengatur zoom manual,
     * hentikan auto zoom.
     */

    hentikanAutoZoom();


    currentAutoZoom =
      Number(
        zoomRange.value
      );


    terapkanZoom(
      currentTrack,
      currentAutoZoom
    );

  }
);


/* =====================================================
   TUTUP CAMERA
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  tutupScanner
);


function tutupScanner() {

  scanning =
    false;


  /*
   * STOP AUTO ZOOM
   */

  hentikanAutoZoom();


  /*
   * STOP ZXING
   */

  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }


  /*
   * STOP CAMERA
   */

  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  if (
    video.srcObject
  ) {

    video.srcObject =
      null;

  }


  /*
   * RESET VARIABEL
   */

  currentStream =
    null;

  currentTrack =
    null;

  barcodeDetector =
    null;

  barcodeTerlihat =
    false;


  /*
   * RESET ZOOM
   */

  currentAutoZoom =
    1;


  zoomRange.value =
    1;


  /*
   * HIDE CAMERA
   */

  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
