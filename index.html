<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sentral Makmur - Cek Harga & Stok</title>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #151515;
}

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
}


/* =====================================================
   HEADER
===================================================== */

header {
  text-align: center;
  padding: 24px 0 22px;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin-top: 7px;
  color: #777;
  font-size: 17px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input-wrap {
  flex: 1;
  position: relative;
}

input {
  width: 100%;
  height: 58px;
  padding: 0 48px 0 18px;
  border: 2px solid #ddd;
  border-radius: 16px;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #111;
}

.clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 25px;
  color: #777;
  cursor: pointer;
  display: none;
}

button {
  border: none;
  border-radius: 16px;
  padding: 0 25px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-gray {
  background: #eee;
  color: #555;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-row button {
  height: 52px;
  flex: 1;
}


/* =====================================================
   CAMERA
===================================================== */

.scanner-card {
  margin-top: 14px;
  background: #111;
  border-radius: 20px;
  padding: 12px;
  display: none;
}

.scanner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  margin-bottom: 9px;
}

.scanner-title {
  font-size: 16px;
  font-weight: 700;
}

.close-camera {
  background: #333;
  color: white;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 13px;
}

.video-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  background: #000;

  /*
   * Kotak kamera dibuat tidak terlalu besar.
   */
  max-width: 650px;
  margin: 0 auto;
}

video {
  width: 100%;
  display: block;
  height: 300px;
  object-fit: cover;
  background: #000;
}

.scan-frame {
  position: absolute;

  width: 68%;
  height: 105px;

  left: 16%;
  top: 50%;

  transform: translateY(-50%);

  border: 2px solid rgba(255,255,255,.85);

  border-radius: 12px;

  pointer-events: none;
}

.scan-line {
  position: absolute;

  left: 18%;
  right: 18%;

  top: 50%;

  height: 2px;

  background: white;

  opacity: .75;

  pointer-events: none;
}

.zoom-status {
  text-align: center;
  color: #fff;

  margin-top: 8px;

  font-size: 14px;
  font-weight: 700;
}

.zoom-control {
  margin-top: 8px;
  color: white;
  font-size: 13px;
}

.zoom-control input {
  width: 100%;
  height: auto;
  padding: 0;
}


/* =====================================================
   RESULT
===================================================== */

.result-card {
  margin-top: 18px;
  background: white;
  border-radius: 24px;
  padding: 30px;
  min-height: 220px;
  box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.empty {
  text-align: center;
  color: #777;
  padding: 35px 10px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-title {
  font-size: 22px;
  font-weight: 700;
  color: #333;
  margin-bottom: 8px;
}

.product {
  display: none;
}

.product-name {
  font-size: 27px;
  font-weight: 800;
  margin-bottom: 20px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.info {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 16px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 6px;
}

.value {
  font-size: 19px;
  font-weight: 700;
}

.stock {
  background: #111;
  color: white;
}

.stock .label {
  color: #bbb;
}

.stock .value {
  font-size: 26px;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-results {
  display: none;
  margin-top: 15px;
}

.result-item {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 9px;
  cursor: pointer;
}

.result-item:hover {
  background: #eaeaea;
}

.result-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.result-item-code {
  color: #777;
  font-size: 13px;
}


/* =====================================================
   STATUS
===================================================== */

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
  text-align: center;
  padding: 30px 0;
  color: #aaa;
  font-size: 14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

  header {
    padding-top: 18px;
  }

  h1 {
    font-size: 27px;
  }

  .subtitle {
    font-size: 15px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    height: 54px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .result-card {
    padding: 22px;
  }

  .product-name {
    font-size: 22px;
  }

  video {
    height: 270px;
  }

  .scanner-card {
    padding: 10px;
    border-radius: 18px;
  }

  .scan-frame {
    width: 72%;
    height: 90px;
    left: 14%;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <h1>
    Sentral Makmur
  </h1>

  <div class="subtitle">
    Cek Harga & Stok Produk
  </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-card">

  <div class="search-row">

    <div class="search-input-wrap">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>

    <button
      id="searchBtn"
      class="btn-black"
      type="button"
    >
      Cari
    </button>

  </div>


  <div class="action-row">

    <button
      id="scanBtn"
      class="btn-black"
      type="button"
    >
      📷 Scan Barcode
    </button>

    <button
      id="resetBtn"
      class="btn-gray"
      type="button"
    >
      Reset
    </button>

  </div>

</section>


<!-- =====================================================
     CAMERA
===================================================== -->

<section
  id="scannerCard"
  class="scanner-card"
>

  <div class="scanner-header">

    <div class="scanner-title">
      Scan Barcode
    </div>

    <button
      id="closeCameraBtn"
      class="close-camera"
      type="button"
    >
      Tutup
    </button>

  </div>


  <div class="video-wrap">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="scan-frame"></div>

    <div class="scan-line"></div>

  </div>


  <div
    id="zoomStatus"
    class="zoom-status"
  >
    Zoom 1x
  </div>


  <div
    id="zoomControl"
    class="zoom-control"
  >

    Zoom Manual

    <input
      id="zoomRange"
      type="range"
      min="1"
      max="3"
      step="0.1"
      value="1"
    >

  </div>

</section>


<!-- =====================================================
     SEARCH RESULTS
===================================================== -->

<div
  id="searchResults"
  class="search-results"
></div>


<!-- =====================================================
     RESULT CARD
===================================================== -->

<section
  id="resultCard"
  class="result-card"
>

  <div
    id="emptyState"
    class="empty"
  >

    <div class="empty-icon">
      🔎
    </div>

    <div class="empty-title">
      Cari produk
    </div>

    <div>
      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

  </div>


  <div
    id="loading"
    class="loading"
    style="display:none;"
  >
    Mengambil data stok dari Accurate...
  </div>


  <div
    id="errorState"
    class="error"
    style="display:none;"
  ></div>


  <div
    id="product"
    class="product"
  >

    <div
      id="productName"
      class="product-name"
    ></div>


    <div class="info-grid">


      <div class="info">

        <div class="label">
          Barcode
        </div>

        <div
          id="productBarcode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Kode Accurate
        </div>

        <div
          id="productCode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Harga
        </div>

        <div
          id="productPrice"
          class="value"
        ></div>

      </div>


      <div class="info stock">

        <div class="label">
          Stok
        </div>

        <div
          id="productStock"
          class="value"
        ></div>

      </div>


    </div>

  </div>

</section>


<footer>
  Sentral Makmur • API Harga & Stok
</footer>


</div>


<script>

/* =====================================================
   API APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const zoomRange =
  document.getElementById('zoomRange');

const zoomStatus =
  document.getElementById('zoomStatus');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');


/* =====================================================
   VARIABLE
===================================================== */

let codeReader = null;

let currentStream = null;

let currentTrack = null;

let scanning = false;

let masterCache = null;


/*
 * AUTO ZOOM
 */

let autoZoomTimer = null;

let barcodeDetectorTimer = null;

let barcodeDetector = null;

let barcodeTerlihat = false;

let zoomLevel = 1;

let zoomMin = 1;

let zoomMax = 3;

let zoomStep = 0.1;

let lastBarcodeSeen =
  0;


/*
 * AUDIO
 */

let audioContext = null;


/* =====================================================
   AUDIO
===================================================== */

function siapkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {

    console.log(
      'Audio tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   BEEP
===================================================== */

function bunyiBeep() {

  try {

    siapkanAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      'sine';

    oscillator.frequency.setValueAtTime(
      1200,
      audioContext.currentTime
    );

    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.45,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.18
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.18
    );

  }

  catch(error) {

    console.log(
      'Beep gagal:',
      error
    );

  }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        100,
        50,
        150
      ]);

    }

  }

  catch(error) {

    console.log(
      'Getar tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   FEEDBACK
===================================================== */

function feedbackProduk() {

  bunyiBeep();

  getarBerhasil();

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);


/* =====================================================
   CLEAR
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display =
      'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cari();

    }

  }
);


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(value) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   MASTER CACHE
===================================================== */

async function ambilMasterCache() {

  if (
    Array.isArray(masterCache)
  ) {

    return masterCache;

  }


  const response =
    await fetch(
      API_URL +
      '?aksi=master'
    );


  const json =
    await response.json();


  if (
    !json.success ||
    !Array.isArray(json.data)
  ) {

    throw new Error(
      'Master Produk tidak tersedia.'
    );

  }


  masterCache =
    json.data;


  return masterCache;

}


/* =====================================================
   CARI
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


async function cari() {

  const keyword =
    searchInput.value.trim();


  if (!keyword) {

    resetResult();

    return;

  }


  tutupScanner();

  tampilLoading();


  try {

    const master =
      await ambilMasterCache();


    const target =
      normalisasi(keyword);


    const hasil =
      master.filter(
        function(item) {

          const barcode =
            normalisasi(
              item.barcode
            );

          const nama =
            normalisasi(
              item.nama ||
              item.name
            );

          const kode =
            normalisasi(
              item.kodeAccurate ||
              item.no
            );

          const id =
            normalisasi(
              item.id
            );


          return (

            barcode.includes(target)

            ||

            nama.includes(target)

            ||

            kode.includes(target)

            ||

            id === target

          );

        }
      );


    if (
      hasil.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan di Master Produk.'
      );

      return;

    }


    if (
      hasil.length === 1
    ) {

      await tampilProduk(
        hasil[0]
      );

      return;

    }


    tampilDaftarHasil(
      hasil.slice(
        0,
        50
      )
    );

  }

  catch(error) {

    console.error(
      error
    );

    tampilError(
      'Tidak dapat mengambil data produk.'
    );

  }

}


/* =====================================================
   DAFTAR HASIL
===================================================== */

function tampilDaftarHasil(data) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'block';

  searchResults.innerHTML =
    '';


  data.forEach(
    function(item) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'result-item';


      div.innerHTML =

        '<div class="result-item-name">' +

        escapeHtml(
          item.nama ||
          item.name ||
          '-'
        ) +

        '</div>' +

        '<div class="result-item-code">' +

        'Barcode: ' +

        escapeHtml(
          item.barcode ||
          '-'
        ) +

        ' • Kode: ' +

        escapeHtml(
          item.kodeAccurate ||
          item.no ||
          '-'
        ) +

        '</div>';


      div.addEventListener(
        'click',
        function() {

          tampilProduk(
            item
          );

        }
      );


      searchResults.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   TAMPIL PRODUK
===================================================== */

async function tampilProduk(item) {

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  loading.style.display =
    'block';


  try {

    const params =
      new URLSearchParams();


    params.set(
      'aksi',
      'stok'
    );


    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (item.kodeAccurate) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString()
      );


    const json =
      await response.json();


    if (
      !json.success
    ) {

      tampilError(
        json.error ||
        'Stok gagal diambil dari Accurate.'
      );

      return;

    }


    const data =
      json.data;


    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      data.harga ||
      '-';


    document.getElementById(
      'productStock'
    ).textContent =

      String(
        data.stok ??
        data.stock ??
        0
      ) +

      ' ' +

      (
        data.satuan ||
        'PCS'
      );


    loading.style.display =
      'none';

    product.style.display =
      'block';


    /*
     * BEEP + GETAR
     * setelah produk benar-benar muncul
     */

    feedbackProduk();

  }

  catch(error) {

    console.error(
      error
    );

    tampilError(
      'Gagal mengambil stok dari Accurate.'
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  loading.style.display =
    'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(message) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display =
    'block';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

}


/* =====================================================
   SCAN BUTTON
===================================================== */

scanBtn.addEventListener(
  'click',
  function() {

    /*
     * Audio harus diaktifkan
     * dari klik pengguna.
     */

    siapkanAudio();

    bukaScanner();

  }
);


/* =====================================================
   BUKA SCANNER
===================================================== */

async function bukaScanner() {

  /*
   * Pastikan kamera lama benar-benar
   * mati sebelum membuka kamera baru.
   */

  tutupScanner();


  scannerCard.style.display =
    'block';


  scanning =
    true;


  try {

    /*
     * =================================================
     * KAMERA BELAKANG
     * =================================================
     *
     * Jangan memakai listVideoInputDevices()
     * karena beberapa HP bisa memilih kamera
     * depan ketika scanner dibuka ulang.
     *
     * Kita langsung meminta environment camera.
     */

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30
          }

        }

      });


    video.srcObject =
      currentStream;


    await video.play();


    const tracks =
      currentStream.getVideoTracks();


    if (
      !tracks.length
    ) {

      throw new Error(
        'Track kamera tidak ditemukan.'
      );

    }


    currentTrack =
      tracks[0];


    /*
     * Cek kamera.
     */

    console.log(
      'Kamera aktif:',
      currentTrack.label
    );


    /*
     * =================================================
     * SIAPKAN ZOOM
     * =================================================
     */

    siapkanZoom(
      currentTrack
    );


    /*
     * =================================================
     * BARCODE DETECTOR
     * =================================================
     *
     * Dipakai untuk mengetahui apakah
     * barcode sedang terlihat.
     */

    mulaiBarcodeDetector();


    /*
     * =================================================
     * ZXING
     * =================================================
     */

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    codeReader.decodeFromVideoElement(
      video,
      function(result, error) {

        if (
          result &&
          scanning
        ) {

          scanning =
            false;


          hentikanAutoZoom();


          hentikanBarcodeDetector();


          /*
           * BARCODE BERHASIL
           */

          const text =
            result.getText();


          console.log(
            'Barcode terbaca:',
            text
          );


          /*
           * Feedback langsung
           */

          bunyiBeep();

          getarBerhasil();


          searchInput.value =
            text;


          clearBtn.style.display =
            'block';


          /*
           * Tutup kamera
           */

          tutupScanner();


          /*
           * Cari produk

           */

          cari();

        }

      }
    );


    /*
     * Mulai sistem auto zoom.
     */

    mulaiAutoZoom();

  }

  catch(error) {

    console.error(
      'Kamera error:',
      error
    );


    tutupScanner();


    alert(
      'Kamera belakang tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
    );

  }

}


/* =====================================================
   SIAPKAN ZOOM
===================================================== */

function siapkanZoom(track) {

  try {

    const capabilities =
      track.getCapabilities();


    if (
      !capabilities.zoom
    ) {

      console.log(
        'Kamera tidak mendukung zoom hardware.'
      );


      zoomRange.style.display =
        'none';

      zoomStatus.textContent =
        'Zoom hardware tidak tersedia';

      return;

    }


    zoomMin =
      Number(
        capabilities.zoom.min ||
        1
      );


    /*
     * Kita sengaja batasi maksimal 3x.
     *
     * Jadi kamera tidak akan zoom
     * sampai terlalu dekat.
     */

    zoomMax =
      Math.min(
        Number(
          capabilities.zoom.max ||
          3
        ),
        3
      );


    zoomStep =
      Number(
        capabilities.zoom.step ||
        0.1
      );


    /*
     * Pastikan minimal 1x
     */

    zoomMin =
      Math.max(
        zoomMin,
        1
      );


    zoomRange.min =
      zoomMin;

    zoomRange.max =
      zoomMax;

    zoomRange.step =
      zoomStep;

    zoomRange.value =
      zoomMin;


    /*
     * Mulai selalu 1x
     */

    zoomLevel =
      zoomMin;


    zoomStatus.textContent =
      'Zoom 1x';


    zoomRange.style.display =
      'block';


    terapkanZoom(
      track,
      zoomLevel
    );

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );


    zoomRange.style.display =
      'none';

  }

}


/* =====================================================
   TERAPKAN ZOOM
===================================================== */

function terapkanZoom(
  track,
  zoom
) {

  if (
    !track
  ) {

    return;

  }


  try {

    track.applyConstraints({

      advanced: [
        {
          zoom: zoom
        }
      ]

    }).catch(
      function(error) {

        console.log(
          'Gagal apply zoom:',
          error
        );

      }
    );

  }

  catch(error) {

    console.log(
      'Zoom error:',
      error
    );

  }

}


/* =====================================================
   SET ZOOM
===================================================== */

function setZoom(level) {

  if (
    !currentTrack
  ) {

    return;

  }


  level =
    Math.max(
      zoomMin,
      Math.min(
        zoomMax,
        level
      )
    );


  zoomLevel =
    level;


  zoomRange.value =
    level;


  /*
   * Tampilan dibuat sederhana:
   * 1x / 2x / 3x
   */

  let displayZoom =
    level;


  if (
    level < 1.5
  ) {

    displayZoom =
      1;

  }

  else if (
    level < 2.5
  ) {

    displayZoom =
      2;

  }

  else {

    displayZoom =
      3;

  }


  zoomStatus.textContent =
    'Zoom ' +
    displayZoom +
    'x';


  terapkanZoom(
    currentTrack,
    level
  );

}


/* =====================================================
   BARCODE DETECTOR
===================================================== */

function mulaiBarcodeDetector() {

  /*
   * BarcodeDetector hanya tersedia
   * di browser tertentu.
   */

  if (
    !('BarcodeDetector' in window)
  ) {

    console.log(
      'BarcodeDetector tidak tersedia. Menggunakan timer fallback.'
    );

    return;

  }


  try {

    barcodeDetector =
      new BarcodeDetector({

        formats: [

          'ean_13',
          'ean_8',
          'upc_a',
          'upc_e',
          'code_128',
          'code_39',
          'code_93',
          'itf',
          'codabar'

        ]

      });

  }

  catch(error) {

    console.log(
      'BarcodeDetector gagal:',
      error
    );

    barcodeDetector =
      null;

    return;

  }


  barcodeTerlihat =
    false;


  /*
   * Cek frame kamera secara berkala.
   */

  barcodeDetectorTimer =
    setInterval(
      async function() {

        if (
          !scanning ||
          !barcodeDetector ||
          !video.videoWidth
        ) {

          return;

        }


        try {

          const codes =
            await barcodeDetector.detect(
              video
            );


          /*
           * BARCODE TERLIHAT
           */

          if (
            codes &&
            codes.length > 0
          ) {

            barcodeTerlihat =
              true;

            lastBarcodeSeen =
              performance.now();


            /*
             * Jangan terus zoom
             * kalau barcode sudah terlihat.
             */

            return;

          }


          /*
           * BARCODE TIDAK TERLIHAT
           */

          if (
            barcodeTerlihat
          ) {

            const elapsed =
              performance.now() -
              lastBarcodeSeen;


            /*
             * Kalau sudah tidak terlihat
             * selama 350ms,
             * kembali ke 1x.
             */

            if (
              elapsed >
              350
            ) {

              barcodeTerlihat =
                false;


              setZoom(
                zoomMin
              );

            }

          }

        }

        catch(error) {

          /*
           * Jangan spam console.
           */

        }

      },
      120
    );

}


/* =====================================================
   STOP BARCODE DETECTOR
===================================================== */

function hentikanBarcodeDetector() {

  if (
    barcodeDetectorTimer
  ) {

    clearInterval(
      barcodeDetectorTimer
    );

    barcodeDetectorTimer =
      null;

  }


  barcodeDetector =
    null;

  barcodeTerlihat =
    false;

}


/* =====================================================
   AUTO ZOOM
===================================================== */

function mulaiAutoZoom() {

  hentikanAutoZoom();


  if (
    !currentTrack
  ) {

    return;

  }


  /*
   * Jika BarcodeDetector tersedia,
   * auto zoom mengikuti status barcode.
   */

  if (
    barcodeDetector
  ) {

    mulaiAutoZoomDenganDetector();

    return;

  }


  /*
   * Fallback untuk browser yang
   * tidak punya BarcodeDetector.
   */

  mulaiAutoZoomFallback();

}


/* =====================================================
   AUTO ZOOM DENGAN DETECTOR
===================================================== */

function mulaiAutoZoomDenganDetector() {

  /*
   * Tunggu 1 detik di 1x terlebih dahulu.
   *
   * Ini memberi kamera kesempatan
   * membaca barcode dengan ukuran asli.
   */

  let tahap =
    0;


  autoZoomTimer =
    setInterval(
      function() {

        if (
          !scanning ||
          !currentTrack
        ) {

          hentikanAutoZoom();

          return;

        }


        /*
         * Kalau barcode terlihat,
         * jangan zoom.
         */

        if (
          barcodeTerlihat
        ) {

          tahap =
            0;

          return;

        }


        /*
         * =============================================
         * 1X -> 2X
         * =============================================
         */

        if (
          tahap === 0
        ) {

          setZoom(
            Math.min(
              2,
              zoomMax
            )
          );


          tahap =
            1;

          return;

        }


        /*
         * =============================================
         * 2X -> 3X
         * =============================================
         */

        if (
          tahap === 1
        ) {

          setZoom(
            Math.min(
              3,
              zoomMax
            )
          );


          tahap =
            2;

          return;

        }

      },
      1600
    );

}


/* =====================================================
   AUTO ZOOM FALLBACK
===================================================== */

function mulaiAutoZoomFallback() {

  /*
   * Tanpa BarcodeDetector kita tidak bisa
   * benar-benar mengetahui apakah barcode
   * sedang terlihat.
   *
   * Jadi dibuat bertahap:
   *
   * 1x -> tunggu
   * 2x -> tunggu
   * 3x
   */

  let tahap =
    0;


  autoZoomTimer =
    setInterval(
      function() {

        if (
          !scanning ||
          !currentTrack
        ) {

          hentikanAutoZoom();

          return;

        }


        if (
          tahap === 0
        ) {

          setZoom(
            Math.min(
              2,
              zoomMax
            )
          );


          tahap =
            1;

          return;

        }


        if (
          tahap === 1
        ) {

          setZoom(
            Math.min(
              3,
              zoomMax
            )
          );


          tahap =
            2;

          return;

        }


        /*
         * Sudah 3x.
         *
         * Jangan lebih dari 3x.
         */

      },
      1600
    );

}


/* =====================================================
   STOP AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

  if (
    autoZoomTimer
  ) {

    clearInterval(
      autoZoomTimer
    );

    autoZoomTimer =
      null;

  }

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

zoomRange.addEventListener(
  'input',
  function() {

    if (
      !currentTrack
    ) {

      return;

    }


    /*
     * Kalau user mengubah slider,
     * auto zoom dihentikan.
     */

    hentikanAutoZoom();


    const value =
      Number(
        zoomRange.value
      );


    setZoom(
      value
    );

  }
);


/* =====================================================
   TUTUP CAMERA
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  tutupScanner
);


function tutupScanner() {

  scanning =
    false;


  /*
   * Stop auto zoom
   */

  hentikanAutoZoom();


  /*
   * Stop barcode detector
   */

  hentikanBarcodeDetector();


  /*
   * Stop ZXing
   */

  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }


  /*
   * Stop kamera
   */

  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          }

          catch(error) {}

        }
      );

  }


  /*
   * Hapus video stream
   */

  if (
    video.srcObject
  ) {

    video.srcObject =
      null;

  }


  /*
   * Reset variable
   */

  currentStream =
    null;

  currentTrack =
    null;

  codeReader =
    null;

  barcodeDetector =
    null;

  barcodeTerlihat =
    false;

  zoomLevel =
    1;


  /*
   * Reset tampilan zoom
   */

  zoomStatus.textContent =
    'Zoom 1x';

  zoomRange.value =
    1;


  /*
   * Tutup card kamera
   */

  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
