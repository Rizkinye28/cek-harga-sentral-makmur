<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Sentral Makmur - Cek Harga & Stok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      background: #111;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      color: #777;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      color: #555;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #111;
    }

    .stock {
      font-weight: bold;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Sentral Makmur</h1>

    <div class="subtitle">
      Cek Harga & Stok Produk
    </div>

    <div class="search-box">

      <input
        type="text"
        id="keyword"
        placeholder="Cari nama, barcode, atau kode..."
        autocomplete="off"
      >

      <button onclick="cariProduk()">
        CARI
      </button>

    </div>

    <div id="status">
      Silakan cari produk.
    </div>

    <div id="hasil"></div>

  </div>

  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


    /*
     * ENTER = CARI
     */

    document
      .getElementById('keyword')
      .addEventListener(
        'keydown',
        function(event) {

          if (event.key === 'Enter') {
            cariProduk();
          }

        }
      );


    /*
     * CARI PRODUK
     */

    async function cariProduk() {

      const keyword =
        document
          .getElementById('keyword')
          .value
          .trim();


      const status =
        document.getElementById('status');

      const hasil =
        document.getElementById('hasil');


      if (!keyword) {

        status.textContent =
          'Masukkan nama, barcode, atau kode produk.';

        hasil.innerHTML = '';

        return;

      }


      status.textContent =
        'Mencari produk...';

      hasil.innerHTML = '';


      try {

        const url =
          API_URL +
          '?aksi=cari&keyword=' +
          encodeURIComponent(keyword);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          'Response API:',
          data
        );


        if (!data.success) {

          throw new Error(
            data.error ||
            'Gagal mencari produk.'
          );

        }


        tampilkanProduk(
          data.data || []
        );


      }

      catch (error) {

        console.error(error);

        status.textContent = '';

        hasil.innerHTML =
          '<div class="error">' +
          escapeHtml(
            error.message
          ) +
          '</div>';

      }

    }


    /*
     * TAMPILKAN HASIL
     */

    function tampilkanProduk(products) {

      const status =
        document.getElementById('status');

      const hasil =
        document.getElementById('hasil');


      if (
        !products ||
        products.length === 0
      ) {

        status.textContent =
          'Produk tidak ditemukan.';

        hasil.innerHTML = '';

        return;

      }


      status.textContent =
        products.length +
        ' produk ditemukan.';


      hasil.innerHTML =
        products
          .map(function(product) {

            const nama =
              product.nama ||
              product.name ||
              '-';

            const harga =
              product.harga ||
              product.price ||
              '-';

            const stok =
              product.stok ??
              product.stock ??
              0;

            const barcode =
              product.barcode ||
              '-';

            const kode =
              product.kodeAccurate ||
              product.no ||
              '-';

            const satuan =
              product.satuan ||
              'PCS';


            return `

              <div class="product">

                <div class="product-name">
                  ${escapeHtml(nama)}
                </div>

                <div class="row">
                  <span>Harga</span>
                  <span class="price">
                    Rp ${escapeHtml(harga)}
                  </span>
                </div>

                <div class="row">
                  <span>Stok</span>
                  <span class="stock">
                    ${escapeHtml(String(stok))}
                    ${escapeHtml(satuan)}
                  </span>
                </div>

                <div class="row">
                  <span>Barcode</span>
                  <span>
                    ${escapeHtml(barcode)}
                  </span>
                </div>

                <div class="row">
                  <span>Kode</span>
                  <span>
                    ${escapeHtml(kode)}
                  </span>
                </div>

              </div>

            `;

          })
          .join('');

    }


    /*
     * AMANKAN HTML
     */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }

  </script>

</body>
</html>
