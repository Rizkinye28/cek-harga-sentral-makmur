<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Cek Harga - Sentral Makmur</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    /* =========================
       CAMERA
    ========================= */

    #reader {
      width: 100%;
      height: 320px;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 25px;
      z-index: 10;
    }

    .scan-box {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 32%;
      height: 36%;
      border: 2px solid white;
      border-radius: 8px;
      z-index: 20;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.20);
    }

    .scan-line {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 50%;
      height: 2px;
      background: white;
      z-index: 21;
      box-shadow: 0 0 8px white;
    }

    .scan-hint {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 13px;
      z-index: 22;
      text-shadow: 0 1px 4px black;
    }

    /* =========================
       ZOOM
    ========================= */

    #zoomControl {
      display: none;
      margin-top: 12px;
      background: #f1f1f1;
      padding: 12px;
      border-radius: 12px;
    }

    .zoom-title {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .zoom-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .zoom-button {
      width: 58px;
      height: 48px;
      padding: 0;
      margin: 0;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    .zoom-button:active {
      transform: scale(.95);
    }

    #zoomValue {
      min-width: 75px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* =========================
       BUTTON
    ========================= */

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .scan-button {
      background: #1f4e78;
      color: white;
    }

    .stop-button {
      background: #ddd;
      color: #222;
      display: none;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
      margin-top: 18px;
    }

    .search-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .manual {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      text-transform: uppercase;
    }

    .check-button {
      width: auto;
      margin-top: 0;
      background: #1f4e78;
      color: white;
    }

    .clear-button {
      background: #eee;
      color: #222;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      margin-top: 18px;
    }

    .product-card {
      background: #eef8f1;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.4;
    }

    .product-barcode {
      margin-top: 7px;
      font-size: 13px;
      color: #777;
    }

    .price {
      font-size: 38px;
      font-weight: bold;
      margin-top: 10px;
    }

    .result-count {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .result-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 13px;
      padding: 14px;
      margin-top: 9px;
      cursor: pointer;
    }

    .result-item:active {
      transform: scale(.99);
    }

    .result-item-name {
      font-weight: bold;
      line-height: 1.4;
    }

    .result-item-barcode {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .result-item-price {
      font-size: 20px;
      font-weight: bold;
      margin-top: 7px;
    }

    .error {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: #fff1f1;
      color: #b42318;
      text-align: center;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="title">
    SENTRAL MAKMUR
  </div>

  <div class="subtitle">
    CEK HARGA PRODUK
  </div>

  <div class="card">

    <!-- =========================
         CAMERA
    ========================= -->

    <div id="reader">

      <div
        id="cameraMessage"
        class="camera-message">

        Tekan MULAI SCAN untuk membuka kamera

      </div>

    </div>


    <!-- =========================
         ZOOM
    ========================= -->

    <div id="zoomControl">

      <div class="zoom-title">
        🔍 ZOOM KAMERA
      </div>

      <div class="zoom-buttons">

        <button
          id="zoomMinus"
          class="zoom-button"
          onclick="zoomOut()">

          −

        </button>

        <div id="zoomValue">
          1.0×
        </div>

        <button
          id="zoomPlus"
          class="zoom-button"
          onclick="zoomIn()">

          +

        </button>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status">

      Memuat data produk...

    </div>


    <!-- START -->

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()">

      📷 MULAI SCAN

    </button>


    <!-- STOP -->

    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()">

      ⏹ HENTIKAN SCAN

    </button>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-area">

      <div class="search-title">
        🔎 Cari barcode atau nama produk
      </div>

      <div class="manual">

        <input
          id="searchInput"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="AMZ003 / CHOCOLATE">

        <button
          class="check-button"
          onclick="searchProduct()">

          CEK

        </button>

      </div>

      <button
        class="clear-button"
        onclick="clearSearch()">

        HAPUS PENCARIAN

      </button>

    </div>


    <div id="result"></div>

  </div>


  <div class="footer">
    Scan barcode atau cari nama produk
  </div>

</div>


<script>

/* =========================================
   URL APPS SCRIPT
========================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzCIC_CqDz406f9DCpg9hihD_Jgqw5b-yfwjOrNm7F-eRwUeR-D4uSOyi3KqZRTVpw/exec';


/* =========================================
   VARIABLES
========================================= */

let products = [];

let codeReader = null;

let scannerControls = null;

let currentStream = null;

let lastBarcode = '';

let lastScanTime = 0;


/* =========================================
   ZOOM VARIABLES
========================================= */

let zoomTrack = null;

let zoomMin = 1;

let zoomMax = 1;

let zoomStep = 0.1;

let zoomCurrent = 1;


/* =========================================
   LOAD PRODUCTS
========================================= */

function loadProducts() {

  const status =
    document.getElementById('status');

  status.innerText =
    '⏳ Memuat data produk...';


  const callbackName =
    'produkCallback_' + Date.now();


  window[callbackName] =
    function(data) {

      products =
        Array.isArray(data)
          ? data
          : [];


      status.innerText =
        '✓ ' +
        products.length +
        ' produk siap digunakan';


      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }

      delete window[callbackName];

    };


  const script =
    document.createElement('script');


  script.id =
    callbackName;


  script.src =
    API_URL +
    '?callback=' +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      status.innerText =
        '❌ Data produk gagal dimuat';

      tampilkanError(
        'Tidak dapat mengambil data produk.'
      );

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


/* =========================================
   START SCANNER
========================================= */

async function startScanner() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );

    }


    document
      .getElementById('startButton')
      .style.display = 'none';


    document
      .getElementById('stopButton')
      .style.display = 'block';


    const reader =
      document.getElementById('reader');


    reader.innerHTML = '';


    const video =
      document.createElement('video');


    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    video.setAttribute(
      'playsinline',
      ''
    );


    reader.appendChild(video);


    const scanBox =
      document.createElement('div');

    scanBox.className =
      'scan-box';

    reader.appendChild(scanBox);


    const scanLine =
      document.createElement('div');

    scanLine.className =
      'scan-line';

    reader.appendChild(scanLine);


    const hint =
      document.createElement('div');

    hint.className =
      'scan-hint';

    hint.innerText =
      'Arahkan barcode ke dalam kotak';

    reader.appendChild(hint);


    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    let deviceId =
      devices[0].deviceId;


    /* Cari kamera belakang */

    for (
      const device of devices
    ) {

      const label =
        String(
          device.label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {

        deviceId =
          device.deviceId;

        break;

      }

    }


    currentStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            deviceId: {
              exact: deviceId
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            facingMode: {
              ideal: 'environment'
            }

          },

          audio: false

        });


    video.srcObject =
      currentStream;


    await video.play();


    /* =========================
       SETUP ZOOM
    ========================= */

    setupZoom();


    document
      .getElementById('status')
      .innerText =
      '📷 Scanner aktif';


    scannerControls =
      await codeReader
        .decodeFromStream(

          currentStream,

          video,

          function(result, error) {

            if (!result) {
              return;
            }


            const barcode =
              String(
                result.getText()
              )
              .trim()
              .toUpperCase();


            if (!barcode) {
              return;
            }


            const now =
              Date.now();


            /* Hindari scan barcode sama berulang */

            if (
              barcode === lastBarcode &&
              now - lastScanTime < 2000
            ) {

              return;

            }


            lastBarcode =
              barcode;

            lastScanTime =
              now;


            document
              .getElementById('searchInput')
              .value =
              barcode;


            searchBarcode(barcode);

          }

        );

  }

  catch (error) {

    console.error(
      'KAMERA ERROR:',
      error
    );


    tampilkanError(
      'Kamera tidak dapat digunakan.' +
      '<br><br>' +
      aman(
        error.message ||
        error.name ||
        ''
      )
    );


    stopScanner();

  }

}


/* =========================================
   SETUP ZOOM
========================================= */

function setupZoom() {

  const control =
    document.getElementById(
      'zoomControl'
    );


  if (!currentStream) {

    control.style.display =
      'none';

    return;

  }


  const tracks =
    currentStream.getVideoTracks();


  if (
    !tracks ||
    tracks.length === 0
  ) {

    control.style.display =
      'none';

    return;

  }


  const track =
    tracks[0];


  zoomTrack =
    track;


  /*
   * Cek apakah browser
   * menyediakan kemampuan zoom
   */

  if (
    !track.getCapabilities
  ) {

    control.style.display =
      'none';

    return;

  }


  const capabilities =
    track.getCapabilities();


  if (!capabilities.zoom) {

    control.style.display =
      'none';

    return;

  }


  zoomMin =
    Number(
      capabilities.zoom.min || 1
    );


  zoomMax =
    Number(
      capabilities.zoom.max || 3
    );


  zoomStep =
    Number(
      capabilities.zoom.step || 0.1
    );


  /*
   * Batasi maksimal 3x
   */

  zoomMax =
    Math.min(
      zoomMax,
      3
    );


  /*
   * Mulai dari 1x
   */

  zoomCurrent =
    Math.max(
      1,
      zoomMin
    );


  control.style.display =
    'block';


  updateZoomDisplay();


  applyZoom();

}


/* =========================================
   ZOOM IN
========================================= */

function zoomIn() {

  if (!zoomTrack) {
    return;
  }


  zoomCurrent =
    zoomCurrent +
    zoomStep;


  if (
    zoomCurrent >
    zoomMax
  ) {

    zoomCurrent =
      zoomMax;

  }


  zoomCurrent =
    roundZoom(
      zoomCurrent
    );


  applyZoom();

}


/* =========================================
   ZOOM OUT
========================================= */

function zoomOut() {

  if (!zoomTrack) {
    return;
  }


  zoomCurrent =
    zoomCurrent -
    zoomStep;


  if (
    zoomCurrent <
    zoomMin
  ) {

    zoomCurrent =
      zoomMin;

  }


  zoomCurrent =
    roundZoom(
      zoomCurrent
    );


  applyZoom();

}


/* =========================================
   APPLY ZOOM
========================================= */

function applyZoom() {

  if (!zoomTrack) {
    return;
  }


  try {

    zoomTrack.applyConstraints({

      advanced: [
        {
          zoom: zoomCurrent
        }
      ]

    });


    updateZoomDisplay();

  }

  catch (error) {

    console.log(
      'Zoom tidak dapat digunakan:',
      error
    );

  }

}


/* =========================================
   UPDATE ZOOM DISPLAY
========================================= */

function updateZoomDisplay() {

  document
    .getElementById('zoomValue')
    .innerText =
      Number(
        zoomCurrent
      ).toFixed(1) +
      '×';

}


/* =========================================
   ROUND ZOOM
========================================= */

function roundZoom(value) {

  return Math.round(
    value * 10
  ) / 10;

}


/* =========================================
   STOP SCANNER
========================================= */

function stopScanner() {

  try {

    if (scannerControls) {
      scannerControls.stop();
    }

  } catch (e) {}


  scannerControls = null;


  try {

    if (codeReader) {
      codeReader.reset();
    }

  } catch (e) {}


  codeReader = null;


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

  }


  currentStream = null;

  zoomTrack = null;


  document
    .getElementById('zoomControl')
    .style.display =
    'none';


  document
    .getElementById('stopButton')
    .style.display =
    'none';


  document
    .getElementById('startButton')
    .style.display =
    'block';


  document
    .getElementById('reader')
    .innerHTML =

      '<div class="camera-message">' +
        'Tekan MULAI SCAN untuk membuka kamera' +
      '</div>';

}


/* =========================================
   SEARCH
========================================= */

function searchProduct() {

  const input =
    document.getElementById('searchInput');


  const keyword =
    String(
      input.value || ''
    )
    .trim()
    .toUpperCase();


  input.value =
    keyword;


  if (!keyword) {

    tampilkanError(
      'Masukkan barcode atau nama produk.'
    );

    return;

  }


  /*
   * PRIORITAS 1:
   * Barcode cocok persis
   */

  const exact =
    products.find(
      function(product) {

        return (
          String(
            product.barcode || ''
          )
          .trim()
          .toUpperCase() ===
          keyword
        );

      }
    );


  if (exact) {

    tampilkanProduk(exact);

    return;

  }


  /*
   * PRIORITAS 2:
   * Cari nama produk
   */

  const hasil =
    products.filter(
      function(product) {

        const name =
          String(
            product.name || ''
          )
          .toUpperCase();


        return name.includes(
          keyword
        );

      }
    );


  if (hasil.length === 0) {

    tampilkanError(
      'Produk tidak ditemukan.' +
      '<br><br>' +
      'Pencarian: ' +
      aman(keyword)
    );

    return;

  }


  if (hasil.length === 1) {

    tampilkanProduk(
      hasil[0]
    );

    return;

  }


  tampilkanDaftar(hasil);

}


/* =========================================
   SEARCH BARCODE
========================================= */

function searchBarcode(barcode) {

  const product =
    products.find(
      function(item) {

        return (
          String(
            item.barcode || ''
          )
          .trim()
          .toUpperCase() ===
          barcode
        );

      }
    );


  if (product) {

    tampilkanProduk(product);

  }

  else {

    tampilkanError(
      'Barcode tidak ditemukan.' +
      '<br><br>' +
      'Barcode: ' +
      aman(barcode)
    );

  }

}


/* =========================================
   SHOW ONE PRODUCT
========================================= */

function tampilkanProduk(product) {

  document
    .getElementById('result')
    .innerHTML =

      '<div class="product-card">' +

        '<div class="product-name">' +
          aman(product.name) +
        '</div>' +

        '<div class="product-barcode">' +
          'Barcode: ' +
          aman(product.barcode) +
        '</div>' +

        '<div class="price">' +
          'Rp ' +
          aman(product.price) +
        '</div>' +

      '</div>';

}


/* =========================================
   SHOW MULTIPLE PRODUCTS
========================================= */

function tampilkanDaftar(hasil) {

  let html =
    '<div class="result-count">' +
      '🔎 Ditemukan ' +
      hasil.length +
      ' produk' +
    '</div>';


  hasil.forEach(
    function(product, index) {

      html +=

        '<div class="result-item" ' +
        'onclick="pilihProduk(' +
        index +
        ')">' +

          '<div class="result-item-name">' +
            aman(product.name) +
          '</div>' +

          '<div class="result-item-barcode">' +
            'Barcode: ' +
            aman(product.barcode) +
          '</div>' +

          '<div class="result-item-price">' +
            'Rp ' +
            aman(product.price) +
          '</div>' +

        '</div>';

    }
  );


  window.hasilPencarian =
    hasil;


  document
    .getElementById('result')
    .innerHTML =
    html;

}


/* =========================================
   SELECT PRODUCT
========================================= */

function pilihProduk(index) {

  const product =
    window.hasilPencarian[index];


  if (!product) {
    return;
  }


  document
    .getElementById('searchInput')
    .value =
    String(
      product.barcode || ''
    ).toUpperCase();


  tampilkanProduk(product);

}


/* =========================================
   CLEAR
========================================= */

function clearSearch() {

  document
    .getElementById('searchInput')
    .value = '';


  document
    .getElementById('result')
    .innerHTML = '';

}


/* =========================================
   ERROR
========================================= */

function tampilkanError(message) {

  document
    .getElementById('result')
    .innerHTML =

      '<div class="error">' +
        message +
      '</div>';

}


/* =========================================
   SAFE TEXT
========================================= */

function aman(text) {

  return String(text)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================
   INPUT OTOMATIS KAPITAL
========================================= */

document
  .getElementById('searchInput')
  .addEventListener(
    'input',
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


/* =========================================
   ENTER
========================================= */

document
  .getElementById('searchInput')
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        searchProduct();

      }

    }
  );


/* =========================================
   LOAD DATA SAAT HALAMAN DIBUKA
========================================= */

loadProducts();

</script>

</body>

</html>
