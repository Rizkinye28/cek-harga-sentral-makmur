<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sentral Makmur - Cek Harga & Stok</title>

<script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #151515;
}

.container {
  width: min(100% - 32px, 900px);
  margin: 0 auto;
}

header {
  text-align: center;
  padding: 42px 0 30px;
}

.logo {
  width: 105px;
  height: 105px;
  margin: 0 auto 22px;
  border-radius: 30px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 800;
  box-shadow: 0 12px 30px rgba(0,0,0,.12);
}

h1 {
  margin: 0;
  font-size: 36px;
}

.subtitle {
  margin-top: 8px;
  color: #777;
  font-size: 18px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input-wrap {
  flex: 1;
  position: relative;
}

input {
  width: 100%;
  height: 58px;
  padding: 0 48px 0 18px;
  border: 2px solid #ddd;
  border-radius: 16px;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #111;
}

.clear {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  font-size: 25px;
  color: #777;
  cursor: pointer;
  display: none;
}

button {
  border: none;
  border-radius: 16px;
  padding: 0 25px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-gray {
  background: #eee;
  color: #555;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.action-row button {
  height: 52px;
  flex: 1;
}


/* =====================================================
   CAMERA
===================================================== */

.scanner-card {
  margin-top: 18px;
  background: #111;
  border-radius: 24px;
  padding: 16px;
  display: none;
}

.scanner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  margin-bottom: 12px;
}

.scanner-title {
  font-size: 17px;
  font-weight: 700;
}

.camera-status {
  color: #aaa;
  font-size: 13px;
  margin-top: 8px;
  text-align: center;
}

.close-camera {
  background: #333;
  color: white;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.video-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
}

video {
  width: 100%;
  display: block;
  min-height: 250px;
  object-fit: cover;
}

.scan-box {
  position: absolute;
  width: 72%;
  height: 32%;
  left: 14%;
  top: 34%;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 15px;
  pointer-events: none;
}

.scan-corner {
  position: absolute;
  width: 25px;
  height: 25px;
  border-color: white;
  border-style: solid;
}

.corner-tl {
  left: -2px;
  top: -2px;
  border-width: 4px 0 0 4px;
  border-radius: 10px 0 0 0;
}

.corner-tr {
  right: -2px;
  top: -2px;
  border-width: 4px 4px 0 0;
  border-radius: 0 10px 0 0;
}

.corner-bl {
  left: -2px;
  bottom: -2px;
  border-width: 0 0 4px 4px;
  border-radius: 0 0 0 10px;
}

.corner-br {
  right: -2px;
  bottom: -2px;
  border-width: 0 4px 4px 0;
  border-radius: 0 0 10px 0;
}

.scan-line {
  position: absolute;
  left: 16%;
  right: 16%;
  top: 50%;
  height: 2px;
  background: white;
  opacity: .85;
  animation: scanMove 2s linear infinite;
}

@keyframes scanMove {

  0% {
    transform: translateY(-45px);
  }

  50% {
    transform: translateY(45px);
  }

  100% {
    transform: translateY(-45px);
  }

}

.zoom-control {
  margin-top: 12px;
  color: white;
}

.zoom-control input {
  width: 100%;
  height: auto;
  padding: 0;
  margin-top: 8px;
}


/* =====================================================
   RESULT
===================================================== */

.result-card {
  margin-top: 18px;
  background: white;
  border-radius: 24px;
  padding: 30px;
  min-height: 220px;
  box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.empty {
  text-align: center;
  color: #777;
  padding: 35px 10px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-title {
  font-size: 22px;
  font-weight: 700;
  color: #333;
  margin-bottom: 8px;
}

.product {
  display: none;
}

.product-name {
  font-size: 27px;
  font-weight: 800;
  margin-bottom: 20px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.info {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 16px;
}

.label {
  font-size: 13px;
  color: #777;
  margin-bottom: 6px;
}

.value {
  font-size: 19px;
  font-weight: 700;
}

.stock {
  background: #111;
  color: white;
}

.stock .label {
  color: #bbb;
}

.stock .value {
  font-size: 26px;
}

.search-results {
  display: none;
  margin-top: 15px;
}

.result-item {
  background: #f5f5f5;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 9px;
  cursor: pointer;
}

.result-item:hover {
  background: #eaeaea;
}

.result-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.result-item-code {
  color: #777;
  font-size: 13px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.error {
  text-align: center;
  color: #b00020;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 40px 0;
  color: #aaa;
  font-size: 14px;
}


@media(max-width:600px) {

  header {
    padding-top: 25px;
  }

  h1 {
    font-size: 28px;
  }

  .logo {
    width: 85px;
    height: 85px;
    font-size: 32px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    height: 54px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .result-card {
    padding: 22px;
  }

  .product-name {
    font-size: 22px;
  }

}

</style>

</head>


<body>


<div class="container">


<header>

  <div class="logo">
    SM
  </div>

  <h1>
    Sentral Makmur
  </h1>

  <div class="subtitle">
    Cek Harga & Stok Produk
  </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-card">

  <div class="search-row">

    <div class="search-input-wrap">

      <input
        id="searchInput"
        type="text"
        placeholder="Cari nama, kode, atau barcode..."
        autocomplete="off"
      >

      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>

    <button
      id="searchBtn"
      class="btn-black"
      type="button"
    >
      Cari
    </button>

  </div>


  <div class="action-row">

    <button
      id="scanBtn"
      class="btn-black"
      type="button"
    >
      📷 Scan Barcode
    </button>

    <button
      id="resetBtn"
      class="btn-gray"
      type="button"
    >
      Reset
    </button>

  </div>

</section>


<!-- =====================================================
     CAMERA
===================================================== -->

<section
  id="scannerCard"
  class="scanner-card"
>

  <div class="scanner-header">

    <div class="scanner-title">
      📷 Scan Barcode
    </div>

    <button
      id="closeCameraBtn"
      class="close-camera"
      type="button"
    >
      Tutup
    </button>

  </div>


  <div class="video-wrap">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="scan-box">

      <div class="scan-corner corner-tl"></div>
      <div class="scan-corner corner-tr"></div>
      <div class="scan-corner corner-bl"></div>
      <div class="scan-corner corner-br"></div>

    </div>

    <div class="scan-line"></div>

  </div>


  <div
    id="cameraStatus"
    class="camera-status"
  >
    Mencari barcode...
  </div>


  <div
    id="zoomControl"
    class="zoom-control"
  >

    Zoom

    <input
      id="zoomRange"
      type="range"
      min="1"
      max="1"
      step="0.1"
      value="1"
    >

  </div>

</section>


<!-- =====================================================
     SEARCH RESULTS
===================================================== -->

<div
  id="searchResults"
  class="search-results"
></div>


<!-- =====================================================
     RESULT
===================================================== -->

<section
  id="resultCard"
  class="result-card"
>

  <div
    id="emptyState"
    class="empty"
  >

    <div class="empty-icon">
      🔎
    </div>

    <div class="empty-title">
      Cari produk
    </div>

    <div>
      Ketik nama barang, kode Accurate,
      atau barcode untuk melihat harga dan stok.
    </div>

  </div>


  <div
    id="loading"
    class="loading"
    style="display:none;"
  >
    Mengambil data stok dari Accurate...
  </div>


  <div
    id="errorState"
    class="error"
    style="display:none;"
  ></div>


  <div
    id="product"
    class="product"
  >

    <div
      id="productName"
      class="product-name"
    ></div>


    <div class="info-grid">

      <div class="info">

        <div class="label">
          Barcode
        </div>

        <div
          id="productBarcode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Kode Accurate
        </div>

        <div
          id="productCode"
          class="value"
        ></div>

      </div>


      <div class="info">

        <div class="label">
          Harga
        </div>

        <div
          id="productPrice"
          class="value"
        ></div>

      </div>


      <div class="info stock">

        <div class="label">
          Stok
        </div>

        <div
          id="productStock"
          class="value"
        ></div>

      </div>

    </div>

  </div>

</section>


<footer>

  Sentral Makmur • API Harga & Stok

</footer>


</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbw8Dpkd4Z7-oidp3Y-g_25jPFXa5swegCUe5eeW9KcR_lvdFD_BvJu9gqzrDDSJSPw/exec';


/* =====================================================
   ELEMENT
===================================================== */

const searchInput =
  document.getElementById('searchInput');

const searchBtn =
  document.getElementById('searchBtn');

const scanBtn =
  document.getElementById('scanBtn');

const resetBtn =
  document.getElementById('resetBtn');

const clearBtn =
  document.getElementById('clearBtn');

const scannerCard =
  document.getElementById('scannerCard');

const closeCameraBtn =
  document.getElementById('closeCameraBtn');

const video =
  document.getElementById('video');

const zoomRange =
  document.getElementById('zoomRange');

const emptyState =
  document.getElementById('emptyState');

const loading =
  document.getElementById('loading');

const errorState =
  document.getElementById('errorState');

const product =
  document.getElementById('product');

const searchResults =
  document.getElementById('searchResults');


/* =====================================================
   ZXING
===================================================== */

let codeReader = null;
let currentStream = null;
let currentTrack = null;

let scanning = false;

let autoZoomTimer = null;
let currentAutoZoom = 1;

let masterCache = null;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


/*
 * Siapkan audio ketika tombol Scan ditekan.
 * Ini penting karena browser biasanya memblokir
 * audio yang dibuat tanpa interaksi pengguna.
 */

function siapkanAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === 'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch(error) {

    console.log(
      'Audio tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   SUARA BIP
===================================================== */

function bunyiBeep() {

  try {

    siapkanAudio();

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      'sine';

    oscillator.frequency.setValueAtTime(
      880,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.18
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.18
    );

  }

  catch(error) {

    console.log(
      'Beep gagal:',
      error
    );

  }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  try {

    if (
      navigator.vibrate
    ) {

      /*
       * Getaran pendek:
       * 80ms
       */

      navigator.vibrate(
        80
      );

    }

  }

  catch(error) {

    console.log(
      'Getar tidak tersedia:',
      error
    );

  }

}


/* =====================================================
   SUARA + GETAR
===================================================== */

function feedbackBerhasil() {

  bunyiBeep();

  getarBerhasil();

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    searchInput.focus();

  }
);


/* =====================================================
   CLEAR
===================================================== */

searchInput.addEventListener(
  'input',
  function() {

    clearBtn.style.display =
      searchInput.value
        ? 'block'
        : 'none';

  }
);


clearBtn.addEventListener(
  'click',
  function() {

    searchInput.value = '';

    clearBtn.style.display =
      'none';

    resetResult();

    searchInput.focus();

  }
);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter'
    ) {

      cari();

    }

  }
);


/* =====================================================
   SEARCH MASTER CACHE
===================================================== */

/*
 * Ambil Master Produk hanya sekali.
 *
 * Setelah itu pencarian berikutnya dilakukan
 * langsung di browser.
 *
 * Ini membuat pencarian manual jauh lebih cepat.
 */

async function ambilMasterCache() {

  if (
    Array.isArray(masterCache)
  ) {

    return masterCache;

  }


  const response =
    await fetch(
      API_URL +
      '?aksi=master'
    );


  const json =
    await response.json();


  if (
    !json.success ||
    !Array.isArray(json.data)
  ) {

    throw new Error(
      'Master Produk tidak tersedia.'
    );

  }


  masterCache =
    json.data;


  return masterCache;

}


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(
  value
) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   CARI
===================================================== */

searchBtn.addEventListener(
  'click',
  cari
);


async function cari() {

  const keyword =
    searchInput.value.trim();


  if (!keyword) {

    resetResult();

    return;

  }


  tutupScanner();

  tampilLoading();


  try {

    /*
     * Cari dari cache browser.
     */

    const master =
      await ambilMasterCache();


    const target =
      normalisasi(
        keyword
      );


    const hasil =
      master.filter(
        function(item) {

          const barcode =
            normalisasi(
              item.barcode
            );

          const nama =
            normalisasi(
              item.nama ||
              item.name
            );

          const kode =
            normalisasi(
              item.kodeAccurate ||
              item.no
            );

          const id =
            normalisasi(
              item.id
            );


          return (

            barcode.includes(target)

            ||

            nama.includes(target)

            ||

            kode.includes(target)

            ||

            id === target

          );

        }
      );


    if (
      hasil.length === 0
    ) {

      tampilError(
        'Produk tidak ditemukan di Master Produk.'
      );

      return;

    }


    /*
     * Hanya satu produk:
     * langsung ambil stok.
     */

    if (
      hasil.length === 1
    ) {

      await tampilProduk(
        hasil[0]
      );

      return;

    }


    /*
     * Banyak hasil.
     */

    tampilDaftarHasil(
      hasil.slice(
        0,
        50
      )
    );

  }

  catch(error) {

    console.error(
      error
    );

    tampilError(
      'Tidak dapat mengambil data produk.'
    );

  }

}


/* =====================================================
   TAMPIL DAFTAR HASIL
===================================================== */

function tampilDaftarHasil(
  data
) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'block';

  searchResults.innerHTML =
    '';


  data.forEach(
    function(item) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'result-item';


      div.innerHTML =

        '<div class="result-item-name">' +

        escapeHtml(
          item.nama ||
          item.name ||
          '-'
        ) +

        '</div>' +

        '<div class="result-item-code">' +

        'Barcode: ' +

        escapeHtml(
          item.barcode ||
          '-'
        ) +

        ' • Kode: ' +

        escapeHtml(
          item.kodeAccurate ||
          item.no ||
          '-'
        ) +

        '</div>';


      div.addEventListener(
        'click',
        function() {

          tampilProduk(
            item
          );

        }
      );


      searchResults.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   TAMPIL PRODUK + STOK
===================================================== */

async function tampilProduk(
  item
) {

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  loading.style.display =
    'block';


  try {

    const params =
      new URLSearchParams();


    params.set(
      'aksi',
      'stok'
    );


    /*
     * ID Accurate tetap diprioritaskan.
     */

    if (item.id) {

      params.set(
        'id',
        item.id
      );

    }


    if (item.barcode) {

      params.set(
        'barcode',
        item.barcode
      );

    }


    if (
      item.kodeAccurate
    ) {

      params.set(
        'kode',
        item.kodeAccurate
      );

    }


    const response =
      await fetch(
        API_URL +
        '?' +
        params.toString()
      );


    const json =
      await response.json();


    if (
      !json.success
    ) {

      tampilError(
        json.error ||
        'Stok gagal diambil dari Accurate.'
      );

      return;

    }


    const data =
      json.data;


    document.getElementById(
      'productName'
    ).textContent =
      data.nama ||
      '-';


    document.getElementById(
      'productBarcode'
    ).textContent =
      data.barcode ||
      '-';


    document.getElementById(
      'productCode'
    ).textContent =
      data.kodeAccurate ||
      '-';


    document.getElementById(
      'productPrice'
    ).textContent =
      data.harga ||
      '-';


    document.getElementById(
      'productStock'
    ).textContent =

      String(
        data.stok ??
        data.stock ??
        0
      ) +

      ' ' +

      (
        data.satuan ||
        'PCS'
      );


    loading.style.display =
      'none';

    product.style.display =
      'block';


    /*
     * PRODUK BERHASIL TAMPIL
     * → BIP
     * → GETAR
     */

    feedbackBerhasil();

  }

  catch(error) {

    console.error(
      error
    );

    tampilError(
      'Gagal mengambil stok dari Accurate.'
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading() {

  emptyState.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  loading.style.display =
    'block';

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(
  message
) {

  emptyState.style.display =
    'none';

  loading.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  errorState.textContent =
    message;

  errorState.style.display =
    'block';

}


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  'click',
  function() {

    searchInput.value =
      '';

    clearBtn.style.display =
      'none';

    resetResult();

    tutupScanner();

    searchInput.focus();

  }
);


function resetResult() {

  emptyState.style.display =
    'block';

  loading.style.display =
    'none';

  errorState.style.display =
    'none';

  product.style.display =
    'none';

  searchResults.style.display =
    'none';

  searchResults.innerHTML =
    '';

}


/* =====================================================
   SCANNER
===================================================== */

scanBtn.addEventListener(
  'click',
  function() {

    /*
     * Browser mengizinkan audio karena
     * ini berasal dari klik pengguna.
     */

    siapkanAudio();

    bukaScanner();

  }
);


async function bukaScanner() {

  scannerCard.style.display =
    'block';


  try {

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    const devices =
      await codeReader.listVideoInputDevices();


    if (
      !devices.length
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /*
     * PRIORITAS KAMERA BELAKANG
     */

    let deviceId =
      devices[0].deviceId;


    const belakang =
      devices.find(
        function(device) {

          const label =
            (
              device.label ||
              ''
            ).toLowerCase();


          return (

            label.includes(
              'back'
            )

            ||

            label.includes(
              'rear'
            )

            ||

            label.includes(
              'environment'
            )

          );

        }
      );


    if (belakang) {

      deviceId =
        belakang.deviceId;

    }


    scanning =
      true;


    await codeReader.decodeFromVideoDevice(
      deviceId,
      video,
      function(result, error) {

        if (
          result &&
          scanning
        ) {

          /*
           * HENTIKAN AUTO ZOOM
           * sebelum proses produk.
           */

          hentikanAutoZoom();


          scanning =
            false;


          const text =
            result.getText();


          searchInput.value =
            text;


          clearBtn.style.display =
            'block';


          /*
           * Tutup kamera.
           */

          tutupScanner();


          /*
           * LANGSUNG CARI
           */

          cari();

        }

      }
    );


    /*
     * Ambil stream kamera.
     */

    currentStream =
      video.srcObject;


    if (
      currentStream
    ) {

      const tracks =
        currentStream.getVideoTracks();


      if (
        tracks.length
      ) {

        currentTrack =
          tracks[0];


        /*
         * Aktifkan zoom.
         */

        aktifkanZoom(
          currentTrack
        );

      }

    }

  }

  catch(error) {

    console.error(
      error
    );


    hentikanAutoZoom();


    scannerCard.style.display =
      'none';


    alert(
      'Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
    );

  }

}


/* =====================================================
   ZOOM
===================================================== */

function aktifkanZoom(
  track
) {

  try {

    const capabilities =
      track.getCapabilities();


    if (
      !capabilities.zoom
    ) {

      zoomRange.style.display =
        'none';

      return;

    }


    const min =
      capabilities.zoom.min;


    const max =
      capabilities.zoom.max;


    const step =
      capabilities.zoom.step ||
      0.1;


    zoomRange.min =
      min;

    zoomRange.max =
      max;

    zoomRange.step =
      step;


    zoomRange.style.display =
      'block';


    /*
     * =============================================
     * AUTO ZOOM CEPAT
     * =============================================
     *
     * Mulai langsung sekitar 2x.
     *
     * Kalau barcode belum terbaca,
     * zoom naik otomatis.
     */

    currentAutoZoom =
      Math.min(
        max,
        Math.max(
          min,
          2
        )
      );


    terapkanZoom(
      track,
      currentAutoZoom
    );


    /*
     * Auto zoom sangat cepat.
     *
     * Setiap 600ms naik.
     */

    hentikanAutoZoom();


    autoZoomTimer =
      setInterval(
        function() {

          if (
            !scanning ||
            !currentTrack
          ) {

            return;

          }


          /*
           * Naik 0.5x setiap langkah.
           */

          let nextZoom =
            currentAutoZoom +
            Math.max(
              step,
              0.5
            );


          /*
           * Jangan melebihi maksimum.
           */

          nextZoom =
            Math.min(
              max,
              nextZoom
            );


          /*
           * Kalau sudah maksimum,
           * jangan terus menerapkan constraint.
           */

          if (
            nextZoom <=
            currentAutoZoom
          ) {

            return;

          }


          currentAutoZoom =
            nextZoom;


          terapkanZoom(
            track,
            currentAutoZoom
          );

        },
        600
      );

  }

  catch(error) {

    console.log(
      'Zoom tidak tersedia:',
      error
    );

    zoomRange.style.display =
      'none';

  }

}


/* =====================================================
   TERAPKAN ZOOM
===================================================== */

function terapkanZoom(
  track,
  zoom
) {

  if (
    !track
  ) {

    return;

  }


  track.applyConstraints({

    advanced: [

      {
        zoom:
          zoom
      }

    ]

  }).catch(
    function(error) {

      console.log(
        'Gagal menerapkan zoom:',
        error
      );

    }
  );

}


/* =====================================================
   HENTIKAN AUTO ZOOM
===================================================== */

function hentikanAutoZoom() {

  if (
    autoZoomTimer
  ) {

    clearInterval(
      autoZoomTimer
    );

    autoZoomTimer =
      null;

  }

}


/* =====================================================
   MANUAL ZOOM
===================================================== */

zoomRange.addEventListener(
  'input',
  function() {

    if (
      !currentTrack
    ) {

      return;

    }


    const value =
      Number(
        zoomRange.value
      );


    currentAutoZoom =
      value;


    terapkanZoom(
      currentTrack,
      value
    );

  }
);


/* =====================================================
   TUTUP CAMERA
===================================================== */

closeCameraBtn.addEventListener(
  'click',
  tutupScanner
);


function tutupScanner() {

  scanning =
    false;


  hentikanAutoZoom();


  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }


  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  if (
    video.srcObject
  ) {

    video.srcObject =
      null;

  }


  currentStream =
    null;

  currentTrack =
    null;


  scannerCard.style.display =
    'none';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
